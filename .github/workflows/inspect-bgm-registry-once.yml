name: Inspect BGM registry once
on:
  push:
    branches: [chatgpt/add-atsu-cup-theme]
    paths:
      - .github/workflows/inspect-bgm-registry-once.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show BGM registry
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('monster-hero/src/game-system.jsx')
          s=p.read_text()
          for needle in ['const BGM_TRACKS','BGM_TRACKS =','BGM_TRACK_BY_ID']:
              i=s.find(needle)
              if i>=0:
                  print('FOUND', needle, 'AT', i)
                  print(s[i:i+8000])
                  break
          else:
              raise SystemExit('BGM registry not found')
          PY
