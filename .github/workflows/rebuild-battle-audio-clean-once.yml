name: Rebuild battle audio controls clean once
on:
  push:
    branches:
      - chatgpt/battle-audio-controls-clean
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/battle-audio-controls-clean
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install locked tool dependencies
        working-directory: tools
        run: npm ci --omit=optional
      - name: Build canonical output
        run: node tools/build.js
      - name: Checks
        run: |
          node tools/audio/auto-bgm-runtime-picker-check.js
          node tools/audio/auto-bgm-loop-continuity-check.js
          node tools/audio/auto-ultra-bgm-check.js
          node tools/audio/auto-repeat-result-bgm-check.js
          node tools/audio/bgm-arrangement-check.js
          node tools/check-syntax.js
          node tools/undefined-reference-check.js
          node tools/help-coverage-check.js
          node tools/help-guide-check.js
          node tools/help-render-check.js
          node tools/update-notice-check.js
          node tools/build.js --check
          git diff --check
      - name: Remove temporary workflow
        run: rm -f .github/workflows/rebuild-battle-audio-clean-once.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync canonical battle audio build"
          git push origin HEAD:chatgpt/battle-audio-controls-clean
