name: Temporary mhsave index sync

on:
  push:
    branches:
      - chatgpt/mhsave-backup
    paths:
      - .github/workflows/mhsave-index-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/mhsave-backup
      - name: Sync rhythm release cache metadata
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const dataPath = 'monster-hero/data/rhythm-step3-release.js';
          const indexPath = 'monster-hero/index.html';
          const bytes = fs.readFileSync(dataPath);
          const hash = crypto.createHash('sha256').update(bytes).digest('hex').slice(0, 12);
          let index = fs.readFileSync(indexPath, 'utf8');
          const sizeBefore = index;
          index = index.replace(/"data\/rhythm-step3-release\.js":\d+/, `"data/rhythm-step3-release.js":${bytes.length}`);
          index = index.replace(/data\/rhythm-step3-release\.js\?v=[^"]+/, `data/rhythm-step3-release.js?v=${hash}`);
          if (index === sizeBefore) throw new Error('index.html cache metadata was not updated');
          fs.writeFileSync(indexPath, index);
          console.log(`rhythm-step3-release.js: ${hash} / ${bytes.length} bytes`);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monster-hero/index.html
          git commit -m "build: sync mhsave data cache metadata"
          git push origin HEAD:chatgpt/mhsave-backup
