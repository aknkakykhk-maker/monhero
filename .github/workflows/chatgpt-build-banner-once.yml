name: ChatGPT one-time banner build

on:
  pull_request:

permissions:
  contents: write
  pull-requests: read

jobs:
  build-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install locked tool dependencies
        working-directory: tools
        run: npm ci --omit=optional
      - name: Run canonical build without changelog rewrite
        run: node tools/build.js
      - name: Commit generated release stamp
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monster-hero/src/game-system.jsx monster-hero/game-system.compiled.js monster-hero/version.json monster-hero/index.html monster-hero/data/images/images-ally.js monster-hero/data/images/images-enemy.js monster-hero/data/breeder.js
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "build: stamp update banner release"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi
