name: Apply simultaneous rhythm input fix on latest main

on:
  push:
    branches:
      - chatgpt/rhythm-simultaneous-input-final-v2

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chatgpt/rhythm-simultaneous-input-final-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Apply validated simultaneous-input patch
        run: |
          git show 51842d7abe359a7c5e9f9d6cd08b81a2687da699:.github/rhythm-simultaneous-input-final.py > /tmp/rhythm-fix.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/rhythm-fix.py')
          s=p.read_text()
          old="foundation.find('const logic=game.match/', start)"
          new="foundation.find('const logic=game.match(', start)"
          if s.count(old)!=1:
              raise SystemExit(f'patch locator count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          python3 /tmp/rhythm-fix.py
          git show d3aa7b12c41104940b1e68190961b676d52916fc:tools/mode/rhythm-mode-tap-completion-check.js > tools/mode/rhythm-mode-tap-completion-check.js
      - name: Install locked tool dependencies
        working-directory: tools
        run: npm ci --omit=optional
      - name: Build canonical output
        run: |
          node tools/build.js
          node tools/build.js --check
      - name: Run rhythm and regression checks
        run: |
          node tools/check-syntax.js
          node tools/undefined-reference-check.js
          node tools/jsx-text-brace-check.js
          node tools/mode/rhythm-mode-foundation-check.js
          node tools/mode/rhythm-mode-tap-engine-check.js
          node tools/mode/rhythm-mode-tap-completion-check.js
          node tools/mode/rhythm-mode-hold-engine-check.js
          node tools/mode/rhythm-mode-multitouch-check.js
          node tools/mode/rhythm-mode-simultaneous-input-check.js
          node tools/help-coverage-check.js
          node tools/help-guide-check.js
          node tools/help-render-check.js
          git diff --check
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/rhythm-simultaneous-input-final-v2.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: batch simultaneous rhythm touches"
          git push origin HEAD:chatgpt/rhythm-simultaneous-input-final-v2
