name: ChatGPT mission reward refresh

on:
  push:
    branches:
      - chatgpt/mission-reward-refresh-20260829

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Align patch matchers with current source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.chatgpt/patch_mission_rewards.py')
          s=p.read_text()

          # 固有技リセット券: 現在の関数本体へ限定して、成功return直前だけ加算する。
          start=s.index("src = replace_once(src,\n\"\"\"    Audio_.se.tap();")
          label=s.index("'unique reset item use')", start)
          end=s.index("\n", label)+1
          new="""src = regex_once(src,\n    r\"(const useUniqueSkillResetTicket = \\(masuId\\) => \\{.*?)(\\n    Audio_\\.se\\.tap\\(\\);\\n    return result;\\n  \\};)\",\n    r\"\\1\\n    void saveMissionProgress('itemUse',1);\\2\",\n    'unique reset item use', re.S)\n"""
          s=s[:start]+new+s[end:]

          # 超越の実: 二重保存確認が成功しstate反映まで終わった直後だけ、実消費数を加算する。
          start=s.index("src = regex_once(src,\n    r\"(const commitTranscendFruit")
          label=s.index("'transcend fruit item use'", start)
          end=s.index("\n", label)+1
          new="""src = replace_once(src,\n    \"      setTranscendFruitConfirmAmount(0);\\n      return result;\",\n    \"      setTranscendFruitConfirmAmount(0);\\n      await saveMissionProgress('itemUse',Math.max(1,Math.floor(Number(amount)||1)));\\n      return result;\",\n    'transcend fruit item use')\n"""
          s=s[:start]+new+s[end:]

          # スキップチケットは従来仕様どおりミッション進捗の対象外にする。
          start=s.index("src = replace_once(src,\n\"\"\"      setOwnedItems(nextItems);")
          label=s.index("'skip item use'", start)
          end=s.index("\n", label)+1
          s=s[:start]+s[end:]
          p.write_text(s)
          PY
      - name: Apply requested changes
        run: python3 .chatgpt/patch_mission_rewards.py
      - name: Update related legacy checks for dynamic mission definitions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # skip-ticket-check: mission定義の位置変更に追従する。
          p=Path('tools/mode/skip-ticket-check.js')
          s=p.read_text()
          old="""vm.runInContext([\n  grab(source, 'const LOGIN_BONUS_REWARDS = [', 'const LOGIN_BONUS_DEFAULT'),\n  grab(source, 'const MISSION_DEFS = {', 'const missionDailyPeriod'),\n  'globalThis.__r={LOGIN_BONUS_REWARDS,GIFT_REWARD_LABELS,MISSION_DEFS};',\n].join('\\n'), rewardCtx);"""
          new="""vm.runInContext(\n  grab(source, 'const LOGIN_BONUS_REWARDS = [', 'const STAT_POINT_GAIN')\n    + '\\nglobalThis.__r={LOGIN_BONUS_REWARDS,GIFT_REWARD_LABELS,MISSION_DEFS};', rewardCtx);"""
          if s.count(old)!=1:
              raise SystemExit(f'skip-ticket reward extractor: expected 1 match, got {s.count(old)}')
          p.write_text(s.replace(old,new,1))

          # help系: 静的MISSION_DEFSの旧位置ではなく、現在の期間/ローテーション定義を読み込む。
          for filename in ['tools/help-coverage-check.js','tools/help-render-check.js']:
              p=Path(filename)
              s=p.read_text()
              old="  grab(source, 'const MISSION_DEFS = {', 'const missionDailyPeriod'),"
              new="  \"const loginBonusPeriodKey=(now=Date.now())=>new Date(Number(now)+5*60*60*1000).toISOString().slice(0,10);\",\n  grab(source, 'const missionDailyPeriod =', 'const missionClaimableList ='),"
              if s.count(old)!=1:
                  raise SystemExit(f'{filename}: expected 1 mission extractor, got {s.count(old)}')
              p.write_text(s.replace(old,new,1))
          PY
      - name: Install tool dependencies
        run: cd tools && npm ci --omit=optional
      - name: Static and mission checks
        run: |
          node tools/check-syntax.js
          node tools/boot/mission-check.js
          node tools/mode/skip-ticket-check.js
          node tools/help-coverage-check.js
          node tools/help-guide-check.js
          node tools/help-render-check.js
      - name: Build generated game bundle
        run: |
          node tools/build.js
          node tools/build.js --check
      - name: Diff check
        run: git diff --check
      - name: Commit verified implementation
        run: |
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          git rm -f .chatgpt/patch_mission_rewards.py .github/workflows/chatgpt-mission-reward-refresh.yml
          git add -A
          git commit -m "feat: refresh login daily and weekly rewards"
          git push origin HEAD:chatgpt/mission-reward-refresh-20260829
