name: Apply rhythm UI step A

on:
  push:
    branches: [chatgpt/rhythm-ui-step-a]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/rhythm-ui-step-a
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply rhythm gameplay UI step A
        run: |
          python3 <<'PY'
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo

          src_path = Path('monster-hero/src/game-system.jsx')
          src = src_path.read_text()

          old_glow = "el.style.backgroundColor=pressed?'rgba(34,211,238,0.30)':'';el.style.boxShadow=pressed?'inset 0 0 26px rgba(103,232,249,0.55), inset 0 -42px 48px rgba(6,182,212,0.28)':'';"
          new_glow = "el.style.backgroundColor=pressed?'rgba(34,211,238,0.30)':'';el.style.boxShadow=pressed?'inset 0 0 26px rgba(103,232,249,0.78), inset 0 -72px 58px rgba(6,182,212,0.42), 0 0 18px rgba(34,211,238,0.28)':'';el.style.borderBottom=pressed?'3px solid rgba(207,250,254,0.98)':'3px solid transparent';el.style.filter=pressed?'brightness(1.15)':'';"
          if old_glow not in src:
              raise SystemExit('lane glow marker not found')
          src = src.replace(old_glow, new_glow, 1)

          old_transition = "style={{transition:'background-color 60ms linear, box-shadow 60ms linear'}}"
          new_transition = "style={{transition:'background-color 60ms linear, box-shadow 60ms linear, filter 60ms linear, border-color 60ms linear',borderBottom:'3px solid transparent',boxSizing:'border-box'}}"
          if old_transition not in src:
              raise SystemExit('lane transition marker not found')
          src = src.replace(old_transition, new_transition, 1)

          old_hud = """<header className=\"flex shrink-0 items-center justify-between p-2\"><div><small className=\"text-cyan-300\">{difficulty.id}・{hasHold?'HOLD TEST':'TAP TEST'}</small><h2 className=\"font-black\">{song.displayName}</h2></div><button data-rhythm-pause className=\"min-h-[44px] rounded-xl bg-amber-700 px-3 font-black\" onClick={pause}>ポーズ</button></header><section className=\"grid grid-cols-2 px-3 text-center\"><div>SCORE <b className=\"block text-xl\">{view.score.toLocaleString()}</b></div><div>COMBO <b className=\"block text-xl\">{view.combo}</b></div></section><div className=\"h-12 text-center\"><b className=\"text-xl text-amber-300\">{view.last||(view.status==='error'?'音源を再生できません':view.status==='loading'?'LOADING…':'')}</b><small className=\"block text-cyan-300\">{view.fastSlow}</small></div>"""
          new_hud = """<header data-rhythm-hud className=\"shrink-0 border-b border-cyan-400/15 bg-slate-950/95 px-3 pb-2 pt-2\"><div className=\"flex items-center justify-between gap-3\"><div className=\"min-w-0\"><div className=\"flex items-center gap-2\"><span className=\"rounded-md bg-fuchsia-700/80 px-2 py-0.5 text-[11px] font-black\">{difficulty.id}</span><span className=\"truncate text-sm font-black\">{song.displayName}</span></div><small className=\"text-[10px] font-bold tracking-[0.16em] text-cyan-300\">{hasHold?'HOLD TEST':'TAP TEST'}</small></div><button data-rhythm-pause aria-label=\"ポーズ\" className=\"flex min-h-[44px] min-w-[44px] items-center justify-center rounded-xl border border-white/20 bg-slate-900 text-2xl font-black text-white shadow-[0_0_12px_rgba(103,232,249,0.18)]\" onClick={pause}>Ⅱ</button></div><section className=\"mt-1 grid grid-cols-2 items-end gap-3\"><div className=\"text-left\"><span className=\"text-[10px] font-black tracking-[0.18em] text-cyan-200\">SCORE</span><b data-rhythm-score className=\"block text-2xl font-black leading-none tabular-nums\">{view.score.toLocaleString()}</b><small className=\"mt-1 block text-[10px] font-bold text-slate-400\">BEST {Number(bestRecord?.bestScore||0).toLocaleString()}</small></div><div className=\"text-right\"><span className=\"text-[10px] font-black tracking-[0.18em] text-fuchsia-300\">COMBO</span><b data-rhythm-combo className=\"block text-3xl font-black leading-none tabular-nums text-white\">{view.combo}</b></div></section></header>"""
          if old_hud not in src:
              raise SystemExit('old rhythm HUD marker not found')
          src = src.replace(old_hud, new_hud, 1)

          old_line = '<div ref={judgmentLineRef} data-rhythm-judgment-line className="absolute bottom-[12%] left-0 right-0 h-1 bg-cyan-300 shadow-[0_0_12px_#67e8f9]"/>'
          new_line = '<div ref={judgmentLineRef} data-rhythm-judgment-line className="absolute bottom-[12%] left-0 right-0 h-[3px] bg-gradient-to-r from-fuchsia-300 via-cyan-100 to-fuchsia-300 shadow-[0_0_18px_#67e8f9,0_0_30px_#c084fc]"/><div data-rhythm-judgment-display className="pointer-events-none absolute left-1/2 z-10 w-[88%] -translate-x-1/2 text-center" style={{bottom:\'calc(12% + 38px)\'}}><b className={`block text-3xl font-black leading-none tracking-wide ${view.last===\'MARVELOUS\'?\'text-fuchsia-100\':view.last===\'EXCELLENT\'?\'text-cyan-100\':view.last===\'GREAT\'?\'text-amber-200\':view.last===\'GOOD\'?\'text-lime-300\':view.last===\'BAD\'?\'text-rose-300\':\'text-white\'}`} style={{textShadow:\'0 0 10px rgba(255,255,255,.75),0 0 22px rgba(217,70,239,.35)\'}}>{view.last||(view.status===\'error\'?\'音源を再生できません\':view.status===\'loading\'?\'LOADING…\':\'\')}</b><small className={`mt-1 block min-h-[16px] text-xs font-black tracking-[0.24em] ${view.fastSlow===\'FAST\'?\'text-cyan-300\':view.fastSlow===\'SLOW\'?\'text-fuchsia-300\':\'text-transparent\'}`}>{view.fastSlow||\'—\'}</small></div>'
          if old_line not in src:
              raise SystemExit('judgment line marker not found')
          src = src.replace(old_line, new_line, 1)
          src_path.write_text(src)

          help_path = Path('monster-hero/data/help.js')
          help_text = help_path.read_text()
          old_help = '通常画面には表示されません。'
          new_help = '通常画面には表示されません。デバッグプレイでは判定表示を判定ライン付近へ置き、押しているレーンが発光して入力位置を確認しやすくしています。'
          rhythm_pos = help_text.find("id:'rhythm-mode'")
          if rhythm_pos < 0:
              raise SystemExit('rhythm help topic not found')
          help_end = help_text.find('},', rhythm_pos)
          segment = help_text[rhythm_pos:help_end]
          if old_help not in segment:
              raise SystemExit('rhythm help text marker not found')
          segment = segment.replace(old_help, new_help, 1)
          help_text = help_text[:rhythm_pos] + segment + help_text[help_end:]
          help_path.write_text(help_text)

          changelog_path = Path('monster-hero/data/changelog.js')
          changelog = changelog_path.read_text()
          marker = 'const CHANGELOG = [\n'
          if marker not in changelog:
              raise SystemExit('changelog marker not found')
          stamp = datetime.now(ZoneInfo('Asia/Tokyo')).strftime('%Y-%m-%d %H:%M')
          entry = f'''  {{\n    date: "{stamp}", type:'update', title:'音ゲープレイ画面の視認性を改善', releaseFlag:'rhythmMode',\n    items:['SCOREとCOMBOを左右に整理し、判定文字とFAST/SLOWを判定ライン付近へ移動しました。押しているレーンの発光も強化し、同時押し時は複数レーンを見分けやすくしています。'],\n  }},\n'''
          changelog = changelog.replace(marker, marker + entry, 1)
          changelog_path.write_text(changelog)

          Path('tools/mode/rhythm-mode-ui-step-a-check.js').write_text(r'''#!/usr/bin/env node
const fs=require('fs');
const game=fs.readFileSync('monster-hero/src/game-system.jsx','utf8');
const help=fs.readFileSync('monster-hero/data/help.js','utf8');
const must=[
  'data-rhythm-hud',
  'data-rhythm-score',
  'data-rhythm-combo',
  'BEST {Number(bestRecord?.bestScore||0).toLocaleString()}',
  'data-rhythm-judgment-display',
  "bottom:'calc(12% + 38px)'",
  'data-rhythm-judgment-line className="absolute bottom-[12%]',
  'bg-gradient-to-r from-fuchsia-300 via-cyan-100 to-fuchsia-300',
  "borderBottom=pressed?'3px solid rgba(207,250,254,0.98)'",
  "filter=pressed?'brightness(1.15)'",
  "rhythmMatchInputBatch(run.notes,inputs,now,settings.judgmentTimingOffsetMs)"
];
for(const token of must){if(!game.includes(token)){console.error('missing rhythm UI step A token:',token);process.exit(1);}}
if(game.includes('<div className="h-12 text-center"><b className="text-xl text-amber-300">')){console.error('old top judgment display remains');process.exit(1);}
if(!help.includes('判定表示を判定ライン付近へ置き、押しているレーンが発光')){console.error('rhythm help not updated');process.exit(1);}
console.log('OK: rhythm UI step A');
''')
          PY
      - name: Install locked tool dependencies
        run: cd tools && npm ci --omit=optional
      - name: Build canonical output
        run: |
          node tools/build.js
          node tools/build.js --check
      - name: Run rhythm and regression checks
        run: |
          node tools/mode/rhythm-mode-foundation-check.js
          node tools/mode/rhythm-mode-tap-engine-check.js
          node tools/mode/rhythm-mode-tap-completion-check.js
          node tools/mode/rhythm-mode-hold-engine-check.js
          node tools/mode/rhythm-mode-multitouch-check.js
          node tools/mode/rhythm-mode-simultaneous-input-check.js
          node tools/mode/rhythm-mode-lane-feedback-check.js
          node tools/mode/rhythm-mode-ui-step-a-check.js
          node tools/check-syntax.js
          node tools/undefined-reference-check.js
          node tools/check-jsx-braces.js
          node tools/help-coverage-check.js
          node tools/help-guide-check.js
          node tools/help-render-check.js
          git diff --check
      - name: Commit and remove temporary workflow
        run: |
          git config user.name ChatGPT
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/rhythm-ui-step-a.yml
          git add monster-hero tools/mode/rhythm-mode-ui-step-a-check.js
          git commit -m "feat: improve rhythm gameplay HUD readability"
          git push origin HEAD:chatgpt/rhythm-ui-step-a
