name: Fix GOD changelog once

on:
  push:
    branches:
      - chatgpt/fix-god-changelog-type

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Fix GOD changelog type
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('monster-hero/data/changelog.js')
          s = p.read_text(encoding='utf-8')
          old = 'date: "2026-09-02 12:30", type:\'new\', title:\'極限チャレンジに新難易度 GOD を追加\''
          new = 'date: "2026-09-02 12:30", type:\'update\', title:\'極限チャレンジに新難易度 GOD を追加\''
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one GOD changelog entry, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install locked tool dependencies
        working-directory: tools
        run: npm ci --omit=optional
      - name: Run canonical build
        run: node tools/build.js
      - name: Verify
        run: |
          node tools/build.js --check
          node tools/update-notice-check.js
          node tools/assistant/assistant-update-notice-check.js
          git diff --check
      - name: Commit rebuilt output and remove temporary workflow
        run: |
          git rm .github/workflows/fix-god-changelog-once.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: GODを更新情報へ表示"
          git push origin HEAD:chatgpt/fix-god-changelog-type
