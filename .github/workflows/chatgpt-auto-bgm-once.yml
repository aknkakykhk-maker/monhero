name: Apply AUTO BGM implementation

on:
  push:
    branches: [chatgpt/auto-bgm-continuous]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[auto-bgm-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/auto-bgm-continuous
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install locked tool dependencies
        working-directory: tools
        run: npm ci --omit=optional
      - name: Install Chromium for audio browser regression
        working-directory: tools
        run: npx playwright install chromium
      - name: Apply requested implementation
        run: node tools/chatgpt-auto-bgm-patch.js
      - name: Align existing BGM dependency regression check
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='tools/audio/bgm-arrangement-check.js';
          let s=fs.readFileSync(p,'utf8');
          const from="/bgmArrangement, runMode, eventBgmScene, mainHero\\?\\.id\\]/.test(source)";
          const to="/bgmArrangement, runMode, eventBgmScene, mainHero\\?\\.id(?:, autoBattle)?\\]/.test(source)";
          if(!s.includes(from)) throw new Error('BGM dependency check anchor not found');
          s=s.replace(from,to);
          fs.writeFileSync(p,s);
          NODE
      - name: Build canonical distribution
        run: node tools/build.js
      - name: Run AUTO BGM regression check
        run: node tools/audio/auto-bgm-check.js
      - name: Run existing BGM checks
        run: |
          node tools/audio/bgm-arrangement-check.js
          node tools/audio/bgm-check.js
      - name: Run source and help checks
        run: |
          node tools/check-syntax.js
          node tools/undefined-reference-check.js
          node tools/help-coverage-check.js
          node tools/help-guide-check.js
          node tools/help-render-check.js
          node tools/assistant/assistant-update-notice-check.js
          node tools/update-notice-check.js
      - name: Verify canonical build and diff
        run: |
          node tools/build.js --check
          git diff --check
      - name: Remove one-shot runner
        run: |
          rm -f tools/chatgpt-auto-bgm-patch.js
          rm -f tools/chatgpt-auto-bgm-trigger.tmp
          rm -f .github/workflows/chatgpt-auto-bgm-once.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add continuous AUTO battle BGM [auto-bgm-applied]"
          git push origin HEAD:chatgpt/auto-bgm-continuous
