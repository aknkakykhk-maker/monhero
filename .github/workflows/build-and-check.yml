# モバイル(iPhone等)から作業したときに、ビルドと検査を代わりに回すためのワークフロー。
#
# 【なぜ要るか】
# 手元にNode環境が無い状態でGitHubのWeb UIから game-system.jsx を直接編集すると、
# 配信用の game-system.compiled.js が古いままになる。compiled-check.yml の
# `node tools/build.js --check` はそれを必ず落とすので、そのままではmainへ入れられない。
#
# これまではその穴を埋めるために、変更のたびに使い捨てのワークフロー
# (*-once.yml / _tmp_*.yml など)を新しく作って push で起動していた。
# 2026年8月にこの方式で登録ワークフローが42個まで増え、失敗するたびに
# 別名のymlを作り直すため、画面上の変更1件あたり8 Runまで膨らんだ。
#
# このワークフローはその置き換えで、通常は workflow_dispatch で必要時だけ動かす。
name: ビルドと検査（手動実行）

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "ビルド結果に差分があればコミットする"
        type: boolean
        default: true
  # chatgpt/rhythm-release-repair で今回の配信不整合を正規ビルドへ通すための一時起動。
  # 生成物コミット後、このpushトリガーはPR前に削除して通常のworkflow_dispatch専用へ戻す。
  push:
    branches: [chatgpt/rhythm-release-repair]

permissions:
  contents: write

concurrency:
  group: build-and-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 自分が生成したbuildコミットでは再実行しない。
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'build: 配信用JSを再生成') }}
    runs-on: ubuntu-latest
    steps:
      - name: mainでは実行しない
        if: github.ref == 'refs/heads/main'
        run: |
          echo "mainに対しては実行できません。作業ブランチを選んでください。" >&2
          exit 1

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install locked tool dependencies
        working-directory: tools
        run: npm ci --omit=optional

      - name: Add the rhythm delivery repair release note
        if: github.event_name == 'push'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'monster-hero/data/changelog.js';
          let text = fs.readFileSync(file, 'utf8');
          const title = '音ゲーのレーン更新が端末へ届かない問題を修正';
          if (!text.includes(title)) {
            const entry = `  {\n    date: "2026-08-31 07:49", type:'issue', title:'${title}', releaseFlag:'rhythmMode',\n    items:['音ゲーのレーン・ノーツ・判定ライン・入力座標を共通geometryへ統一した更新が、古いdata/rhythm-mode.jsのキャッシュキーのまま配信されていたため、iPhone Safariで旧表示が残る問題を修正しました。', '正規ビルドでdata/*.jsのキャッシュキー・起動ファイルサイズ・更新日時を同期し、今後は配信前CIでも不一致を検出します。'],\n  },\n`;
            text = text.replace('const CHANGELOG = [\n', 'const CHANGELOG = [\n' + entry);
            fs.writeFileSync(file, text);
          }
          NODE

      # 配信用JSと、BUILD_DATE / version.json / 更新履歴日時 / dataキャッシュキー /
      # BOOT_SIZESを正規手順でまとめて同期する。
      - name: Build the shipped bundle
        run: node tools/build.js

      - name: Verify the committed compiled output after build
        run: node tools/build.js --check
      - name: Verify the compiled runtime
        run: node tools/compiled-runtime-check.js
      - name: Check source syntax and references
        run: |
          node tools/check-syntax.js
          node tools/undefined-reference-check.js
      - name: Check the boot path
        run: node tools/boot-flow-check.js
      - name: Check the shipped version stamps
        run: node tools/update-notice-check.js
      - name: Check shipped data metadata and rhythm geometry
        run: |
          node tools/boot/data-cache-key-check.js
          node tools/mode/rhythm-mode-note-perspective-check.js

      - name: Commit the rebuilt output
        if: github.event_name == 'push' || inputs.commit
        run: |
          if git diff --quiet; then
            echo "ビルド結果に差分はありません。コミットしません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: 配信用JSを再生成（ビルドと検査の手動実行）"
          git push