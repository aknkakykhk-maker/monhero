# モバイル(iPhone等)から作業したときに、ビルドと検査を代わりに回すためのワークフロー。
#
# 【なぜ要るか】
# 手元にNode環境が無い状態でGitHubのWeb UIから game-system.jsx を直接編集すると、
# 配信用の game-system.compiled.js が古いままになる。compiled-check.yml の
# `node tools/build.js --check` はそれを必ず落とすので、そのままではmainへ入れられない。
#
# これまではその穴を埋めるために、変更のたびに使い捨てのワークフロー
# (*-once.yml / _tmp_*.yml など)を新しく作って push で起動していた。
# 2026年8月にこの方式で登録ワークフローが42個まで増え、失敗するたびに
# 別名のymlを作り直すため、画面上の変更1件あたり8 Runまで膨らんだ。
#
# このワークフローはその置き換えで、次の2点が違う。
#   ・on: workflow_dispatch なので、pushのたびに勝手に走らない。押したときだけ動く
#   ・使い回すので、変更のたびに新しいymlを作る必要がない。失敗しても押し直すだけ
#
# 【使い方(モバイル)】
#   1. Web UIでソースを編集してコミットする
#   2. Actions → このワークフロー → Run workflow
#   3. 対象ブランチを選んで実行する
#
# mainは選べない。公開物を検査なしで書き換えないため、必ず作業ブランチで使い、
# 通常どおりPR経由でmainへ入れること。
name: ビルドと検査（手動実行）

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "ビルド結果に差分があればコミットする"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  # 同じブランチへ二重に走らせない。あとから押したほうを優先する
  group: build-and-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: mainでは実行しない
        if: github.ref == 'refs/heads/main'
        run: |
          echo "mainに対しては実行できません。作業ブランチを選んでください。" >&2
          exit 1

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install locked tool dependencies
        working-directory: tools
        run: npm ci --omit=optional

      - name: Apply unique-skill common charge regression fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('monster-hero/src/parts/60-app.jsx')
          text = src.read_text()
          replacements = [
              (
                  "setAttackAnim({slotIndex: animSlot, charge:true, ...((motion==='waterBurst'||motion==='arkHolyRain')?{motion}: {})});",
                  "setAttackAnim({slotIndex: animSlot, charge:true});",
              ),
              (
                  "setMonsterImageDebugMotionPlaying({charge:true, ...((atkMotion==='waterBurst'||atkMotion==='arkHolyRain')?{motion:atkMotion}: {})});",
                  "setMonsterImageDebugMotionPlaying({charge:true});",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one source match, got {count}: {old}')
              text = text.replace(old, new, 1)
          src.write_text(text)

          test = Path('tools/monster/snegurochka-check.js')
          text = test.read_text()
          anchor = "  ['水攻撃は距離枠を動かさず本体だけ横移動',"
          regression = """  ['固有技の共通タメは専用モーションより先に下沈みを行う', game.includes('setAttackAnim({slotIndex: animSlot, charge:true});')\n    && !game.includes(\"setAttackAnim({slotIndex: animSlot, charge:true, ...((motion==='waterBurst'||motion==='arkHolyRain')?{motion}: {})});\")\n    && game.includes('setMonsterImageDebugMotionPlaying({charge:true});')\n    && !game.includes(\"setMonsterImageDebugMotionPlaying({charge:true, ...((atkMotion==='waterBurst'||atkMotion==='arkHolyRain')?{motion:atkMotion}: {})});\")\n    && game.includes('setAttackAnim({slotIndex: animSlot, charge:false, motion, twinBlade:isKenshiTwin, sakura:')],\n"""
          if regression.strip() in text:
              raise SystemExit('regression assertion already present')
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one test anchor, got {text.count(anchor)}')
          test.write_text(text.replace(anchor, regression + anchor, 1))

          # この作業用変更は最終差分へ残さない。
          PY
          git fetch --no-tags --depth=1 origin main
          git checkout origin/main -- .github/workflows/build-and-check.yml

      # 配信用JSを作り直す。編集元(game-system.jsx)だけを変えたコミットでも、
      # ここで生成物が追いつく。BUILD_DATE / version.json / 更新履歴日時 /
      # data/*.jsキャッシュキー / BOOT_SIZESも同じ正規ビルドで同期する。
      - name: Build the shipped bundle
        run: node tools/build.js

      - name: Verify the committed compiled output after build
        run: node tools/build.js --check
      - name: Verify the compiled runtime
        run: node tools/compiled-runtime-check.js
      - name: Check source syntax and references
        run: |
          node tools/check-syntax.js
          node tools/undefined-reference-check.js
      - name: Check the boot path
        run: node tools/boot-flow-check.js
      - name: Check the shipped version stamps
        run: node tools/update-notice-check.js
      - name: Check shipped data metadata and rhythm geometry
        run: |
          node tools/boot/data-cache-key-check.js
          node tools/mode/rhythm-mode-note-perspective-check.js

      - name: Check Undine lineage charge regression and shared dex motion
        run: |
          node tools/monster/snegurochka-check.js
          node tools/monster/lineage-dex-check.js

      # 生成物に差分が出たときだけコミットする。差分が無ければ何もしない
      - name: Commit the rebuilt output
        if: inputs.commit
        run: |
          if git diff --quiet; then
            echo "ビルド結果に差分はありません。コミットしません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: 固有技の共通タメを専用モーション前に復旧"
          git push
