name: ChatGPT one-time rhythm touch calibration

on:
  push:
    branches:
      - chatgpt/rhythm-touch-radius-calibration

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/rhythm-touch-radius-calibration
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install locked tool dependencies
        working-directory: tools
        run: npm ci --omit=optional
      - name: Apply touch radius calibration
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('monster-hero/data/rhythm-mode.js')
          source = source_path.read_text()

          old = """// iPhoneのTouch.radiusXを既存projectionへ通し、1本指を最大3サブレーンの接触領域として扱う。\n// ゲーム本体の中心1点入力はそのまま残し、中心以外の新規接触サブレーンだけTAP専用の疑似Pointerで補う。\nconst RHYTHM_TOUCH_SPAN_RUNTIME=(()=>{\n"""
          new = """// iPhoneのTouch.radiusXを既存projectionへ通し、実際の接触幅に応じたサブレーン領域として扱う。\n// radiusXは端を拾いすぎないよう75%へ縮小し、明らかな異常値だけ中心1サブレーンへfallbackする。\n// ゲーム本体の中心1点入力はそのまま残し、中心以外の新規接触サブレーンだけTAP専用の疑似Pointerで補う。\nconst RHYTHM_TOUCH_RADIUS_SCALE=.75;\nconst RHYTHM_TOUCH_RADIUS_MAX_PLAY_AREA_RATIO=.25;\nconst RHYTHM_TOUCH_SPAN_RUNTIME=(()=>{\n"""
          if source.count(old) != 1:
              raise SystemExit('touch span header target not unique')
          source = source.replace(old, new)

          old = """    const centerSubLane=clampSubLane(centerCoordinate),radiusX=Number(touch?.radiusX);\n    if(!(radiusX>0))return {centerCoordinate,centerSubLane,subLanes:[centerSubLane]};\n    const leftCoordinate=rhythmSubLaneCoordinateAtPoint(Number(touch.clientX)-radiusX,touch.clientY,rect);\n"""
          new = """    const centerSubLane=clampSubLane(centerCoordinate),rawRadiusX=Number(touch?.radiusX);\n    if(!(rawRadiusX>0))return {centerCoordinate,centerSubLane,subLanes:[centerSubLane]};\n    const maxSaneRadiusX=Number(rect?.width)*RHYTHM_TOUCH_RADIUS_MAX_PLAY_AREA_RATIO;\n    if(!(maxSaneRadiusX>0)||rawRadiusX>maxSaneRadiusX)return {centerCoordinate,centerSubLane,subLanes:[centerSubLane]};\n    const radiusX=rawRadiusX*RHYTHM_TOUCH_RADIUS_SCALE;\n    const leftCoordinate=rhythmSubLaneCoordinateAtPoint(Number(touch.clientX)-radiusX,touch.clientY,rect);\n"""
          if source.count(old) != 1:
              raise SystemExit('touch radius target not unique')
          source = source.replace(old, new)

          old = """    if(!subLanes.includes(centerSubLane))subLanes.push(centerSubLane);\n    if(subLanes.length>3)subLanes=subLanes.sort((a,b)=>Math.abs(a-centerSubLane)-Math.abs(b-centerSubLane)||a-b).slice(0,3);\n    subLanes.sort((a,b)=>a-b);\n"""
          new = """    if(!subLanes.includes(centerSubLane))subLanes.push(centerSubLane);\n    subLanes.sort((a,b)=>a-b);\n"""
          if source.count(old) != 1:
              raise SystemExit('three-sublane cap target not unique')
          source = source.replace(old, new)
          source_path.write_text(source)

          test_path = Path('tools/mode/rhythm-mode-tap-width-input-check.js')
          test = test_path.read_text()
          old = """const contact=run(`RHYTHM_TOUCH_SPAN_RUNTIME.contactsForTouch({clientX:${centerX},clientY:800,radiusX:45},${JSON.stringify(touchRect)})`);\nassert.deepEqual(Array.from(contact.subLanes),[3,4,5],'Touch.radiusXをprojectionへ通して最大3サブレーン接触');\nconst fallback=run(`RHYTHM_TOUCH_SPAN_RUNTIME.contactsForTouch({clientX:${centerX},clientY:800,radiusX:0},${JSON.stringify(touchRect)})`);\n"""
          new = """const contact=run(`RHYTHM_TOUCH_SPAN_RUNTIME.contactsForTouch({clientX:${centerX},clientY:800,radiusX:45},${JSON.stringify(touchRect)})`);\nassert.deepEqual(Array.from(contact.subLanes),[3,4,5],'Touch.radiusXを75%へ縮小してprojectionへ通す');\nconst narrowedContact=run(`RHYTHM_TOUCH_SPAN_RUNTIME.contactsForTouch({clientX:${centerX},clientY:800,radiusX:25},${JSON.stringify(touchRect)})`);\nassert.deepEqual(Array.from(narrowedContact.subLanes),[4],'接触端を75%補正して隣接サブレーンの拾いすぎを抑える');\nconst broadContact=run(`RHYTHM_TOUCH_SPAN_RUNTIME.contactsForTouch({clientX:${centerX},clientY:800,radiusX:90},${JSON.stringify(touchRect)})`);\nassert.deepEqual(Array.from(broadContact.subLanes),[2,3,4,5,6],'通常範囲の広い接触は3サブレーン固定上限なしで反映');\nconst fallback=run(`RHYTHM_TOUCH_SPAN_RUNTIME.contactsForTouch({clientX:${centerX},clientY:800,radiusX:0},${JSON.stringify(touchRect)})`);\n"""
          if test.count(old) != 1:
              raise SystemExit('touch contact test target not unique')
          test = test.replace(old, new)

          old = """const hugeContact=run(`RHYTHM_TOUCH_SPAN_RUNTIME.contactsForTouch({clientX:${centerX},clientY:800,radiusX:9999},${JSON.stringify(touchRect)})`);\nassert(hugeContact.subLanes.length<=3,'異常に大きいradiusXでも1本指は最大3サブレーン');\n"""
          new = """const hugeContact=run(`RHYTHM_TOUCH_SPAN_RUNTIME.contactsForTouch({clientX:${centerX},clientY:800,radiusX:9999},${JSON.stringify(touchRect)})`);\nassert.deepEqual(Array.from(hugeContact.subLanes),[4],'異常に大きいradiusXは中心1サブレーンへfallback');\nassert(source.includes('RHYTHM_TOUCH_RADIUS_SCALE=.75')&&source.includes('RHYTHM_TOUCH_RADIUS_MAX_PLAY_AREA_RATIO=.25')&&!source.includes('subLanes.length>3'),'接触半径75%補正・固定3サブレーン上限撤廃');\n"""
          if test.count(old) != 1:
              raise SystemExit('huge radius test target not unique')
          test = test.replace(old, new)

          old = "console.log('OK: 10サブレーン可変幅TAP入力・接触幅最大3・押しっぱなし回帰防止・発光レイヤー・旧譜面・projection回帰');"
          new = "console.log('OK: 10サブレーン可変幅TAP入力・接触半径75%補正・固定3上限撤廃・異常radius fallback・押しっぱなし回帰防止・発光レイヤー・旧譜面・projection回帰');"
          if test.count(old) != 1:
              raise SystemExit('test summary target not unique')
          test = test.replace(old, new)
          test_path.write_text(test)
          PY
      - name: Run focused rhythm input check
        run: node tools/mode/rhythm-mode-tap-width-input-check.js
      - name: Run canonical build and stamp update banner
        run: node tools/build.js
      - name: Verify changelog stayed untouched
        run: git diff --exit-code -- monster-hero/data/changelog.js
      - name: Re-run focused rhythm input check
        run: node tools/mode/rhythm-mode-tap-width-input-check.js
      - name: Commit implementation
        env:
          HEAD_BRANCH: chatgpt/rhythm-touch-radius-calibration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: calibrate rhythm touch contact width"
          git push origin "HEAD:${HEAD_BRANCH}"
