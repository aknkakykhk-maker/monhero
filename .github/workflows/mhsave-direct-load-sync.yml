name: Temporary mhsave direct-load sync

on:
  push:
    branches:
      - chatgpt/mhsave-direct-load-fix-5
    paths:
      - .github/workflows/mhsave-direct-load-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/mhsave-direct-load-fix-5
      - name: Add direct mhsave boot load and bump data release
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const root = 'monster-hero';
          const releasePath = `${root}/data/rhythm-step3-release.js`;
          const backupPath = `${root}/data/mhsave-backup.js`;
          const indexPath = `${root}/index.html`;
          const versionPath = `${root}/version.json`;
          const build = '2026-09-01 06:49';

          let release = fs.readFileSync(releasePath, 'utf8');
          release = release.replace(/const RHYTHM_RELEASE_DATE='[^']+';/, `const RHYTHM_RELEASE_DATE='${build}';`);
          release = release.replace(/const RHYTHM_DATA_BUILD='[^']+';/, `const RHYTHM_DATA_BUILD='${build}';`);
          release = release.replace(/const RHYTHM_RELEASE_TITLE='[^']+';/, "const RHYTHM_RELEASE_TITLE='バックアップファイル保存ボタンを表示';");
          release = release.replace("'長くなった引き継ぎコードをコピーしなくても、バックアップを「.mhsave」ファイルとして保存・復元できるようにしました。',", "'データ引き継ぎ画面で「バックアップファイルを保存（.mhsave）」と「バックアップファイルから復元（.mhsave）」を確実に表示するよう、バックアップ機能を標準の起動スクリプトとして読み込むようにしました。',");
          release = release.replace("'従来の引き継ぎコード方式もそのまま利用でき、既存のmh_*セーブデータ形式は変更していません。'", "'従来の引き継ぎコード方式もそのまま利用でき、既存のmh_*セーブデータ形式は変更していません。'");
          release = release.replace(/script\.src='data\/mhsave-backup\.js\?v=[^']+';/, "script.src='data/mhsave-backup.js?v=202609010649';");
          fs.writeFileSync(releasePath, release);
          fs.writeFileSync(versionPath, JSON.stringify({build}, null, 0) + '\n');

          const backupBytes = fs.readFileSync(backupPath);
          const backupHash = crypto.createHash('sha256').update(backupBytes).digest('hex').slice(0, 12);
          const releaseBytes = fs.readFileSync(releasePath);
          const releaseHash = crypto.createHash('sha256').update(releaseBytes).digest('hex').slice(0, 12);

          let index = fs.readFileSync(indexPath, 'utf8');
          index = index.replace(/"data\/rhythm-step3-release\.js":\d+/, `"data/rhythm-step3-release.js":${releaseBytes.length}`);
          index = index.replace(/data\/rhythm-step3-release\.js\?v=[^"]+/, `data/rhythm-step3-release.js?v=${releaseHash}`);

          if (!index.includes('"data/mhsave-backup.js"')) {
            index = index.replace(/("data\/help\.js":\d+,)/, `$1"data/mhsave-backup.js":${backupBytes.length},`);
          } else {
            index = index.replace(/"data\/mhsave-backup\.js":\d+/, `"data/mhsave-backup.js":${backupBytes.length}`);
          }

          const directTag = `<script data-mhsave-backup src="data/mhsave-backup.js?v=${backupHash}" onload="__mhBoot.done('data/mhsave-backup.js','バックアップ機能を読み込み中')" onerror="__mhBoot.fail('data/mhsave-backup.js')"></script>`;
          if (!index.includes('data-mhsave-backup')) {
            index = index.replace(/(<script src="data\/help\.js\?v=[^"]+"[^>]*><\/script>)/, `$1\n${directTag}`);
          } else {
            index = index.replace(/<script data-mhsave-backup src="data\/mhsave-backup\.js\?v=[^"]+"[^>]*><\/script>/, directTag);
          }
          fs.writeFileSync(indexPath, index);

          if (!index.includes(`data/mhsave-backup.js?v=${backupHash}`)) throw new Error('mhsave direct script tag not installed');
          if (!index.includes(`"data/mhsave-backup.js":${backupBytes.length}`)) throw new Error('mhsave BOOT_SIZES entry not installed');
          console.log(`mhsave-backup.js: ${backupHash} / ${backupBytes.length} bytes`);
          console.log(`rhythm-step3-release.js: ${releaseHash} / ${releaseBytes.length} bytes`);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monster-hero/index.html monster-hero/data/rhythm-step3-release.js monster-hero/version.json
          git commit -m "fix: load mhsave backup UI at boot"
          git push origin HEAD:chatgpt/mhsave-direct-load-fix-5
