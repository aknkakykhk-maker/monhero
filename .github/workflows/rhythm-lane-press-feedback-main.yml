name: Apply rhythm lane feedback on latest main

on:
  push:
    branches: [chatgpt/rhythm-lane-press-feedback-main]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/rhythm-lane-press-feedback-main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply lane feedback
        run: |
          python3 <<'PY'
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import json, re

          src_path=Path('monster-hero/src/game-system.jsx')
          src=src_path.read_text()

          marker="  const pointerDown=e=>{if(e.pointerType==='touch')return;e.preventDefault();"
          if marker not in src: raise SystemExit('pointerDown marker not found')
          helper="""  const setPressedLanes=lanes=>{const area=playAreaRef.current;if(!area)return;const active=lanes instanceof Set?lanes:new Set(lanes||[]);area.querySelectorAll('[data-rhythm-lane]').forEach((el,index)=>{const pressed=active.has(index);el.dataset.pressed=pressed?'true':'false';el.style.backgroundColor=pressed?'rgba(34,211,238,0.30)':'';el.style.boxShadow=pressed?'inset 0 0 26px rgba(103,232,249,0.55), inset 0 -42px 48px rgba(6,182,212,0.28)':'';});};\n"""
          src=src.replace(marker,helper+marker,1)

          old="if(lane===null)return;inputStarts([{lane,inputKey:rhythmInputKey('pointer',e.pointerId)"
          if old not in src: raise SystemExit('pointer start marker not found')
          src=src.replace(old,"if(lane===null)return;setPressedLanes([lane]);inputStarts([{lane,inputKey:rhythmInputKey('pointer',e.pointerId)",1)

          old="const pointerEnd=e=>{if(e.pointerType==='touch')return;"
          if old not in src: raise SystemExit('pointer end marker not found')
          src=src.replace(old,old+"setPressedLanes([]);",1)

          old="const rect=area.getBoundingClientRect(),live=new Set(),starts=[];"
          if old not in src: raise SystemExit('touch declaration marker not found')
          src=src.replace(old,"const rect=area.getBoundingClientRect(),live=new Set(),liveLanes=new Set(),starts=[];",1)

          old="live.add(inputKey);if(current.activeTouchInputs.has(inputKey))return;current.activeTouchInputs.add(inputKey);const lane=rhythmLaneFromClientX(touch.clientX,rect.left,rect.width);if(lane!==null)starts.push({lane,inputKey});"
          if old not in src: raise SystemExit('touch body marker not found')
          src=src.replace(old,"live.add(inputKey);const lane=rhythmLaneFromClientX(touch.clientX,rect.left,rect.width);if(lane!==null)liveLanes.add(lane);if(current.activeTouchInputs.has(inputKey))return;current.activeTouchInputs.add(inputKey);if(lane!==null)starts.push({lane,inputKey});",1)

          old="});if(starts.length)inputStarts(starts);const ended=[];"
          if old not in src: raise SystemExit('touch starts marker not found')
          src=src.replace(old,"});setPressedLanes(liveLanes);if(starts.length)inputStarts(starts);const ended=[];",1)

          old="area.removeEventListener('touchcancel',syncTouches);};},[view.status]);"
          if old not in src: raise SystemExit('touch cleanup marker not found')
          src=src.replace(old,"area.removeEventListener('touchcancel',syncTouches);setPressedLanes([]);};},[view.status]);",1)

          old='<div key={lane} aria-hidden="true" className="relative border-r border-white/20 bg-slate-900/40">'
          new='<div key={lane} data-rhythm-lane={lane} data-pressed="false" aria-hidden="true" className="relative border-r border-white/20 bg-slate-900/40" style={{transition:\'background-color 60ms linear, box-shadow 60ms linear\'}}>'
          if old not in src: raise SystemExit('lane visual marker not found')
          src=src.replace(old,new,1)

          for old,new in [
            ("run.activePointers.clear();run.activeTouchInputs?.clear();run.notes.forEach","run.activePointers.clear();run.activeTouchInputs?.clear();setPressedLanes([]);run.notes.forEach"),
            ("run.activePointers=new Map();run.activeTouchInputs=new Set();run.combo=0;","run.activePointers=new Map();run.activeTouchInputs=new Set();setPressedLanes([]);run.combo=0;"),
            ("run.activePointers.clear();run.activeTouchInputs?.clear();run.audio?.stop();","run.activePointers.clear();run.activeTouchInputs?.clear();setPressedLanes([]);run.audio?.stop();")]:
              if old not in src: raise SystemExit('reset marker not found')
              src=src.replace(old,new,1)

          stamp=datetime.now(ZoneInfo('Asia/Tokyo')).strftime('%Y-%m-%d %H:%M')
          src,n=re.subn(r'const BUILD_DATE = "[^"]+";',f'const BUILD_DATE = "{stamp}";',src,count=1)
          if n!=1: raise SystemExit('BUILD_DATE not updated')
          src_path.write_text(src)

          vpath=Path('monster-hero/version.json')
          version=json.loads(vpath.read_text()); version['build']=stamp
          vpath.write_text(json.dumps(version,ensure_ascii=False,indent=2)+'\n')

          cpath=Path('monster-hero/data/changelog.js')
          changelog=cpath.read_text(); title="title:'音ゲーの2本指入力を修正'"; pos=changelog.find(title)
          if pos<0: raise SystemExit('rhythm changelog entry not found')
          item_pos=changelog.find('items:[',pos); end_pos=changelog.find('],',item_pos)
          feedback='押しているレーンが光る入力フィードバックを戻し、2本指では2レーンが同時に光るようにしました。'
          segment=changelog[item_pos:end_pos]
          if feedback not in segment:
              segment=segment.rstrip()+", '"+feedback+"'"
              changelog=changelog[:item_pos]+segment+changelog[end_pos:]
          cpath.write_text(changelog)

          Path('tools/mode/rhythm-mode-lane-feedback-check.js').write_text("""const fs=require('fs');\nconst game=fs.readFileSync('monster-hero/src/game-system.jsx','utf8');\nconst must=[\"const setPressedLanes=lanes=>\",\"data-rhythm-lane={lane}\",\"liveLanes=new Set()\",\"setPressedLanes(liveLanes)\",\"backgroundColor=pressed?'rgba(34,211,238,0.30)'\",\"boxShadow=pressed?'inset 0 0 26px\",\"setPressedLanes([]);run.notes.forEach\",\"setPressedLanes([]);run.audio?.stop()\"];\nfor(const token of must){if(!game.includes(token)){console.error('missing lane feedback token:',token);process.exit(1);}}\nif(!game.includes(\"rhythmMatchInputBatch(run.notes,inputs,now,settings.judgmentTimingOffsetMs)\")){console.error('simultaneous batch input path regressed');process.exit(1);}\nconsole.log('rhythm lane press feedback check: OK');\n""")

          hpath=Path('tools/mode/rhythm-mode-hold-engine-check.js'); hold=hpath.read_text()
          old="game.includes('run.activePointers.clear();run.activeTouchInputs?.clear();run.notes.forEach')&&game.includes('run.activePointers=new Map();run.activeTouchInputs=new Set();run.combo=0')&&game.includes('run.finished=true;run.paused=true;run.activePointers.clear();run.activeTouchInputs?.clear();run.audio?.stop()')"
          new="game.includes('run.activePointers.clear();run.activeTouchInputs?.clear();')&&game.includes('run.activePointers=new Map();run.activeTouchInputs=new Set();')&&game.includes('run.finished=true;run.paused=true;run.activePointers.clear();run.activeTouchInputs?.clear();')"
          if old in hold: hpath.write_text(hold.replace(old,new,1))

          mpath=Path('tools/mode/rhythm-mode-multitouch-check.js'); multi=mpath.read_text()
          old="game.includes('const rect=area.getBoundingClientRect(),live=new Set(),starts=[]')&&game.includes('if(starts.length)inputStarts(starts)')"
          new="game.includes('const rect=area.getBoundingClientRect(),live=new Set(),')&&game.includes('starts=[]')&&game.includes('if(starts.length)inputStarts(starts)')"
          if old in multi: mpath.write_text(multi.replace(old,new,1))
          PY
      - name: Install locked tool dependencies
        run: cd tools && npm ci
      - name: Build canonical output
        run: |
          node tools/build.js
          node tools/build.js --check
      - name: Run rhythm and regression checks
        run: |
          node tools/mode/rhythm-mode-foundation-check.js
          node tools/mode/rhythm-mode-tap-engine-check.js
          node tools/mode/rhythm-mode-tap-completion-check.js
          node tools/mode/rhythm-mode-hold-engine-check.js
          node tools/mode/rhythm-mode-multitouch-check.js
          node tools/mode/rhythm-mode-simultaneous-input-check.js
          node tools/mode/rhythm-mode-lane-feedback-check.js
          for f in tools/check-syntax.js tools/undefined-reference-check.js tools/check-jsx-braces.js tools/help-coverage-check.js tools/help-guide-check.js tools/help-render-check.js; do if [ -f "$f" ]; then node "$f"; fi; done
          git diff --check
      - name: Commit and remove temporary workflow
        run: |
          git config user.name ChatGPT
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/rhythm-lane-press-feedback-main.yml
          git add monster-hero tools/mode/rhythm-mode-hold-engine-check.js tools/mode/rhythm-mode-multitouch-check.js tools/mode/rhythm-mode-lane-feedback-check.js
          git commit -m "fix: restore rhythm lane press feedback"
          git push origin HEAD:chatgpt/rhythm-lane-press-feedback-main
