name: Apply AUTO BGM layout continuity
on:
  push:
    branches: [chatgpt/auto-bgm-layout-continuity]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[auto-bgm-layout-continuity-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/auto-bgm-layout-continuity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install locked tool dependencies
        run: npm ci --omit=optional
        working-directory: tools
      - name: Apply requested implementation
        run: node tools/chatgpt-auto-bgm-layout-continuity-patch.js
      - name: Build canonical distribution
        run: node tools/build.js
      - name: Run BGM regression checks
        run: |
          node tools/audio/auto-bgm-loop-continuity-check.js
          node tools/audio/auto-ultra-bgm-check.js
          node tools/audio/auto-bgm-runtime-picker-check.js
          node tools/audio/auto-repeat-result-bgm-check.js
          node tools/audio/auto-bgm-continuity-check.js
          node tools/audio/bgm-arrangement-check.js
      - name: Run source, help, and update checks
        run: |
          node tools/check-syntax.js
          node tools/undefined-reference-check.js
          node tools/help-coverage-check.js
          node tools/help-guide-check.js
          node tools/help-render-check.js
          node tools/update-notice-check.js
      - name: Verify canonical build and diff
        run: |
          node tools/build.js --check
          git diff --check
      - name: Remove one-shot runner
        run: |
          rm -f tools/chatgpt-auto-bgm-layout-continuity-patch.js
          rm -f .github/workflows/chatgpt-auto-bgm-layout-continuity-once.yml
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: improve AUTO BGM layout and loop continuity [auto-bgm-layout-continuity-applied]'
          git push origin HEAD:chatgpt/auto-bgm-layout-continuity
