name: Apply rhythm simultaneous input fix to latest main

on:
  push:
    branches:
      - chatgpt/rhythm-simultaneous-input-main

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chatgpt/rhythm-simultaneous-input-main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Apply validated simultaneous-input patch
        shell: bash
        run: |
          set -euo pipefail
          FIX=9ea61c2711cf8aed283369a93a74e284e63dac9f
          git fetch origin "$FIX"
          git diff "${FIX}^" "$FIX" -- \
            monster-hero/data/rhythm-mode.js \
            monster-hero/src/game-system.jsx \
            tools/mode/rhythm-mode-foundation-check.js \
            tools/mode/rhythm-mode-hold-engine-check.js \
            tools/mode/rhythm-mode-multitouch-check.js \
            tools/mode/rhythm-mode-simultaneous-input-check.js \
            tools/mode/rhythm-mode-tap-completion-check.js > /tmp/rhythm.patch
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/rhythm.patch').read_text().splitlines(True)
          out=[]; i=0
          while i < len(lines):
              if lines[i].startswith('@@ '):
                  j=i+1
                  while j < len(lines) and not lines[j].startswith('@@ ') and not lines[j].startswith('diff --git '):
                      j+=1
                  hunk=lines[i:j]
                  if not any('BUILD_DATE' in line for line in hunk):
                      out.extend(hunk)
                  i=j
              else:
                  out.append(lines[i]); i+=1
          Path('/tmp/rhythm-filtered.patch').write_text(''.join(out))
          PY
          git apply --3way /tmp/rhythm-filtered.patch
          python3 - <<'PY'
          from pathlib import Path
          p=Path('monster-hero/data/changelog.js')
          s=p.read_text()
          marker='const CHANGELOG = [\n'
          entry="""  {\n    date: \"2026-08-30 22:00\", type:'fix', title:'音ゲーの同時押しを再修正', releaseFlag:'rhythmMode',\n    items:['iPhone Safariの同時押し入力をプレイエリアのnative Touch Eventsで直接取得し、同時に始まった複数指を1batchで判定する方式へ変更しました。TAP同時押し・HOLD同時押し・HOLD中の別レーンTAPを同じ入力経路で処理します。'],\n  },\n"""
          if "title:'音ゲーの同時押しを再修正'" not in s:
              if s.count(marker)!=1:
                  raise SystemExit('CHANGELOG marker not unique')
              s=s.replace(marker,marker+entry,1)
              p.write_text(s)
          PY
      - name: Install locked tool dependencies
        working-directory: tools
        run: npm ci --omit=optional
      - name: Build canonical output
        run: |
          node tools/build.js
          node tools/build.js --check
      - name: Run rhythm and regression checks
        run: |
          node tools/check-syntax.js
          node tools/undefined-reference-check.js
          node tools/jsx-text-brace-check.js
          node tools/mode/rhythm-mode-foundation-check.js
          node tools/mode/rhythm-mode-tap-engine-check.js
          node tools/mode/rhythm-mode-tap-completion-check.js
          node tools/mode/rhythm-mode-hold-engine-check.js
          node tools/mode/rhythm-mode-multitouch-check.js
          node tools/mode/rhythm-mode-simultaneous-input-check.js
          node tools/help-coverage-check.js
          node tools/help-guide-check.js
          node tools/help-render-check.js
          git diff --check
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/rhythm-simultaneous-input-main.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize rhythm simultaneous touch input"
          git push origin HEAD:chatgpt/rhythm-simultaneous-input-main
