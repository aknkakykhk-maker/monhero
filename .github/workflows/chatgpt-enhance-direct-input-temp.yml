name: Temporary enhancement direct input

on:
  push:
    branches: ["chatgpt/enhance-direct-input-20260830"]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/enhance-direct-input-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install tool dependencies
        working-directory: tools
        run: npm ci --omit=optional
      - name: Apply implementation
        run: python3 tools/chatgpt-enhance-direct-input-temp.py
      - name: Build and verify
        run: |
          node tools/build.js
          node tools/check-syntax.js
          node tools/undefined-reference-check.js
          node tools/jsx-text-brace-check.js
          node tools/render-error-check.js
          node tools/masu/masu-enhance-layer-check.js
          node tools/masu/transcendence-check.js
          node tools/help-coverage-check.js
          node tools/help-guide-check.js
          node tools/help-render-check.js
          node tools/layout-consistency-check.js
          node --check tools/masu/bulk-enhance-check.js
          node tools/build.js --check
          git diff --check
      - name: Commit implementation
        run: |
          rm .github/workflows/chatgpt-enhance-direct-input-temp.yml
          rm tools/chatgpt-enhance-direct-input-temp.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: allow direct enhancement point input"
          git push origin HEAD:chatgpt/enhance-direct-input-20260830
