name: Temporary enhancement direct input

on:
  push:
    branches: ["chatgpt/enhance-direct-input-20260830"]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/enhance-direct-input-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install tool dependencies
        working-directory: tools
        run: npm ci --omit=optional
      - name: Prepare browser path used by repository checks
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No system Chromium/Chrome found"
            exit 1
          fi
          sudo mkdir -p /opt/pw-browsers
          sudo ln -sf "$CHROME_BIN" /opt/pw-browsers/chromium
          /opt/pw-browsers/chromium --version
      - name: Record baseline layout check
        run: node tools/layout-consistency-check.js >/tmp/layout-baseline.log 2>&1 || true
      - name: Apply implementation
        run: python3 tools/chatgpt-enhance-direct-input-temp.py
      - name: Build and verify
        run: |
          set -euo pipefail
          node tools/build.js
          node tools/check-syntax.js
          node tools/undefined-reference-check.js
          node tools/jsx-text-brace-check.js
          node tools/render-error-check.js

          python3 tools/serve.py 8899 >/tmp/monhero-serve.log 2>&1 &
          SERVE_PID=$!
          trap 'kill $SERVE_PID 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8899/monster-hero/index.html >/dev/null; then READY=1; break; fi
            sleep 0.5
          done
          if [ "$READY" != "1" ]; then cat /tmp/monhero-serve.log; exit 1; fi

          node tools/masu/masu-enhance-layer-check.js
          node tools/masu/transcendence-check.js
          node tools/help-coverage-check.js
          node tools/help-guide-check.js
          node tools/help-render-check.js

          node tools/layout-consistency-check.js >/tmp/layout-current.log 2>&1 || true
          if ! diff -u /tmp/layout-baseline.log /tmp/layout-current.log; then
            echo "Layout check changed versus baseline"
            exit 1
          fi
          echo "Layout check baseline unchanged (existing unrelated NGs are not regressions)."

          node --check tools/masu/bulk-enhance-check.js
          node tools/masu/bulk-enhance-check.js

          kill $SERVE_PID 2>/dev/null || true
          trap - EXIT
          node tools/build.js --check
          git diff --check
      - name: Commit implementation
        run: |
          rm .github/workflows/chatgpt-enhance-direct-input-temp.yml
          rm tools/chatgpt-enhance-direct-input-temp.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: allow direct enhancement point input"
          git push origin HEAD:chatgpt/enhance-direct-input-20260830
