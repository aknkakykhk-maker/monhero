name: Extreme difficulty theme final once

on:
  push:
    branches: [chatgpt/extreme-difficulty-colors]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Apply six difficulty card themes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          source_path = Path('monster-hero/src/game-system.jsx')
          source = source_path.read_text()

          anchor = "const ALL_EXTREME_DIFFICULTIES = Object.freeze([...EXTREME_DIFFICULTIES,GOD_SETTING]);\n"
          theme_block = r'''// 極限チャレンジの難易度カラー。カード構造は共通のまま、上位ほど発光を少しずつ強める。
          // 常時アニメーションは使わず、iPhone縦画面でも視認性と軽さを優先する。
          const EXTREME_DIFFICULTY_THEMES = Object.freeze({
            EXTREME:Object.freeze({accent:'#f0abfc',rgb:'232,121,249',background:'linear-gradient(180deg,#34133f,#160d2b)',action:'linear-gradient(135deg,#a21caf,#d946ef)',actionText:'#ffffff',glow:0.26,titleGlow:0.40,actionGlow:0.24,shadowBlur:28}),
            NIGHTMARE:Object.freeze({accent:'#c4b5fd',rgb:'139,92,246',background:'linear-gradient(180deg,#25143f,#110b26)',action:'linear-gradient(135deg,#6d28d9,#8b5cf6)',actionText:'#ffffff',glow:0.30,titleGlow:0.44,actionGlow:0.28,shadowBlur:30}),
            CHAOS:Object.freeze({accent:'#fda4af',rgb:'244,63,94',background:'linear-gradient(180deg,#3d111f,#1d0a13)',action:'linear-gradient(135deg,#be123c,#f43f5e)',actionText:'#ffffff',glow:0.34,titleGlow:0.48,actionGlow:0.32,shadowBlur:32}),
            ULTIMATE:Object.freeze({accent:'#fdba74',rgb:'249,115,22',background:'linear-gradient(180deg,#3b1a0a,#1e0d08)',action:'linear-gradient(135deg,#c2410c,#f97316)',actionText:'#ffffff',glow:0.38,titleGlow:0.52,actionGlow:0.36,shadowBlur:34}),
            INFINITY:Object.freeze({accent:'#93c5fd',rgb:'59,130,246',background:'linear-gradient(180deg,#11224d,#09112c)',action:'linear-gradient(135deg,#1d4ed8,#3b82f6)',actionText:'#ffffff',glow:0.42,titleGlow:0.56,actionGlow:0.40,shadowBlur:36}),
            GOD:Object.freeze({accent:'#fde68a',rgb:'245,158,11',background:'linear-gradient(180deg,#3b2b08,#181106)',action:'linear-gradient(135deg,#a16207,#f59e0b)',actionText:'#1c1917',glow:0.48,titleGlow:0.66,actionGlow:0.48,shadowBlur:40}),
          });
          const extremeDifficultyTheme = (difficultyId) => EXTREME_DIFFICULTY_THEMES[difficultyId] || EXTREME_DIFFICULTY_THEMES.EXTREME;
          '''
          source = replace_once(source, anchor, anchor + theme_block, 'theme anchor')

          old_map = "{difficulties.map(setting=>{const active=setting.id===extremeDifficulty;const unlocked=debugBattle||(setting.id==='EXTREME'?extremeUnlocked:setting.id==='NIGHTMARE'?nightmareUnlocked:setting.id==='CHAOS'?chaosUnlocked:setting.id==='ULTIMATE'?ultimateUnlocked:setting.id==='INFINITY'?infinityUnlocked:setting.id==='GOD'?godUnlocked:false);const previewable=(setting.available||(debugBattle&&setting.debugAvailable))&&unlocked;return ("
          new_map = "{difficulties.map(setting=>{const active=setting.id===extremeDifficulty;const unlocked=debugBattle||(setting.id==='EXTREME'?extremeUnlocked:setting.id==='NIGHTMARE'?nightmareUnlocked:setting.id==='CHAOS'?chaosUnlocked:setting.id==='ULTIMATE'?ultimateUnlocked:setting.id==='INFINITY'?infinityUnlocked:setting.id==='GOD'?godUnlocked:false);const previewable=(setting.available||(debugBattle&&setting.debugAvailable))&&unlocked;const theme=extremeDifficultyTheme(setting.id);return ("
          source = replace_once(source, old_map, new_map, 'difficulty map')

          source = replace_once(source,
              "style={{borderColor:active?'#f0abfc':'rgba(255,255,255,.12)',background:previewable?'linear-gradient(180deg,#34133f,#160d2b)':'linear-gradient(180deg,#1e293b,#0d142b)',boxShadow:active?'0 0 30px rgba(232,121,249,.35)':'none'}}",
              "style={{borderColor:active?theme.accent:`rgba(${theme.rgb},.28)`,background:previewable?theme.background:`linear-gradient(180deg,rgba(${theme.rgb},.10),#0d142b)`,boxShadow:active?`0 0 ${theme.shadowBlur}px rgba(${theme.rgb},${theme.glow})`:'none'}}",
              'card style')

          source = replace_once(source,
              '<h3 className="text-center text-lg font-black leading-tight text-fuchsia-200">{setting.label}</h3>',
              '<h3 className="text-center text-lg font-black leading-tight" style={{color:theme.accent,textShadow:active?`0 0 10px rgba(${theme.rgb},${theme.titleGlow})`:\'none\'}}>{setting.label}</h3>',
              'card title')

          source = replace_once(source,
              '<b className="block text-right text-base leading-tight text-fuchsia-200">{setting.available&&unlocked?`${(extremeBestScores[setting.id]||0).toLocaleString()} pt`:\'？？？\'}</b>',
              '<b className="block text-right text-base leading-tight" style={{color:theme.accent}}>{setting.available&&unlocked?`${(extremeBestScores[setting.id]||0).toLocaleString()} pt`:\'？？？\'}</b>',
              'score color')

          source = replace_once(source,
              '<div data-extreme-special-rules={setting.id} className="mt-1 h-[34px] shrink-0 flex items-center justify-center rounded-lg border border-fuchsia-400/60 bg-fuchsia-950/50 px-2 text-center"><b className="text-[10px] leading-tight text-amber-300">⚠ {setting.label} {extremeRuleSummaryText(setting.id)}</b></div>',
              '<div data-extreme-special-rules={setting.id} className="mt-1 h-[34px] shrink-0 flex items-center justify-center rounded-lg border px-2 text-center" style={{borderColor:`rgba(${theme.rgb},.58)`,backgroundColor:`rgba(${theme.rgb},.14)`}}><b className="text-[10px] leading-tight" style={{color:theme.accent}}>⚠ {setting.label} {extremeRuleSummaryText(setting.id)}</b></div>',
              'special rules')

          source = replace_once(source,
              '<button data-extreme-rule-detail-open={setting.id} disabled={!previewable} onClick={()=>setExtremeRuleDetail(setting.id)} className="min-h-[38px] rounded-xl bg-fuchsia-900 border border-fuchsia-400/50 text-fuchsia-100 font-black text-xs disabled:opacity-50">{previewable?\'ルール詳細\':\'ルール ？？？\'}</button>',
              '<button data-extreme-rule-detail-open={setting.id} disabled={!previewable} onClick={()=>setExtremeRuleDetail(setting.id)} className="min-h-[38px] rounded-xl border font-black text-xs disabled:opacity-50" style={{backgroundColor:`rgba(${theme.rgb},.18)`,borderColor:`rgba(${theme.rgb},.55)`,color:theme.accent}}>{previewable?\'ルール詳細\':\'ルール ？？？\'}</button>',
              'rule button')

          source = replace_once(source,
              'className="min-h-[44px] rounded-xl bg-fuchsia-600 text-white font-black text-sm disabled:bg-slate-800 disabled:text-slate-500"',
              'className="min-h-[44px] rounded-xl font-black text-sm disabled:bg-slate-800 disabled:text-slate-500" style={previewable?{background:theme.action,color:theme.actionText,boxShadow:active?`0 0 18px rgba(${theme.rgb},${theme.actionGlow})`:\'none\'}:undefined}',
              'challenge button class')

          source_path.write_text(source)

          help_path = Path('monster-hero/data/help.js')
          help_text = help_path.read_text()
          help_text = replace_once(help_text,
              "{ t:'note', title:'難易度カードとみゅあの案内', text:'6枚の難易度カードは同じ大きさです。説明・各ボタンが収まる高さと余白を共通で確保し、その下にページ位置とみゅあのひとことを分けて表示します。左右にスワイプして中央のカードが変わると、解放前かどうかに関係なく、みゅあのひとこともその難易度専用の内容へ切り替わります。' },",
              "{ t:'note', title:'難易度カードとみゅあの案内', text:'6枚の難易度カードは同じ大きさです。EXTREMEはピンク、NIGHTMAREは紫、CHAOSは赤、ULTIMATEは橙、INFINITYは青、GODは金を基調に色分けし、上位ほど枠線や発光を少しずつ強くしています。説明・各ボタンが収まる高さと余白を共通で確保し、その下にページ位置とみゅあのひとことを分けて表示します。左右にスワイプして中央のカードが変わると、解放前かどうかに関係なく、みゅあのひとこともその難易度専用の内容へ切り替わります。' },",
              'help note')
          help_path.write_text(help_text)

          changelog_path = Path('monster-hero/data/changelog.js')
          changelog = changelog_path.read_text()
          entry = '''  {\n    date: "2026-09-02 15:05", type:'update', title:'極限チャレンジの難易度を色分け',\n    items:['EXTREME・NIGHTMARE・CHAOS・ULTIMATE・INFINITY・GODをそれぞれ固有色にし、上位ほど枠線や発光を少しずつ強くして難易度を見分けやすくしました。'],\n  },\n'''
          changelog = replace_once(changelog, 'const CHANGELOG = [\n', 'const CHANGELOG = [\n' + entry, 'changelog head')
          changelog_path.write_text(changelog)

          check_path = Path('tools/mode/extreme-difficulty-theme-check.js')
          check_path.write_text(r'''#!/usr/bin/env node
          const fs = require('fs');
          const path = require('path');
          const assert = require('assert');
          const root = path.join(__dirname, '..', '..');
          const source = fs.readFileSync(path.join(root, 'monster-hero/src/game-system.jsx'), 'utf8');
          const order = ['EXTREME','NIGHTMARE','CHAOS','ULTIMATE','INFINITY','GOD'];
          const start = source.indexOf('const EXTREME_DIFFICULTY_THEMES = Object.freeze({');
          const end = source.indexOf('const PUBLIC_EXTREME_DIFFICULTIES', start);
          assert(start >= 0 && end > start, '難易度テーマ定義が必要です');
          const block = source.slice(start, end);
          const themes = order.map((id, index) => {
            const next = index + 1 < order.length ? order[index + 1] : null;
            const from = block.indexOf(`${id}:Object.freeze({`);
            assert(from >= 0, `${id} のテーマ定義が必要です`);
            const to = next ? block.indexOf(`${next}:Object.freeze({`, from) : block.indexOf('});\nconst extremeDifficultyTheme', from);
            const part = block.slice(from, to > from ? to : undefined);
            const accent = part.match(/accent:'([^']+)'/)?.[1];
            const glow = Number(part.match(/glow:([0-9.]+)/)?.[1]);
            assert(accent, `${id} のaccentが必要です`);
            assert(Number.isFinite(glow), `${id} のglowが必要です`);
            return { id, accent, glow };
          });
          assert.strictEqual(new Set(themes.map(t => t.accent)).size, order.length, '6難易度は別々の色にしてください');
          for (let i = 1; i < themes.length; i++) assert(themes[i].glow > themes[i-1].glow, `${themes[i].id} は一つ前より強い発光にしてください`);
          for (const required of [
            'const theme=extremeDifficultyTheme(setting.id);',
            'background:previewable?theme.background',
            'background:theme.action',
            'color:theme.accent',
          ]) assert(source.includes(required), `実装に ${required} が必要です`);
          console.log('OK: 極限チャレンジ6難易度の固有色と段階的な強調を確認');
          ''')

          readme_path = Path('tools/README.md')
          readme = readme_path.read_text()
          marker = '| `node mode/ultimate-card-layout-check.js` |'
          pos = readme.find(marker)
          if pos < 0:
              raise SystemExit('tools README anchor not found')
          line_start = readme.rfind('\n', 0, pos) + 1
          row = '| `node mode/extreme-difficulty-theme-check.js` | 極限チャレンジ6難易度の固有色、色の重複なし、上位ほど少し強い発光、カード内の主要アクセントへのテーマ反映を確認する。 |\n'
          readme = readme[:line_start] + row + readme[line_start:]
          readme_path.write_text(readme)
          PY

      - name: Install locked tool dependencies
        working-directory: tools
        run: npm ci --omit=optional

      - name: Build shipped files
        run: node tools/build.js

      - name: Verify changes
        run: |
          node tools/build.js --check
          node tools/check-syntax.js
          node tools/undefined-reference-check.js
          node tools/jsx-text-brace-check.js
          node tools/mode/extreme-difficulty-theme-check.js
          node tools/mode/extreme-challenge-check.js
          node tools/mode/ultimate-card-layout-check.js
          node tools/help-coverage-check.js
          node tools/help-guide-check.js
          node tools/help-render-check.js
          node tools/update-notice-check.js
          node tools/assistant/assistant-update-notice-check.js
          node tools/boot/data-cache-key-check.js
          git diff --check

      - name: Commit rebuilt output and remove temporary workflows
        run: |
          rm -f .github/workflows/extreme-theme-once.yml .github/workflows/extreme-theme-fix-once.yml .github/workflows/extreme-theme-final-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: 極限チャレンジの難易度を色分け"
          git push
