name: Apply battle audio controls once
on:
  push:
    branches:
      - chatgpt/battle-audio-controls-always
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/battle-audio-controls-always
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build-only Babel dependencies
        run: npm install --no-save --package-lock=false @babel/core @babel/preset-react
      - name: Apply patch
        run: python tools/battle-audio-controls-patch.py
      - name: Build
        run: node tools/build.js
      - name: Checks
        run: |
          node tools/audio/auto-bgm-runtime-picker-check.js
          node tools/audio/auto-bgm-loop-continuity-check.js
          node tools/audio/auto-ultra-bgm-check.js
          node tools/audio/auto-repeat-result-bgm-check.js
          node tools/audio/bgm-arrangement-check.js
          node tools/check-syntax.js
          node tools/undefined-reference-check.js
          node tools/help-coverage-check.js
          node tools/help-guide-check.js
          node tools/help-render-check.js
          node tools/update-notice-check.js
          node tools/build.js --check
          git diff --check
      - name: Remove temporary files
        run: rm -f tools/battle-audio-controls-patch.py .github/workflows/apply-battle-audio-controls-once.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: keep battle audio controls available [battle-audio-controls-applied]"
          git push origin HEAD:chatgpt/battle-audio-controls-always
