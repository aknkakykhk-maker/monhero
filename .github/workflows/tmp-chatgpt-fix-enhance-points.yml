name: Temporary enhance-point repair

on:
  push:
    branches: [chatgpt/fix-enhance-point-level-bands]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-enhance-point-level-bands
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install locked tool dependencies
        working-directory: tools
        run: npm ci --omit=optional
      - name: Record pre-change noisy-check baselines
        run: |
          set +e
          node tools/masu/rebirth-check.js | tee /tmp/rebirth-baseline.log
          node tools/masu/masu-growth-breakdown-check.js | tee /tmp/growth-baseline.log
          node tools/assistant/assistant-update-notice-check.js > /tmp/assistant-notice-baseline.log 2>&1
          set -e
          grep '^NG:' /tmp/rebirth-baseline.log | sort > /tmp/rebirth-baseline-ng.txt || true
          grep '^NG:' /tmp/growth-baseline.log | sort > /tmp/growth-baseline-ng.txt || true
          echo 'Rebirth baseline NG:'
          cat /tmp/rebirth-baseline-ng.txt || true
          echo 'Growth baseline NG:'
          cat /tmp/growth-baseline-ng.txt || true
          echo 'Assistant notice baseline:'
          grep -E 'AssertionError|更新履歴の種別|ERR_ASSERTION' /tmp/assistant-notice-baseline.log > /tmp/assistant-notice-baseline-summary.txt || true
          cat /tmp/assistant-notice-baseline-summary.txt || true
      - name: Apply source, migration, docs and regression-test changes
        run: python3 tools/_tmp_fix_enhance_points.py
      - name: Align help harness and keep bugfix out of assistant announcements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/help-render-check.js')
          s = p.read_text()
          old = "grab(source, '// レベルアップ時の強化ポイント倍率', 'const RAINBOW_STAR_IMAGE'),"
          new = "grab(source, 'const levelUpPointMultiplier =', 'const RAINBOW_STAR_IMAGE'),"
          if s.count(old) != 1:
              raise SystemExit(f'help-render harness marker mismatch: {s.count(old)}')
          p.write_text(s.replace(old, new, 1))

          c = Path('monster-hero/data/changelog.js')
          s = c.read_text()
          notice = "    assistantNotice: { id: 'update_notice_enhance_point_level_band_fix_v1', type: 'feature' },\n"
          if s.count(notice) != 1:
              raise SystemExit(f'bugfix assistantNotice marker mismatch: {s.count(notice)}')
          c.write_text(s.replace(notice, '', 1))
          PY
      - name: Build canonical shipped output
        run: node tools/build.js
      - name: Run focused progression checks
        run: |
          node tools/masu/enhance-point-total-check.js
          node tools/masu/transcendence-check.js
          node tools/masu/fusion-rebirth-check.js
          node tools/masu/fusion-breakthrough-check.js
          node tools/mode/skip-ticket-check.js
      - name: Verify noisy checks have no new failures
        run: |
          set +e
          node tools/masu/rebirth-check.js | tee /tmp/rebirth-current.log
          node tools/masu/masu-growth-breakdown-check.js | tee /tmp/growth-current.log
          node tools/assistant/assistant-update-notice-check.js > /tmp/assistant-notice-current.log 2>&1
          set -e
          grep '^NG:' /tmp/rebirth-current.log | sort > /tmp/rebirth-current-ng.txt || true
          grep '^NG:' /tmp/growth-current.log | sort > /tmp/growth-current-ng.txt || true
          grep -E 'AssertionError|更新履歴の種別|ERR_ASSERTION' /tmp/assistant-notice-current.log > /tmp/assistant-notice-current-summary.txt || true
          diff -u /tmp/rebirth-baseline-ng.txt /tmp/rebirth-current-ng.txt
          diff -u /tmp/growth-baseline-ng.txt /tmp/growth-current-ng.txt
          diff -u /tmp/assistant-notice-baseline-summary.txt /tmp/assistant-notice-current-summary.txt
      - name: Run source, help and release checks
        run: |
          node tools/check-syntax.js
          node tools/undefined-reference-check.js
          node tools/jsx-text-brace-check.js
          node tools/build.js --check
          node tools/compiled-runtime-check.js
          node tools/help-coverage-check.js
          node tools/help-guide-check.js
          node tools/help-render-check.js
          node tools/assistant-check.js
          node tools/update-notice-check.js
          git diff --check
      - name: Remove temporary repair machinery and commit final result
        run: |
          rm tools/_tmp_fix_enhance_points.py
          rm .github/workflows/tmp-chatgpt-fix-enhance-points.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "fix: correct high-breakthrough enhance point bands"
          git push origin HEAD:chatgpt/fix-enhance-point-level-bands
