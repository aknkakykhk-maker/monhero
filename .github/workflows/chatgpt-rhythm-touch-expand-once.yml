name: ChatGPT one-time rhythm touch expand tuning

on:
  push:
    branches:
      - chatgpt/rhythm-touch-expand

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/rhythm-touch-expand
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install locked tool dependencies
        working-directory: tools
        run: npm ci --omit=optional
      - name: Improve held-touch expansion tracking
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('monster-hero/data/rhythm-mode.js')
          source = source_path.read_text()

          old = """const RHYTHM_TOUCH_RADIUS_SCALE=.70;\nconst RHYTHM_TOUCH_MIN_SUBLANE_COVERAGE=.25;\nconst RHYTHM_TOUCH_RADIUS_MAX_PLAY_AREA_RATIO=.25;\nconst RHYTHM_TOUCH_SPAN_RUNTIME=(()=>{\n  const touchStates=new Map(),syntheticTapKeys=new Set();\n  let nextSyntheticPointerId=900000;\n"""
          new = """const RHYTHM_TOUCH_RADIUS_SCALE=.70;\nconst RHYTHM_TOUCH_MIN_SUBLANE_COVERAGE=.25;\nconst RHYTHM_TOUCH_RADIUS_MAX_PLAY_AREA_RATIO=.25;\nconst RHYTHM_TOUCH_CENTER_DEADZONE_MIN_PX=6;\nconst RHYTHM_TOUCH_CENTER_DEADZONE_MAX_PX=10;\nconst RHYTHM_TOUCH_CENTER_DEADZONE_PLAY_AREA_RATIO=.02;\nconst RHYTHM_TOUCH_RADIUS_EXPAND_MIN_PX=3;\nconst RHYTHM_TOUCH_RADIUS_EXPAND_MIN_RATIO=.10;\nconst RHYTHM_TOUCH_SPAN_RUNTIME=(()=>{\n  const touchStates=new Map(),syntheticTapKeys=new Set();\n  let nextSyntheticPointerId=900000;\n"""
          if source.count(old) != 1:
              raise SystemExit('touch constants target not unique')
          source = source.replace(old, new)

          old = """  const clampSubLane=value=>Math.max(0,Math.min(RHYTHM_SUB_LANE_COUNT-1,Math.floor(Number(value))));\n  const contactsForTouch=(touch,rect)=>{\n"""
          new = """  const clampSubLane=value=>Math.max(0,Math.min(RHYTHM_SUB_LANE_COUNT-1,Math.floor(Number(value))));\n  const centerDeadzonePx=rect=>Math.min(RHYTHM_TOUCH_CENTER_DEADZONE_MAX_PX,Math.max(RHYTHM_TOUCH_CENTER_DEADZONE_MIN_PX,(Number(rect?.width)||0)*RHYTHM_TOUCH_CENTER_DEADZONE_PLAY_AREA_RATIO));\n  const stabilizedMoveTouch=(previous,touch,rect)=>{\n    const rawClientX=Number(touch?.clientX),rawClientY=Number(touch?.clientY),rawRadiusX=Number(touch?.radiusX);\n    const previousAnchor=Number(previous?.centerAnchorX),anchor=Number.isFinite(previousAnchor)?previousAnchor:rawClientX,deadzone=centerDeadzonePx(rect);\n    const centerMoved=Number.isFinite(rawClientX)&&Number.isFinite(anchor)&&Math.abs(rawClientX-anchor)>deadzone,effectiveClientX=centerMoved?rawClientX:anchor;\n    return {touch:{identifier:touch?.identifier,clientX:effectiveClientX,clientY:rawClientY,radiusX:rawRadiusX},centerAnchorX:effectiveClientX,centerMoved,rawClientX};\n  };\n  const radiusExpansionAccepted=(previousRadius,currentRadius)=>{\n    const from=Number(previousRadius),to=Number(currentRadius);\n    if(!(from>0&&to>from))return false;\n    return to-from>=Math.max(RHYTHM_TOUCH_RADIUS_EXPAND_MIN_PX,from*RHYTHM_TOUCH_RADIUS_EXPAND_MIN_RATIO);\n  };\n  const contactsForTouch=(touch,rect)=>{\n"""
          if source.count(old) != 1:
              raise SystemExit('touch helper insertion target not unique')
          source = source.replace(old, new)

          old = """    Array.from(event.changedTouches||[]).forEach(touch=>{\n      const id=Number(touch.identifier),previous=touchStates.get(id),next=contactsForTouch(touch,rect);\n      if(!next)return;\n      const previousSet=new Set(previous?.subLanes||[]),entered=next.subLanes.filter(lane=>!previousSet.has(lane)),centerChanged=!previous||previous.centerSubLane!==next.centerSubLane;\n      touchStates.set(id,{...next,touch});\n      if(isStart||centerChanged||entered.length)actions.push({id,touch,next,entered:isStart?next.subLanes:entered});\n    });\n"""
          new = """    Array.from(event.changedTouches||[]).forEach(touch=>{\n      const id=Number(touch.identifier),previous=touchStates.get(id),stabilized=previous&&!isStart?stabilizedMoveTouch(previous,touch,rect):{touch,centerAnchorX:Number(touch.clientX),centerMoved:false},next=contactsForTouch(stabilized.touch,rect);\n      if(!next)return;\n      const previousSet=new Set(previous?.subLanes||[]),candidateEntered=next.subLanes.filter(lane=>!previousSet.has(lane)),centerChanged=!previous||previous.centerSubLane!==next.centerSubLane;\n      let entered=candidateEntered,acceptedRadiusX=Number(previous?.acceptedRadiusX);\n      const rawRadiusX=Number(touch?.radiusX);\n      if(isStart||centerChanged||stabilized.centerMoved){\n        acceptedRadiusX=rawRadiusX>0?rawRadiusX:acceptedRadiusX;\n      }else if(candidateEntered.length){\n        if(!radiusExpansionAccepted(acceptedRadiusX,rawRadiusX)){\n          const nextSet=new Set(next.subLanes),kept=(previous?.subLanes||[]).filter(lane=>nextSet.has(lane));\n          if(!kept.includes(next.centerSubLane))kept.push(next.centerSubLane);\n          next.subLanes=kept.sort((a,b)=>a-b);\n          entered=[];\n        }else acceptedRadiusX=rawRadiusX;\n      }else if(rawRadiusX>0&&(!(acceptedRadiusX>0)||rawRadiusX<acceptedRadiusX))acceptedRadiusX=rawRadiusX;\n      touchStates.set(id,{...next,touch,centerAnchorX:stabilized.centerAnchorX,acceptedRadiusX});\n      if(isStart||centerChanged||stabilized.centerMoved||entered.length)actions.push({id,touch,next,entered:isStart?next.subLanes:entered});\n    });\n"""
          if source.count(old) != 1:
              raise SystemExit('touch move state target not unique')
          source = source.replace(old, new)

          old = """  return {contactsForTouch,isSyntheticTapKey:key=>syntheticTapKeys.has(String(key)),clear,_touchStates:touchStates,_syntheticTapKeys:syntheticTapKeys};\n"""
          new = """  return {contactsForTouch,isSyntheticTapKey:key=>syntheticTapKeys.has(String(key)),clear,_touchStates:touchStates,_syntheticTapKeys:syntheticTapKeys,_stabilizedMoveTouch:stabilizedMoveTouch,_radiusExpansionAccepted:radiusExpansionAccepted};\n"""
          if source.count(old) != 1:
              raise SystemExit('touch runtime return target not unique')
          source = source.replace(old, new)
          source_path.write_text(source)

          lane_path = Path('monster-hero/data/rhythm-lane-svg.js')
          lane = lane_path.read_text()
          lane = lane.replace("  let touchSpanMoveGuardInstalled = false;\n", "")
          start = lane.find("  // Touch.radiusX は押しっぱなし中でも微細に変動するため、幅だけの変化を新しいTAP入力にしない。\n")
          end_marker = "  const judgmentRatio = area => {\n"
          end = lane.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('lane svg old touch guard block not found')
          lane = lane[:start] + "  // 押しっぱなし中の接触幅揺れ・意図的な拡張の判定は rhythm-mode.js 側で一元管理する。\n" + lane[end:]
          old = """  const start = () => {\n    installTouchSpanMoveGuard();\n    scan();\n"""
          new = """  const start = () => {\n    scan();\n"""
          if lane.count(old) != 1:
              raise SystemExit('lane svg guard install target not unique')
          lane = lane.replace(old, new)
          lane_path.write_text(lane)

          test_path = Path('tools/mode/rhythm-mode-tap-width-input-check.js')
          test = test_path.read_text()
          old = """assert(source.includes('entered=next.subLanes.filter(lane=>!previousSet.has(lane))')&&source.includes(\"entered:isStart?next.subLanes:entered\"),'touchmoveは新しく接触したサブレーンだけ再判定');\nassert(laneSvg.includes(\"window.addEventListener('touchmove'\")&&laneSvg.includes('previous.centerSubLane !== next.centerSubLane')&&laneSvg.includes('states.set(id, { ...next, touch });'),'radiusXの幅揺れだけでは押しっぱなしTAPを再発火しない');\n"""
          new = """assert(source.includes('candidateEntered=next.subLanes.filter(lane=>!previousSet.has(lane))')&&source.includes('radiusExpansionAccepted(acceptedRadiusX,rawRadiusX)'),'touchmoveは新規接触とradius拡張を分離判定');\nconst stableMove=run(`RHYTHM_TOUCH_SPAN_RUNTIME._stabilizedMoveTouch({centerAnchorX:${centerX}},{clientX:${centerX+4},clientY:800,radiusX:27},${JSON.stringify(touchRect)})`);\nassert.strictEqual(stableMove.centerMoved,false,'指腹変形による数pxの中心揺れは移動扱いにしない');\nassert(Math.abs(stableMove.touch.clientX-centerX)<1e-9,'微小中心揺れでは元の中心位置を維持');\nconst realMove=run(`RHYTHM_TOUCH_SPAN_RUNTIME._stabilizedMoveTouch({centerAnchorX:${centerX}},{clientX:${centerX+12},clientY:800,radiusX:27},${JSON.stringify(touchRect)})`);\nassert.strictEqual(realMove.centerMoved,true,'明確な横移動は従来どおり追従');\nassert.strictEqual(run(`RHYTHM_TOUCH_SPAN_RUNTIME._radiusExpansionAccepted(25,27)`),false,'radiusXの小さな揺れは追加TAPにしない');\nassert.strictEqual(run(`RHYTHM_TOUCH_SPAN_RUNTIME._radiusExpansionAccepted(25,29)`),true,'指の腹を明確に広げた時は追加接触を許可');\nassert(!laneSvg.includes(\"window.addEventListener('touchmove'\")&&!laneSvg.includes('installTouchSpanMoveGuard'),'旧window幅同期ガードを撤去してruntimeへ一元化');\n"""
          if test.count(old) != 1:
              raise SystemExit('touch move assertions target not unique')
          test = test.replace(old, new)
          old = "console.log('OK: 10サブレーン可変幅TAP入力・接触半径70%補正・隣接25%重なり条件・固定3上限なし・異常radius fallback・押しっぱなし回帰防止・発光レイヤー・旧譜面・projection回帰');"
          new = "console.log('OK: 10サブレーン可変幅TAP入力・接触半径70%補正・隣接25%重なり条件・指腹拡張追従・中心揺れデッドゾーン・固定3上限なし・異常radius fallback・押しっぱなし回帰防止・発光レイヤー・旧譜面・projection回帰');"
          if test.count(old) != 1:
              raise SystemExit('test summary target not unique')
          test = test.replace(old, new)
          test_path.write_text(test)
          PY
      - name: Run focused rhythm input check
        run: node tools/mode/rhythm-mode-tap-width-input-check.js
      - name: Run canonical build and stamp update banner
        run: node tools/build.js
      - name: Verify changelog stayed untouched
        run: git diff --exit-code -- monster-hero/data/changelog.js
      - name: Re-run focused rhythm input check
        run: node tools/mode/rhythm-mode-tap-width-input-check.js
      - name: Commit implementation
        env:
          HEAD_BRANCH: chatgpt/rhythm-touch-expand
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: track deliberate held-touch expansion"
          git push origin "HEAD:${HEAD_BRANCH}"
