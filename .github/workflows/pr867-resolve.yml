name: Temporary resolve PR 867

on:
  push:
    branches:
      - 'yw321y-codex/implement-step-2b-for-tap-play'

permissions:
  contents: write

jobs:
  resolve:
    if: ${{ !contains(github.event.head_commit.message, '[resolved-pr867]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: yw321y-codex/implement-step-2b-for-tap-play
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Merge latest main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge origin/main -X ours --no-edit
          # STEP 2B is still debug-only. Keep the canonical main changelog rather than
          # publishing a debug-only changelog entry, and preserve concurrent main work.
          git checkout origin/main -- monster-hero/data/changelog.js

      - name: Verify both concurrent main work and STEP 2B survived
        run: |
          grep -q 'mergeRhythmBestRecord' monster-hero/src/game-system.jsx
          grep -q 'data-rhythm-pause' monster-hero/src/game-system.jsx
          grep -q 'EIKI_SAKURA_PETALS' monster-hero/src/game-system.jsx
          grep -q 'eikiSakuraCombo' monster-hero/src/game-system.jsx
          test -f tools/image/art-source-fidelity-check.js
          test -f tools/art-sources/monsters/PANDORA-original.PNG
          test ! -f tools/image/clean-trapped-background.js

      - name: Install locked tool dependencies
        working-directory: tools
        run: npm ci --omit=optional

      - name: Rebuild canonical generated files
        run: node tools/build.js

      - name: Run STEP 2B and regression checks
        run: |
          node tools/mode/rhythm-mode-foundation-check.js
          node tools/mode/rhythm-mode-tap-engine-check.js
          node tools/mode/rhythm-mode-tap-completion-check.js
          node tools/check-syntax.js
          node tools/undefined-reference-check.js
          node tools/help-coverage-check.js
          node tools/help-guide-check.js
          node tools/help-render-check.js
          node tools/mode/eiki-debug-check.js
          node tools/image/art-source-fidelity-check.js
          node tools/build.js --check
          git diff --check

      - name: Remove temporary workflow and push resolved branch
        run: |
          git rm .github/workflows/pr867-resolve.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: resolve STEP 2B against latest main [resolved-pr867]'
          fi
          git push origin HEAD:yw321y-codex/implement-step-2b-for-tap-play
