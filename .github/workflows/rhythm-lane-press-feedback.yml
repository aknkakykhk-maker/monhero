name: Apply rhythm lane press feedback

on:
  push:
    branches: [chatgpt/rhythm-lane-press-feedback]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/rhythm-lane-press-feedback
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply lane press feedback
        run: |
          python3 <<'PY'
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import json, re

          src_path = Path('monster-hero/src/game-system.jsx')
          src = src_path.read_text()

          marker = "  const pointerDown=e=>{if(e.pointerType==='touch')return;e.preventDefault();"
          if marker not in src:
              raise SystemExit('pointerDown marker not found')
          helper = """  const setPressedLanes=lanes=>{const area=playAreaRef.current;if(!area)return;const active=lanes instanceof Set?lanes:new Set(lanes||[]);area.querySelectorAll('[data-rhythm-lane]').forEach((el,index)=>{const pressed=active.has(index);el.dataset.pressed=pressed?'true':'false';el.style.backgroundColor=pressed?'rgba(34,211,238,0.30)':'';el.style.boxShadow=pressed?'inset 0 0 26px rgba(103,232,249,0.55), inset 0 -42px 48px rgba(6,182,212,0.28)':'';});};\n"""
          src = src.replace(marker, helper + marker, 1)

          pointer_start = "if(lane===null)return;inputStarts([{lane,inputKey:rhythmInputKey('pointer',e.pointerId)"
          if pointer_start not in src:
              raise SystemExit('pointer start marker not found')
          src = src.replace(pointer_start, "if(lane===null)return;setPressedLanes([lane]);inputStarts([{lane,inputKey:rhythmInputKey('pointer',e.pointerId)", 1)

          pointer_end = "const pointerEnd=e=>{if(e.pointerType==='touch')return;"
          if pointer_end not in src:
              raise SystemExit('pointer end marker not found')
          src = src.replace(pointer_end, pointer_end + "setPressedLanes([]);", 1)

          touch_decl = "const rect=area.getBoundingClientRect(),live=new Set(),starts=[];"
          if touch_decl not in src:
              raise SystemExit('touch declaration marker not found')
          src = src.replace(touch_decl, "const rect=area.getBoundingClientRect(),live=new Set(),liveLanes=new Set(),starts=[];", 1)

          touch_body = "live.add(inputKey);if(current.activeTouchInputs.has(inputKey))return;current.activeTouchInputs.add(inputKey);const lane=rhythmLaneFromClientX(touch.clientX,rect.left,rect.width);if(lane!==null)starts.push({lane,inputKey});"
          if touch_body not in src:
              raise SystemExit('touch body marker not found')
          src = src.replace(touch_body, "live.add(inputKey);const lane=rhythmLaneFromClientX(touch.clientX,rect.left,rect.width);if(lane!==null)liveLanes.add(lane);if(current.activeTouchInputs.has(inputKey))return;current.activeTouchInputs.add(inputKey);if(lane!==null)starts.push({lane,inputKey});", 1)

          starts_marker = "});if(starts.length)inputStarts(starts);const ended=[];"
          if starts_marker not in src:
              raise SystemExit('touch starts marker not found')
          src = src.replace(starts_marker, "});setPressedLanes(liveLanes);if(starts.length)inputStarts(starts);const ended=[];", 1)

          cleanup_marker = "area.removeEventListener('touchcancel',syncTouches);};},[view.status]);"
          if cleanup_marker not in src:
              raise SystemExit('touch cleanup marker not found')
          src = src.replace(cleanup_marker, "area.removeEventListener('touchcancel',syncTouches);setPressedLanes([]);};},[view.status]);", 1)

          lane_old = '<div key={lane} aria-hidden="true" className="relative border-r border-white/20 bg-slate-900/40">'
          lane_new = '<div key={lane} data-rhythm-lane={lane} data-pressed="false" aria-hidden="true" className="relative border-r border-white/20 bg-slate-900/40" style={{transition:\'background-color 60ms linear, box-shadow 60ms linear\'}}>'
          if lane_old not in src:
              raise SystemExit('lane visual marker not found')
          src = src.replace(lane_old, lane_new, 1)

          resets = [
              ("run.activePointers.clear();run.activeTouchInputs?.clear();run.notes.forEach", "run.activePointers.clear();run.activeTouchInputs?.clear();setPressedLanes([]);run.notes.forEach"),
              ("run.activePointers=new Map();run.activeTouchInputs=new Set();run.combo=0;", "run.activePointers=new Map();run.activeTouchInputs=new Set();setPressedLanes([]);run.combo=0;"),
              ("run.activePointers.clear();run.activeTouchInputs?.clear();run.audio?.stop();", "run.activePointers.clear();run.activeTouchInputs?.clear();setPressedLanes([]);run.audio?.stop();"),
          ]
          for old,new in resets:
              if old not in src:
                  raise SystemExit(f'reset marker not found: {old[:55]}')
              src = src.replace(old,new,1)

          stamp = datetime.now(ZoneInfo('Asia/Tokyo')).strftime('%Y-%m-%d %H:%M')
          src, n = re.subn(r'const BUILD_DATE = "[^"]+";', f'const BUILD_DATE = "{stamp}";', src, count=1)
          if n != 1:
              raise SystemExit('BUILD_DATE not updated')
          src_path.write_text(src)

          version_path = Path('monster-hero/version.json')
          version = json.loads(version_path.read_text())
          version['build'] = stamp
          version_path.write_text(json.dumps(version, ensure_ascii=False, indent=2) + '\n')

          changelog_path = Path('monster-hero/data/changelog.js')
          changelog = changelog_path.read_text()
          title = "title:'音ゲーの2本指入力を修正'"
          pos = changelog.find(title)
          if pos < 0:
              raise SystemExit('rhythm changelog entry not found')
          item_pos = changelog.find("items:[", pos)
          end_pos = changelog.find("],", item_pos)
          if item_pos < 0 or end_pos < 0:
              raise SystemExit('rhythm changelog items not found')
          segment = changelog[item_pos:end_pos]
          feedback = "押しているレーンが光る入力フィードバックを戻し、2本指では2レーンが同時に光るようにしました。"
          if feedback not in segment:
              segment = segment.rstrip() + ", '" + feedback + "'"
              changelog = changelog[:item_pos] + segment + changelog[end_pos:]
          changelog_path.write_text(changelog)

          Path('tools/mode/rhythm-mode-lane-feedback-check.js').write_text("""const fs=require('fs');\nconst game=fs.readFileSync('monster-hero/src/game-system.jsx','utf8');\nconst must=[\n  \"const setPressedLanes=lanes=>\",\n  \"data-rhythm-lane={lane}\",\n  \"liveLanes=new Set()\",\n  \"setPressedLanes(liveLanes)\",\n  \"backgroundColor=pressed?'rgba(34,211,238,0.30)'\",\n  \"boxShadow=pressed?'inset 0 0 26px\",\n  \"setPressedLanes([]);run.notes.forEach\",\n  \"setPressedLanes([]);run.audio?.stop()\"\n];\nfor(const token of must){if(!game.includes(token)){console.error('missing lane feedback token:',token);process.exit(1);}}\nif(!game.includes(\"rhythmMatchInputBatch(run.notes,inputs,now,settings.judgmentTimingOffsetMs)\")){console.error('simultaneous batch input path regressed');process.exit(1);}\nconsole.log('rhythm lane press feedback check: OK');\n""")

          multitouch_path = Path('tools/mode/rhythm-mode-multitouch-check.js')
          multitouch = multitouch_path.read_text()
          old = "game.includes('const rect=area.getBoundingClientRect(),live=new Set(),starts=[]')&&game.includes('if(starts.length)inputStarts(starts)')"
          new = "game.includes('const rect=area.getBoundingClientRect(),live=new Set(),')&&game.includes('starts=[]')&&game.includes('if(starts.length)inputStarts(starts)')"
          if old not in multitouch:
              raise SystemExit('multitouch batch check marker not found')
          multitouch_path.write_text(multitouch.replace(old,new,1))
          PY
      - name: Install locked tool dependencies
        run: cd tools && npm ci
      - name: Build canonical output
        run: |
          node tools/build.js
          node tools/build.js --check
      - name: Run rhythm and regression checks
        run: |
          node tools/mode/rhythm-mode-foundation-check.js
          node tools/mode/rhythm-mode-tap-engine-check.js
          node tools/mode/rhythm-mode-tap-completion-check.js
          node tools/mode/rhythm-mode-hold-engine-check.js
          node tools/mode/rhythm-mode-multitouch-check.js
          node tools/mode/rhythm-mode-simultaneous-input-check.js
          node tools/mode/rhythm-mode-lane-feedback-check.js
          for f in tools/check-syntax.js tools/undefined-reference-check.js tools/check-jsx-braces.js tools/help-coverage-check.js tools/help-guide-check.js tools/help-render-check.js; do if [ -f "$f" ]; then node "$f"; fi; done
          git diff --check
      - name: Commit feedback and remove temporary workflow
        run: |
          git config user.name ChatGPT
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/rhythm-lane-press-feedback.yml
          git add monster-hero tools/mode/rhythm-mode-lane-feedback-check.js tools/mode/rhythm-mode-multitouch-check.js
          git commit -m "fix: restore rhythm lane press feedback"
          git push origin HEAD:chatgpt/rhythm-lane-press-feedback
