name: Temporary Eiki popup wrap columns

on:
  push:
    branches: [chatgpt/eiki-popup-wrap-columns]

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/eiki-popup-wrap-columns
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install locked tool dependencies
        working-directory: tools
        run: npm ci --omit=optional
      - name: Wrap long damage popups into columns
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('monster-hero/src/game-system.jsx')
          lines=p.read_text().splitlines()
          target="absolute inset-0 z-50 pointer-events-none flex flex-col items-center justify-start pt-1 gap-0.5"
          matches=[i for i,line in enumerate(lines) if target in line and "popups.filter(p=>p.side==='enemy').map" in line]
          if len(matches)!=1:
              raise SystemExit(f'enemy popup render target count={len(matches)}')
          i=matches[0]
          replacement=r'''                {(() => {
                  const enemyPopups=popups.filter(p=>p.side==='enemy');
                  const wrapEnemyPopups=!liteBattleView&&enemyPopups.length>4;
                  const popupColumns=wrapEnemyPopups?Math.ceil(enemyPopups.length/4):1;
                  const popupGridStyle=wrapEnemyPopups?{
                    display:'grid',
                    gridAutoFlow:'column',
                    gridTemplateRows:'repeat(4, auto)',
                    gridAutoColumns:'max-content',
                    justifyContent:'center',
                    alignContent:'start',
                    columnGap:popupColumns>=3?'0px':'4px',
                    rowGap:'2px',
                    paddingTop:'4px'
                  }:undefined;
                  const compactPopupStyle=wrapEnemyPopups?{
                    fontSize:popupColumns>=3?'clamp(1.4rem, 5.8vw, 1.85rem)':'clamp(1.75rem, 7.5vw, 2.25rem)',
                    lineHeight:1.05,
                    paddingLeft:'2px',
                    paddingRight:'2px'
                  }:undefined;
                  return (
                    <div className={`absolute inset-0 z-50 pointer-events-none ${wrapEnemyPopups?'':'flex flex-col items-center justify-start pt-1 gap-0.5'}`} style={popupGridStyle}>
                      {enemyPopups.map(p=>(<div key={p.id} data-lite-damage={liteBattleView?'true':undefined} style={compactPopupStyle} className={`text-center ${p.color} font-black whitespace-nowrap px-4 ${liteBattleView?'rounded-lg border border-white/20 bg-slate-950/95 py-1 text-base':'drop-shadow-[0_0_15px_rgba(0,0,0,1)]'}`}>{p.text}</div>))}
                    </div>
                  );
                })()}'''.splitlines()
          lines[i:i+1]=replacement
          p.write_text('\n'.join(lines)+'\n')
          PY
      - name: Build canonical output
        run: node tools/build.js
      - name: Check source and battle regressions
        run: |
          node tools/build.js --check
          node tools/check-syntax.js
          node tools/undefined-reference-check.js
          node tools/mode/eiki-combo-damage-check.js
          node tools/mode/eiki-debug-check.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('monster-hero/src/game-system.jsx').read_text()
          required=[
            "enemyPopups.length>4",
            "Math.ceil(enemyPopups.length/4)",
            "gridTemplateRows:'repeat(4, auto)'",
            "gridAutoFlow:'column'",
            "clamp(1.75rem, 7.5vw, 2.25rem)",
            "clamp(1.4rem, 5.8vw, 1.85rem)",
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit(f'missing popup wrap markers: {missing}')
          print('damage popup wrap layout check: OK')
          PY
          git diff --check
      - name: Commit result and remove temporary workflow
        run: |
          rm .github/workflows/_tmp_eiki_popup_wrap_columns.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: 長い連撃ダメージを4段ごとに折り返す"
          git push origin HEAD:chatgpt/eiki-popup-wrap-columns
