name: Temporary mhsave iOS filename fix

on:
  push:
    branches:
      - chatgpt/mhsave-ios-filename-fix-final2
    paths:
      - .github/workflows/mhsave-ios-filename-fix-temp.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/mhsave-ios-filename-fix-final2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install locked tool dependencies
        working-directory: tools
        run: npm ci --omit=optional
      - name: Patch, build and verify
        run: |
          node tools/mhsave-ios-filename-fix-temp.js
          node tools/build.js
          node tools/build.js --check
          node tools/compiled-runtime-check.js
          node tools/check-syntax.js
          node tools/undefined-reference-check.js
          node tools/boot-flow-check.js
          node tools/update-notice-check.js
          node tools/boot/data-cache-key-check.js
          node tools/mode/rhythm-mode-note-perspective-check.js
          node tools/mode/rhythm-mode-restart-remount-check.js
          node tools/mode/rhythm-mode-release-timing-check.js
          node tools/mode/rhythm-mode-note-se-check.js
          node tools/mode/rhythm-mode-slide-sublane-check.js
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monster-hero
          git commit -m "fix: preserve mhsave filename on iPhone share"
          git push origin HEAD:chatgpt/mhsave-ios-filename-fix-final2
