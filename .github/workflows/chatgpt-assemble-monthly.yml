name: Assemble monthly mission change
on:
  push:
    branches:
      - chatgpt/monthly-missions-20260829-v2
permissions:
  contents: write
jobs:
  assemble:
    if: "github.event.head_commit.message == 'chore: run monthly mission assembler'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/monthly-missions-20260829-v2
      - name: Assemble and commit
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r idx path count; do
            mkdir -p "$(dirname "$path")"
            cat ".chatgpt-upload/${idx}."* > "$path"
            actual=$(find ".chatgpt-upload" -maxdepth 1 -type f -name "${idx}.*" | wc -l)
            test "$actual" -eq "$count"
          done <<'MANIFEST'
          000|docs/spec/SAVE_DATA.md|1
          001|monster-hero/data/changelog.js|1
          002|monster-hero/data/help.js|1
          003|monster-hero/game-system.compiled.js|6
          004|monster-hero/index.html|1
          005|monster-hero/src/game-system.jsx|5
          006|monster-hero/version.json|1
          007|tools/README.md|1
          008|tools/boot/mission-check.js|1
          009|tools/boot/mission-gift-badge-check.js|1
          010|tools/help-coverage-check.js|1
          011|tools/help-guide-check.js|1
          MANIFEST
          rm -rf .chatgpt-upload
          rm -f .github/workflows/chatgpt-assemble-monthly.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add monthly missions"
          git push origin HEAD:chatgpt/monthly-missions-20260829-v2
