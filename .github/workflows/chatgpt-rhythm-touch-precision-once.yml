name: ChatGPT one-time rhythm touch precision tuning

on:
  push:
    branches:
      - chatgpt/rhythm-touch-precision

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/rhythm-touch-precision
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install locked tool dependencies
        working-directory: tools
        run: npm ci --omit=optional
      - name: Tighten rhythm touch span matching
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('monster-hero/data/rhythm-mode.js')
          source = source_path.read_text()

          old = """// iPhoneのTouch.radiusXを既存projectionへ通し、実際の接触幅に応じたサブレーン領域として扱う。\n// radiusXは端を拾いすぎないよう75%へ縮小し、明らかな異常値だけ中心1サブレーンへfallbackする。\n// ゲーム本体の中心1点入力はそのまま残し、中心以外の新規接触サブレーンだけTAP専用の疑似Pointerで補う。\nconst RHYTHM_TOUCH_RADIUS_SCALE=.75;\nconst RHYTHM_TOUCH_RADIUS_MAX_PLAY_AREA_RATIO=.25;\n"""
          new = """// iPhoneのTouch.radiusXを既存projectionへ通し、実際の接触幅に応じたサブレーン領域として扱う。\n// radiusXは端を拾いすぎないよう70%へ縮小し、隣接サブレーンは25%以上重なった時だけ接触扱いにする。\n// 明らかな異常値だけ中心1サブレーンへfallbackする。ゲーム本体の中心1点入力はそのまま残し、\n// 中心以外の新規接触サブレーンだけTAP専用の疑似Pointerで補う。\nconst RHYTHM_TOUCH_RADIUS_SCALE=.70;\nconst RHYTHM_TOUCH_MIN_SUBLANE_COVERAGE=.25;\nconst RHYTHM_TOUCH_RADIUS_MAX_PLAY_AREA_RATIO=.25;\n"""
          if source.count(old) != 1:
              raise SystemExit('touch tuning header target not unique')
          source = source.replace(old, new)

          old = """    let subLanes=[];\n    for(let lane=clampSubLane(min);lane<=clampSubLane(max);lane++)subLanes.push(lane);\n    if(!subLanes.includes(centerSubLane))subLanes.push(centerSubLane);\n"""
          new = """    let subLanes=[];\n    for(let lane=clampSubLane(min);lane<=clampSubLane(max);lane++){\n      const overlap=Math.max(0,Math.min(max,lane+1)-Math.max(min,lane));\n      if(lane===centerSubLane||overlap>=RHYTHM_TOUCH_MIN_SUBLANE_COVERAGE)subLanes.push(lane);\n    }\n    if(!subLanes.includes(centerSubLane))subLanes.push(centerSubLane);\n"""
          if source.count(old) != 1:
              raise SystemExit('touch lane overlap target not unique')
          source = source.replace(old, new)
          source_path.write_text(source)

          test_path = Path('tools/mode/rhythm-mode-tap-width-input-check.js')
          test = test_path.read_text()

          old = """const contact=run(`RHYTHM_TOUCH_SPAN_RUNTIME.contactsForTouch({clientX:${centerX},clientY:800,radiusX:45},${JSON.stringify(touchRect)})`);\nassert.deepEqual(Array.from(contact.subLanes),[3,4,5],'Touch.radiusXを75%へ縮小してprojectionへ通す');\nconst narrowedContact=run(`RHYTHM_TOUCH_SPAN_RUNTIME.contactsForTouch({clientX:${centerX},clientY:800,radiusX:25},${JSON.stringify(touchRect)})`);\nassert.deepEqual(Array.from(narrowedContact.subLanes),[4],'接触端を75%補正して隣接サブレーンの拾いすぎを抑える');\nconst broadContact=run(`RHYTHM_TOUCH_SPAN_RUNTIME.contactsForTouch({clientX:${centerX},clientY:800,radiusX:90},${JSON.stringify(touchRect)})`);\nassert.deepEqual(Array.from(broadContact.subLanes),[2,3,4,5,6],'通常範囲の広い接触は3サブレーン固定上限なしで反映');\n"""
          new = """const contact=run(`RHYTHM_TOUCH_SPAN_RUNTIME.contactsForTouch({clientX:${centerX},clientY:800,radiusX:45},${JSON.stringify(touchRect)})`);\nassert.deepEqual(Array.from(contact.subLanes),[3,4,5],'Touch.radiusXを70%へ縮小してprojectionへ通す');\nconst narrowedContact=run(`RHYTHM_TOUCH_SPAN_RUNTIME.contactsForTouch({clientX:${centerX},clientY:800,radiusX:25},${JSON.stringify(touchRect)})`);\nassert.deepEqual(Array.from(narrowedContact.subLanes),[4],'通常の細い接触は中心1サブレーン');\nconst boundaryX=run(`rhythmProjectBoundary(2.5,1)`)*touchRect.width;\nconst slightOverlap=run(`RHYTHM_TOUCH_SPAN_RUNTIME.contactsForTouch({clientX:${boundaryX-10},clientY:800,radiusX:25},${JSON.stringify(touchRect)})`);\nassert.deepEqual(Array.from(slightOverlap.subLanes),[4],'隣接サブレーンへの25%未満のはみ出しは拾わない');\nconst solidOverlap=run(`RHYTHM_TOUCH_SPAN_RUNTIME.contactsForTouch({clientX:${boundaryX-5},clientY:800,radiusX:25},${JSON.stringify(touchRect)})`);\nassert.deepEqual(Array.from(solidOverlap.subLanes),[4,5],'隣接サブレーンへ25%以上重なれば接触扱い');\nconst broadContact=run(`RHYTHM_TOUCH_SPAN_RUNTIME.contactsForTouch({clientX:${centerX},clientY:800,radiusX:100},${JSON.stringify(touchRect)})`);\nassert(broadContact.subLanes.length>3,'十分広い実接触は固定3サブレーン上限なしで反映');\n"""
          if test.count(old) != 1:
              raise SystemExit('touch tests target not unique')
          test = test.replace(old, new)

          old = "assert(source.includes('RHYTHM_TOUCH_RADIUS_SCALE=.75')&&source.includes('RHYTHM_TOUCH_RADIUS_MAX_PLAY_AREA_RATIO=.25')&&!source.includes('subLanes.length>3'),'接触半径75%補正・固定3サブレーン上限撤廃');"
          new = "assert(source.includes('RHYTHM_TOUCH_RADIUS_SCALE=.70')&&source.includes('RHYTHM_TOUCH_MIN_SUBLANE_COVERAGE=.25')&&source.includes('overlap>=RHYTHM_TOUCH_MIN_SUBLANE_COVERAGE')&&!source.includes('subLanes.length>3'),'接触半径70%補正・隣接25%重なり条件・固定3上限なし');"
          if test.count(old) != 1:
              raise SystemExit('touch source assertion target not unique')
          test = test.replace(old, new)

          old = "console.log('OK: 10サブレーン可変幅TAP入力・接触半径75%補正・固定3上限撤廃・異常radius fallback・押しっぱなし回帰防止・発光レイヤー・旧譜面・projection回帰');"
          new = "console.log('OK: 10サブレーン可変幅TAP入力・接触半径70%補正・隣接25%重なり条件・固定3上限なし・異常radius fallback・押しっぱなし回帰防止・発光レイヤー・旧譜面・projection回帰');"
          if test.count(old) != 1:
              raise SystemExit('test summary target not unique')
          test = test.replace(old, new)
          test_path.write_text(test)
          PY
      - name: Run focused rhythm input check
        run: node tools/mode/rhythm-mode-tap-width-input-check.js
      - name: Run canonical build and stamp update banner
        run: node tools/build.js
      - name: Verify changelog stayed untouched
        run: git diff --exit-code -- monster-hero/data/changelog.js
      - name: Re-run focused rhythm input check
        run: node tools/mode/rhythm-mode-tap-width-input-check.js
      - name: Commit implementation
        env:
          HEAD_BRANCH: chatgpt/rhythm-touch-precision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: tighten rhythm touch span matching"
          git push origin "HEAD:${HEAD_BRANCH}"
