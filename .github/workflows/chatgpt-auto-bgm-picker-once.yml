name: Apply AUTO BGM picker

on:
  push:
    branches: [chatgpt/auto-bgm-picker]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[auto-bgm-picker-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/auto-bgm-picker
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install locked tool dependencies
        working-directory: tools
        run: npm ci --omit=optional
      - name: Apply requested implementation
        run: node tools/chatgpt-auto-bgm-picker-patch.js
      - name: Build canonical distribution
        run: node tools/build.js
      - name: Align AUTO BGM picker regression check
        run: |
          cat > tools/audio/auto-bgm-runtime-picker-check.js <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const ROOT=path.resolve(__dirname,'../..');
          const files=['monster-hero/src/game-system.jsx','monster-hero/game-system.compiled.js'];
          let failed=0;
          const check=(name,ok)=>{console.log((ok?'OK':'NG')+': '+name);if(!ok)failed++;};
          for(const file of files){
            const s=fs.readFileSync(path.join(ROOT,file),'utf8');
            check(file+': AUTO BGM一時上書きstate',s.includes('autoBgmOverride')&&s.includes('showAutoBgmPicker'));
            check(file+': AUTO停止で一時選択を解除',s.includes('setAutoBgmOverride(null)')&&s.includes('setShowAutoBgmPicker(false)'));
            check(file+': AUTO中は一時選択を優先',s.includes("if (autoBgmOverride === '__none__') return '__silence_bgm__';")&&s.includes('return autoBgmOverride || bgmArrangement.autoBattle;'));
            check(file+': BGMなしはBGMだけ停止',s.includes("if (key === '__silence_bgm__')")&&s.includes('Audio_.stopBGM();'));
            check(file+': BGM選択UIの主要文字列',s.includes('AUTO BGMを選ぶ')&&s.includes('BGMなし')&&s.includes('AUTO中に再生するBGM'));
            check(file+': 登録曲一覧をBGM選択へ利用',/BGM_TRACKS\.map\(/.test(s));
          }
          const help=fs.readFileSync(path.join(ROOT,'monster-hero/data/help.js'),'utf8');
          const log=fs.readFileSync(path.join(ROOT,'monster-hero/data/changelog.js'),'utf8');
          check('ヘルプにAUTO BGM選択を掲載',help.includes('AUTO中はバトル画面の🎵ボタン'));
          check('更新履歴にAUTO BGM選択を掲載',log.includes('AUTO中にBGMを選べるようにしました'));
          if(failed)process.exit(1);
          console.log('OK: AUTO BGM選択の検証に成功しました');
          NODE
      - name: Run scoped BGM checks
        run: |
          node tools/audio/auto-bgm-runtime-picker-check.js
          node tools/audio/auto-repeat-result-bgm-check.js
          node tools/audio/auto-bgm-continuity-check.js
          node tools/audio/bgm-arrangement-check.js
      - name: Run source, help, and update checks
        run: |
          node tools/check-syntax.js
          node tools/undefined-reference-check.js
          node tools/help-coverage-check.js
          node tools/help-guide-check.js
          node tools/help-render-check.js
          node tools/update-notice-check.js
      - name: Verify canonical build and diff
        run: |
          node tools/build.js --check
          git diff --check
      - name: Remove one-shot runner
        run: |
          rm -f tools/chatgpt-auto-bgm-picker-patch.js
          rm -f .github/workflows/chatgpt-auto-bgm-picker-once.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add AUTO runtime BGM picker [auto-bgm-picker-applied]"
          git push origin HEAD:chatgpt/auto-bgm-picker
