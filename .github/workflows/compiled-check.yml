name: Build and deploy Pages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'pages' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install locked tool dependencies
        working-directory: tools
        run: npm ci --omit=optional
      - name: Verify the committed compiled output is canonical
        run: node tools/build.js --check
      - name: Verify the compiled runtime
        run: node tools/compiled-runtime-check.js
      - name: Check source syntax and references
        run: |
          node tools/check-syntax.js
          node tools/undefined-reference-check.js
      # このPRで実音源の拍グリッドを確定するためだけの一時解析。最終マージ前に削除する。
      - name: Install ffmpeg for rhythm timing analysis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Analyze rhythm source audio timing
        run: node tools/mode/rhythm-audio-timing-analyze.js --require-ffmpeg --json
      - name: Upload rhythm source for offline cross-check
        uses: actions/upload-artifact@v4
        with:
          name: rhythm-audio-source
          path: monster-hero/audio/bgm-atsu-cup-theme.mp3
          retention-days: 1
      - name: Check the boot path
        run: node tools/boot-flow-check.js
      - name: Check the shipped version stamps
        run: node tools/update-notice-check.js
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Stage the GitHub Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir _site
          cp index.html _site/
          cp -a monster-hero _site/
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
