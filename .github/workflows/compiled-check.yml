name: Build and deploy Pages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # PRの検査とmainの公開を同じ列に並べない。
  # 以前は両方が group: pages を共有し、cancel-in-progress: false だったため、
  # PRへ連続pushするとその検査が全部並び、mainの公開まで順番待ちになっていた。
  #   PR        … ブランチごとに1本。新しくpushしたら古い検査は打ち切ってよい
  #   mainへpush … 常に pages の1本。公開は途中で止めない(Pagesのデプロイを壊さない)
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'pages' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require update banner stamp for shipped changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          shipped="$(printf '%s\n' "$changed" | grep -E '^(monster-hero/|index\.html$)' | grep -v '^monster-hero/version\.json$' || true)"
          if [[ -z "$shipped" ]]; then
            echo "配信対象の変更なし: 更新バナーstampは不要"
            exit 0
          fi
          if ! printf '%s\n' "$changed" | grep -qx 'monster-hero/version.json'; then
            echo "NG: 配信対象を変更したのに monster-hero/version.json が更新されていません"
            echo "デバッグ・内部修正でも node tools/build.js を実行して更新バナー用buildを進めてください"
            exit 1
          fi
          echo "OK: 配信対象の変更に更新バナー用versionが含まれています"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install locked tool dependencies
        working-directory: tools
        run: npm ci --omit=optional
      - name: Verify soul rank aura PNG assets (temporary)
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct, zlib

          files = [
              'soul_rank_I_blue.png',
              'soul_rank_II_yellow.png',
              'soul_rank_III_green.png',
              'soul_rank_IV_red.png',
              'soul_rank_V_rainbow.png',
          ]
          root = Path('monster-hero/images/effects')
          expected_size = None

          def paeth(a,b,c):
              p=a+b-c; pa=abs(p-a); pb=abs(p-b); pc=abs(p-c)
              return a if pa<=pb and pa<=pc else (b if pb<=pc else c)

          for name in files:
              data=(root/name).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', f'NG: PNG signature {name}'
              pos=8; idat=[]; ihdr=None
              while pos < len(data):
                  ln=struct.unpack('>I',data[pos:pos+4])[0]; typ=data[pos+4:pos+8]; chunk=data[pos+8:pos+8+ln]; pos += 12+ln
                  if typ == b'IHDR': ihdr=chunk
                  elif typ == b'IDAT': idat.append(chunk)
                  elif typ == b'IEND': break
              w,h,bit_depth,color_type,comp,flt,interlace=struct.unpack('>IIBBBBB',ihdr)
              assert bit_depth == 8 and color_type == 6 and interlace == 0, f'NG: expected 8-bit RGBA non-interlaced: {name} got depth={bit_depth} type={color_type} interlace={interlace}'
              if expected_size is None: expected_size=(w,h)
              assert (w,h)==expected_size, f'NG: size mismatch {name}: {(w,h)} != {expected_size}'
              raw=zlib.decompress(b''.join(idat)); bpp=4; stride=w*bpp
              prev=bytearray(stride); off=0
              amin=255; amax=0; zero=partial=opaque=0; corners=[]
              for y in range(h):
                  f=raw[off]; off+=1; src=raw[off:off+stride]; off+=stride; cur=bytearray(stride)
                  for x,v in enumerate(src):
                      left=cur[x-bpp] if x>=bpp else 0; up=prev[x]; ul=prev[x-bpp] if x>=bpp else 0
                      if f==0: val=v
                      elif f==1: val=(v+left)&255
                      elif f==2: val=(v+up)&255
                      elif f==3: val=(v+((left+up)//2))&255
                      elif f==4: val=(v+paeth(left,up,ul))&255
                      else: raise AssertionError(f'NG: unknown PNG filter {f} in {name}')
                      cur[x]=val
                  for x in range(w):
                      a=cur[x*4+3]; amin=min(amin,a); amax=max(amax,a)
                      if a==0: zero+=1
                      elif a==255: opaque+=1
                      else: partial+=1
                  if y in (0,h-1): corners.extend([cur[3],cur[(w-1)*4+3]])
                  prev=cur
              total=w*h
              assert zero > 0, f'NG: no fully transparent pixels: {name}'
              assert partial > 0, f'NG: no soft alpha pixels: {name}'
              assert min(corners)==0, f'NG: image corners are not transparent: {name} corners={corners}'
              transparent_ratio=zero/total
              assert transparent_ratio > 0.10, f'NG: suspiciously little transparent area: {name} ratio={transparent_ratio:.3f}'
              print(f'OK {name}: {w}x{h} RGBA alpha={amin}-{amax} transparent={zero} ({transparent_ratio:.1%}) partial={partial} opaque={opaque} corners={corners}')
          print('魂格オーラ5枚: PNG/alpha/透過/寸法チェックOK')
          PY
      # コミット済みの配信用JSが game-system.jsx の正規ビルドと一致していることを先に確かめる。
      # ここでビルドし直してから確認すると、build.js の実行を忘れたコミットでも必ず通ってしまい、
      # リポジトリの中身と配信物がずれたまま気付けない(実際にそのまま公開された)。
      # 配信するのはリポジトリの中身そのものなので、ずれていたら公開せずに落とす。
      - name: Verify the committed compiled output is canonical
        run: node tools/build.js --check
      - name: Verify the compiled runtime
        run: node tools/compiled-runtime-check.js
      - name: Check source syntax and references
        run: |
          node tools/check-syntax.js
          node tools/undefined-reference-check.js
      - name: Check the boot path
        run: node tools/boot-flow-check.js
      - name: Check the shipped version stamps
        run: node tools/update-notice-check.js
      - name: Check shipped data metadata and rhythm geometry
        run: |
          node tools/boot/data-cache-key-check.js
          node tools/mode/rhythm-mode-note-perspective-check.js
          node tools/mode/rhythm-mode-tap-width-input-check.js
          node tools/mode/rhythm-mode-restart-remount-check.js
          node tools/mode/rhythm-judgment-line-first-mount-check.js
          node tools/mode/rhythm-mode-release-timing-check.js
          node tools/mode/rhythm-input-scenario-check.js
          node tools/mode/rhythm-residual-tap-rejudge-check.js
          node tools/mode/rhythm-hand-simulate.js
          node tools/mode/rhythm-canvas-geometry-check.js
          node tools/mode/rhythm-mode-note-se-check.js
          node tools/mode/rhythm-options-step1-check.js
          node tools/mode/rhythm-mode-slide-sublane-check.js
          node tools/mode/rhythm-monster-slots-check.js
          node tools/mode/rhythm-monster-notes-check.js
          node tools/mode/rhythm-chart-authoring-ui-check.js
          node tools/mode/rhythm-invalid-placement-check.js
          node tools/mode/rhythm-review-mode-check.js
          node tools/mode/rhythm-easy-ear-review-ui-check.js
          node tools/mode/rhythm-easy-alignment-audit.js
          node tools/mode/rhythm-easy-formal-candidate-check.js
          node tools/mode/rhythm-easy-v2-review-check.js
          node tools/mode/rhythm-chart-v2-step1-check.js
          node tools/mode/rhythm-chart-v2-step2-check.js
          node tools/mode/rhythm-debug-short-check.js
          node tools/mode/rhythm-easy-ear-review-plan.js
          node tools/mode/rhythm-help-structure-check.js
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Stage the GitHub Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # 配るのは index.html と monster-hero/ だけ。ゲームが読む画像・音は
          # 必ず monster-hero/ の下に置くこと。tools/ から1枚ずつコピーする方式は
          # 書き足し忘れに気づけず、実際にパンドラの染色マスクが本番だけ404になった。
          mkdir _site
          cp index.html _site/
          cp -a monster-hero _site/
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
