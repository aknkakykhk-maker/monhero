name: Build and deploy Pages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # PRの検査とmainの公開を同じ列に並べない。
  # 以前は両方が group: pages を共有し、cancel-in-progress: false だったため、
  # PRへ連続pushするとその検査が全部並び、mainの公開まで順番待ちになっていた。
  #   PR        … ブランチごとに1本。新しくpushしたら古い検査は打ち切ってよい
  #   mainへpush … 常に pages の1本。公開は途中で止めない(Pagesのデプロイを壊さない)
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'pages' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require update banner stamp for shipped changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          shipped="$(printf '%s\n' "$changed" | grep -E '^(monster-hero/|index\.html$)' | grep -v '^monster-hero/version\.json$' || true)"
          if [[ -z "$shipped" ]]; then
            echo "配信対象の変更なし: 更新バナーstampは不要"
            exit 0
          fi
          if ! printf '%s\n' "$changed" | grep -qx 'monster-hero/version.json'; then
            echo "NG: 配信対象を変更したのに monster-hero/version.json が更新されていません"
            echo "デバッグ・内部修正でも node tools/build.js を実行して更新バナー用buildを進めてください"
            exit 1
          fi
          echo "OK: 配信対象の変更に更新バナー用versionが含まれています"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install locked tool dependencies
        working-directory: tools
        run: npm ci --omit=optional
      - name: Apply and verify soul rank STEP5C ranking display (temporary)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin work/soul-rank-system
          git checkout -B work/soul-rank-system origin/work/soul-rank-system
          python - <<'PY'
          from pathlib import Path
          p=Path('monster-hero/src/parts/60-app.jsx')
          s=p.read_text()

          power_line="const powerNote = snapshotPower != null ? null : 'この記録には総合力が残っていないため、いまのデータで計算した参考値です';"
          i=s.find(power_line)
          if i<0:
            raise SystemExit('ranking powerNote not found')
          line_end=s.find('\n',i)
          soul_vars="""
          const rankingSoulStage = normalizeSoulRankStage(masu.soulRankStage);
          const rankingSoulTraitEntries = SOUL_TRAIT_DEFINITIONS.filter(trait=>soulTraitLevel(masu,trait.id)>0)
            .map(trait=>({ trait, level:soulTraitLevel(masu,trait.id), effect:soulTraitEffectValue(masu,trait.id) }));
          const rankingSoulSpentPoints = Number.isFinite(Number(masu.soulSpentPointsSnapshot))
            ? Math.max(0,Math.floor(Number(masu.soulSpentPointsSnapshot)))
            : soulTraitSpentPoints(masu);"""
          s=s[:line_end]+soul_vars+s[line_end:]

          ranking_start=s.find("const rankingSoulStage",i)
          body_start=s.find("          bodyExtra: (",ranking_start)
          footer_start=s.find("          footer:",body_start)
          if body_start<0 or footer_start<0:
            raise SystemExit('ranking bodyExtra bounds not found')
          new_body="""          bodyExtra: (
              <>
                {rankingSoulStage>0&&<section data-ranking-soul-build className="rounded-xl border border-sky-500/40 bg-sky-950/30 p-3">
                  <div className="flex items-center justify-between gap-2">
                    <div className="text-[10px] font-black text-sky-200">魂格{SOUL_RANK_BADGE_LABELS[rankingSoulStage]}</div>
                    <div className="text-[9px] font-black text-amber-200">使用済み魂格P {rankingSoulSpentPoints}</div>
                  </div>
                  <div className="mt-2 space-y-1">
                    {rankingSoulTraitEntries.length>0
                      ? rankingSoulTraitEntries.map(({trait,level,effect})=><div key={trait.id} className="flex items-center justify-between gap-2 text-[9px]"><span className="min-w-0 truncate font-bold text-white">{trait.name} <span className="text-slate-500">Lv.{level}</span></span><span className="shrink-0 font-black text-sky-200">{formatSoulTraitEffect(trait,effect)}</span></div>)
                      : <div className="text-[9px] text-slate-500">魂格特性の振り分けなし</div>}
                  </div>
                </section>}
                <div className="bg-black/40 p-2 rounded-xl border border-violet-500/30">
                  <div className="text-[7px] text-violet-300 uppercase font-bold mb-1">所持固有技Lv</div>
                  {getRebirthSkillChoices(masu).map(skill=>{
                    const current=uniqueSkillAtLevel(skill.unique, skill.level);
                    return <div key={skill.key} className="w-full flex items-center justify-between text-[10px] font-black py-0.5"><span className="text-white truncate">{current?.name||skill.name}</span><span className="text-amber-300 shrink-0">Lv.{skill.level}</span></div>;
                  })}
                </div>
              </>
            ),
          """
          s=s[:body_start]+new_body+s[footer_start:]

          old_icon="""{entry?.imgUrl?<img src={entry.imgUrl} alt="" className="w-7 h-7 object-contain shrink-0"/>:<span className="w-7 text-center shrink-0">{entry?.emoji||'❓'}</span>}<b className="truncate flex-1 text-[10px]">{entry.monName}</b>"""
          new_icon="""<span data-ranking-soul-badge className="relative w-7 h-7 shrink-0 overflow-visible">{entry?.imgUrl?<img src={entry.imgUrl} alt="" className="w-7 h-7 object-contain"/>:<span className="block w-7 text-center">{entry?.emoji||'❓'}</span>}{entry?.detail&&<TranscendenceBadge transcended={entry.detail?.transcended===true} soulRankStage={entry.detail?.soulRankStage} small/>}</span><b className="truncate flex-1 text-[10px]">{entry.monName}</b>"""
          if old_icon not in s:
            raise SystemExit('bond ranking icon anchor not found')
          s=s.replace(old_icon,new_icon,1)

          p.write_text(s)
          PY
          node tools/build.js
          node tools/masu/soul-rank-step5c-check.js
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "build: show soul rank snapshot in rankings"
            git push origin work/soul-rank-system
          fi
      # コミット済みの配信用JSが game-system.jsx の正規ビルドと一致していることを先に確かめる。
      # ここでビルドし直してから確認すると、build.js の実行を忘れたコミットでも必ず通ってしまい、
      # リポジトリの中身と配信物がずれたまま気付けない(実際にそのまま公開された)。
      # 配信するのはリポジトリの中身そのものなので、ずれていたら公開せずに落とす。
      - name: Verify the committed compiled output is canonical
        run: node tools/build.js --check
      - name: Verify the compiled runtime
        run: node tools/compiled-runtime-check.js
      - name: Check source syntax and references
        run: |
          node tools/check-syntax.js
          node tools/undefined-reference-check.js
      - name: Check the boot path
        run: node tools/boot-flow-check.js
      - name: Check the shipped version stamps
        run: node tools/update-notice-check.js
      - name: Check shipped data metadata and rhythm geometry
        run: |
          node tools/boot/data-cache-key-check.js
          node tools/mode/rhythm-mode-note-perspective-check.js
          node tools/mode/rhythm-mode-tap-width-input-check.js
          node tools/mode/rhythm-mode-restart-remount-check.js
          node tools/mode/rhythm-judgment-line-first-mount-check.js
          node tools/mode/rhythm-mode-release-timing-check.js
          node tools/mode/rhythm-input-scenario-check.js
          node tools/mode/rhythm-residual-tap-rejudge-check.js
          node tools/mode/rhythm-hand-simulate.js
          node tools/mode/rhythm-canvas-geometry-check.js
          node tools/mode/rhythm-mode-note-se-check.js
          node tools/mode/rhythm-options-step1-check.js
          node tools/mode/rhythm-mode-slide-sublane-check.js
          node tools/mode/rhythm-monster-slots-check.js
          node tools/mode/rhythm-monster-notes-check.js
          node tools/mode/rhythm-chart-authoring-ui-check.js
          node tools/mode/rhythm-invalid-placement-check.js
          node tools/mode/rhythm-review-mode-check.js
          node tools/mode/rhythm-easy-ear-review-ui-check.js
          node tools/mode/rhythm-easy-alignment-audit.js
          node tools/mode/rhythm-easy-formal-candidate-check.js
          node tools/mode/rhythm-easy-v2-review-check.js
          node tools/mode/rhythm-chart-v2-step1-check.js
          node tools/mode/rhythm-chart-v2-step2-check.js
          node tools/mode/rhythm-debug-short-check.js
          node tools/mode/rhythm-easy-ear-review-plan.js
          node tools/mode/rhythm-help-structure-check.js
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Stage the GitHub Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # 配るのは index.html と monster-hero/ だけ。ゲームが読む画像・音は
          # 必ず monster-hero/ の下に置くこと。tools/ から1枚ずつコピーする方式は
          # 書き足し忘れに気づけず、実際にパンドラの染色マスクが本番だけ404になった。
          mkdir _site
          cp index.html _site/
          cp -a monster-hero _site/
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
