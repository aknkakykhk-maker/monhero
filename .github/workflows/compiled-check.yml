name: Build and deploy Pages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # PRの検査とmainの公開を同じ列に並べない。
  # 以前は両方が group: pages を共有し、cancel-in-progress: false だったため、
  # PRへ連続pushするとその検査が全部並び、mainの公開まで順番待ちになっていた。
  #   PR        … ブランチごとに1本。新しくpushしたら古い検査は打ち切ってよい
  #   mainへpush … 常に pages の1本。公開は途中で止めない(Pagesのデプロイを壊さない)
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'pages' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply soul rank card layout follow-up
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('monster-hero/src/parts/60-app.jsx')
          s = p.read_text()
          old = "{renderMonsterCardBody({masu,base,status:<span className=\"block text-center\"><b className=\"text-[8px] text-sky-200\">{label}</b><small className={'block text-[7px] '+(status.levelReady?'text-emerald-300':'text-slate-500')}>{sub}</small></span>})}"
          new = "{renderMonsterCardBody({masu,base,nameBand:true,status:<span className=\"block text-center\"><b className=\"text-[8px] text-sky-200\">{label}</b><small className={'block text-[7px] '+(status.levelReady?'text-emerald-300':'text-slate-500')}>{sub}</small></span>})}"
          if old in s:
              p.write_text(s.replace(old, new, 1))
              print('魂格進化カードへ通常一覧と同じ名前帯を追加')
          elif new in s:
              print('魂格進化カードはすでに修正済み')
          else:
              raise SystemExit('魂格進化カードの対象箇所を特定できません')
          PY

      - name: Require update banner stamp for shipped changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          shipped="$(printf '%s\n' "$changed" | grep -E '^(monster-hero/|index\.html$)' | grep -v '^monster-hero/version\.json$' || true)"
          if [[ -z "$shipped" ]]; then
            echo "配信対象の変更なし: 更新バナーstampは不要"
            exit 0
          fi
          if ! printf '%s\n' "$changed" | grep -qx 'monster-hero/version.json'; then
            echo "更新バナーstampはビルド後に生成します"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install locked tool dependencies
        working-directory: tools
        run: npm ci --omit=optional

      - name: Build the shipped bundle for the temporary follow-up
        run: node tools/build.js
      - name: Verify the committed compiled output is canonical
        run: node tools/build.js --check
      - name: Verify the compiled runtime
        run: node tools/compiled-runtime-check.js
      - name: Check source syntax and references
        run: |
          node tools/check-syntax.js
          node tools/undefined-reference-check.js
      - name: Check the boot path
        run: node tools/boot-flow-check.js
      - name: Check the shipped version stamps
        run: node tools/update-notice-check.js
      - name: Check shipped data metadata and rhythm geometry
        run: |
          node tools/boot/data-cache-key-check.js
          node tools/mode/rhythm-mode-note-perspective-check.js
          node tools/mode/rhythm-mode-tap-width-input-check.js
          node tools/mode/rhythm-mode-restart-remount-check.js
          node tools/mode/rhythm-judgment-line-first-mount-check.js
          node tools/mode/rhythm-mode-release-timing-check.js
          node tools/mode/rhythm-input-scenario-check.js
          node tools/mode/rhythm-residual-tap-rejudge-check.js
          node tools/mode/rhythm-hand-simulate.js
          node tools/mode/rhythm-canvas-geometry-check.js
          node tools/mode/rhythm-mode-note-se-check.js
          node tools/mode/rhythm-options-step1-check.js
          node tools/mode/rhythm-mode-slide-sublane-check.js
          node tools/mode/rhythm-monster-slots-check.js
          node tools/mode/rhythm-monster-notes-check.js
          node tools/mode/rhythm-chart-authoring-ui-check.js
          node tools/mode/rhythm-invalid-placement-check.js
          node tools/mode/rhythm-review-mode-check.js
          node tools/mode/rhythm-easy-ear-review-ui-check.js
          node tools/mode/rhythm-easy-alignment-audit.js
          node tools/mode/rhythm-easy-formal-candidate-check.js
          node tools/mode/rhythm-easy-v2-review-check.js
          node tools/mode/rhythm-chart-v2-step1-check.js
          node tools/mode/rhythm-chart-v2-step2-check.js
          node tools/mode/rhythm-debug-short-check.js
          node tools/mode/rhythm-easy-ear-review-plan.js
          node tools/mode/rhythm-help-structure-check.js

      - name: Commit soul rank card layout follow-up
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet; then
            echo "差分なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monster-hero/src/parts/60-app.jsx monster-hero/game-system.compiled.js monster-hero/version.json monster-hero/data monster-hero/src/game-system.jsx 2>/dev/null || true
          git add -u
          git commit -m "fix: align soul rank cards with Masumon list"
          git push origin HEAD:${{ github.head_ref }}

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Stage the GitHub Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir _site
          cp index.html _site/
          cp -a monster-hero _site/
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
