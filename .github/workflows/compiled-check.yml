name: Build and deploy Pages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # PRの検査とmainの公開を同じ列に並べない。
  # 以前は両方が group: pages を共有し、cancel-in-progress: false だったため、
  # PRへ連続pushするとその検査が全部並び、mainの公開まで順番待ちになっていた。
  #   PR        … ブランチごとに1本。新しくpushしたら古い検査は打ち切ってよい
  #   mainへpush … 常に pages の1本。公開は途中で止めない(Pagesのデプロイを壊さない)
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'pages' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require update banner stamp for shipped changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          shipped="$(printf '%s\n' "$changed" | grep -E '^(monster-hero/|index\.html$)' | grep -v '^monster-hero/version\.json$' || true)"
          if [[ -z "$shipped" ]]; then
            echo "配信対象の変更なし: 更新バナーstampは不要"
            exit 0
          fi
          if ! printf '%s\n' "$changed" | grep -qx 'monster-hero/version.json'; then
            echo "NG: 配信対象を変更したのに monster-hero/version.json が更新されていません"
            echo "デバッグ・内部修正でも node tools/build.js を実行して更新バナー用buildを進めてください"
            exit 1
          fi
          echo "OK: 配信対象の変更に更新バナー用versionが含まれています"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install locked tool dependencies
        working-directory: tools
        run: npm ci --omit=optional
      - name: Apply unique-skill common charge regression fix
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.head.ref }}"
          git checkout -B "${{ github.event.pull_request.head.ref }}" "origin/${{ github.event.pull_request.head.ref }}"
          python3 - <<'PY'
          from pathlib import Path

          src = Path('monster-hero/src/parts/60-app.jsx')
          text = src.read_text()
          replacements = [
              (
                  "setAttackAnim({slotIndex: animSlot, charge:true, ...((motion==='waterBurst'||motion==='arkHolyRain')?{motion}: {})});",
                  "setAttackAnim({slotIndex: animSlot, charge:true});",
              ),
              (
                  "setMonsterImageDebugMotionPlaying({charge:true, ...((atkMotion==='waterBurst'||atkMotion==='arkHolyRain')?{motion:atkMotion}: {})});",
                  "setMonsterImageDebugMotionPlaying({charge:true});",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one source match, got {count}: {old}')
              text = text.replace(old, new, 1)
          src.write_text(text)

          test = Path('tools/monster/snegurochka-check.js')
          text = test.read_text()
          anchor = "  ['水攻撃は距離枠を動かさず本体だけ横移動',"
          regression = """  ['固有技の共通タメは専用モーションより先に下沈みを行う', game.includes('setAttackAnim({slotIndex: animSlot, charge:true});')\n    && !game.includes(\"setAttackAnim({slotIndex: animSlot, charge:true, ...((motion==='waterBurst'||motion==='arkHolyRain')?{motion}: {})});\")\n    && game.includes('setMonsterImageDebugMotionPlaying({charge:true});')\n    && !game.includes(\"setMonsterImageDebugMotionPlaying({charge:true, ...((atkMotion==='waterBurst'||atkMotion==='arkHolyRain')?{motion:atkMotion}: {})});\")\n    && game.includes('setAttackAnim({slotIndex: animSlot, charge:false, motion, twinBlade:isKenshiTwin, sakura:')],\n"""
          if regression.strip() in text:
              raise SystemExit('regression assertion already present')
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one test anchor, got {text.count(anchor)}')
          test.write_text(text.replace(anchor, regression + anchor, 1))
          PY
          git fetch --no-tags --depth=1 origin main
          git checkout origin/main -- .github/workflows/compiled-check.yml .github/workflows/build-and-check.yml
          node tools/build.js
          node tools/monster/snegurochka-check.js
          node tools/monster/lineage-dex-check.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: 固有技の共通タメを専用モーション前に復旧"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      # コミット済みの配信用JSが game-system.jsx の正規ビルドと一致していることを先に確かめる。
      # ここでビルドし直してから確認すると、build.js の実行を忘れたコミットでも必ず通ってしまい、
      # リポジトリの中身と配信物がずれたまま気付けない(実際にそのまま公開された)。
      # 配信するのはリポジトリの中身そのものなので、ずれていたら公開せずに落とす。
      - name: Verify the committed compiled output is canonical
        run: node tools/build.js --check
      - name: Verify the compiled runtime
        run: node tools/compiled-runtime-check.js
      - name: Check source syntax and references
        run: |
          node tools/check-syntax.js
          node tools/undefined-reference-check.js
      - name: Check the boot path
        run: node tools/boot-flow-check.js
      - name: Check the shipped version stamps
        run: node tools/update-notice-check.js
      - name: Check shipped data metadata and rhythm geometry
        run: |
          node tools/boot/data-cache-key-check.js
          node tools/mode/rhythm-mode-note-perspective-check.js
          node tools/mode/rhythm-mode-tap-width-input-check.js
          node tools/mode/rhythm-mode-restart-remount-check.js
          node tools/mode/rhythm-judgment-line-first-mount-check.js
          node tools/mode/rhythm-mode-release-timing-check.js
          node tools/mode/rhythm-input-scenario-check.js
          node tools/mode/rhythm-residual-tap-rejudge-check.js
          node tools/mode/rhythm-hand-simulate.js
          node tools/mode/rhythm-canvas-geometry-check.js
          node tools/mode/rhythm-mode-note-se-check.js
          node tools/mode/rhythm-options-step1-check.js
          node tools/mode/rhythm-mode-slide-sublane-check.js
          node tools/mode/rhythm-monster-slots-check.js
          node tools/mode/rhythm-monster-notes-check.js
          node tools/mode/rhythm-chart-authoring-ui-check.js
          node tools/mode/rhythm-invalid-placement-check.js
          node tools/mode/rhythm-review-mode-check.js
          node tools/mode/rhythm-easy-ear-review-ui-check.js
          node tools/mode/rhythm-easy-alignment-audit.js
          node tools/mode/rhythm-easy-formal-candidate-check.js
          node tools/mode/rhythm-easy-v2-review-check.js
          node tools/mode/rhythm-chart-v2-step1-check.js
          node tools/mode/rhythm-chart-v2-step2-check.js
          node tools/mode/rhythm-debug-short-check.js
          node tools/mode/rhythm-easy-ear-review-plan.js
          node tools/mode/rhythm-help-structure-check.js
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Stage the GitHub Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # 配るのは index.html と monster-hero/ だけ。ゲームが読む画像・音は
          # 必ず monster-hero/ の下に置くこと。tools/ から1枚ずつコピーする方式は
          # 書き足し忘れに気づけず、実際にパンドラの染色マスクが本番だけ404になった。
          mkdir _site
          cp index.html _site/
          cp -a monster-hero _site/
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
