name: Build and deploy Pages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # PRの検査とmainの公開を同じ列に並べない。
  # 以前は両方が group: pages を共有し、cancel-in-progress: false だったため、
  # PRへ連続pushするとその検査が全部並び、mainの公開まで順番待ちになっていた。
  #   PR        … ブランチごとに1本。新しくpushしたら古い検査は打ち切ってよい
  #   mainへpush … 常に pages の1本。公開は途中で止めない(Pagesのデプロイを壊さない)
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'pages' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install locked tool dependencies
        working-directory: tools
        run: npm ci --omit=optional
      # コミット済みの配信用JSが game-system.jsx の正規ビルドと一致していることを先に確かめる。
      # ここでビルドし直してから確認すると、build.js の実行を忘れたコミットでも必ず通ってしまい、
      # リポジトリの中身と配信物がずれたまま気付けない(実際にそのまま公開された)。
      # 配信するのはリポジトリの中身そのものなので、ずれていたら公開せずに落とす。
      - name: Verify the committed compiled output is canonical
        run: node tools/build.js --check
      - name: Verify the compiled runtime
        run: node tools/compiled-runtime-check.js
      - name: Check source syntax and references
        run: |
          node tools/check-syntax.js
          node tools/undefined-reference-check.js
      - name: Check the boot path
        run: node tools/boot-flow-check.js
      - name: Check the shipped version stamps
        run: node tools/update-notice-check.js
      - name: Check shipped data metadata and rhythm geometry
        run: |
          node tools/boot/data-cache-key-check.js
          node tools/mode/rhythm-mode-note-perspective-check.js
          node tools/mode/rhythm-mode-tap-width-input-check.js
          node tools/mode/rhythm-mode-restart-remount-check.js
          node tools/mode/rhythm-mode-release-timing-check.js
          node tools/mode/rhythm-mode-note-se-check.js
          node tools/mode/rhythm-mode-slide-sublane-check.js
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Stage the GitHub Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # 配るのは index.html と monster-hero/ だけ。ゲームが読む画像・音は
          # 必ず monster-hero/ の下に置くこと。tools/ から1枚ずつコピーする方式は
          # 書き足し忘れに気づけず、実際にパンドラの染色マスクが本番だけ404になった。
          mkdir _site
          cp index.html _site/
          cp -a monster-hero _site/
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
