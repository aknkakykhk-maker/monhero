name: Temporary ChatGPT direct enhance input v3

on:
  push:
    branches:
      - chatgpt/direct-enhance-point-input-20260830

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install locked dependencies
        working-directory: tools
        run: npm ci --omit=optional
      - name: Install Chromium for browser checks
        working-directory: tools
        run: |
          npx playwright install --with-deps chromium
          CHROME_PATH=$(node -e "const { chromium }=require('playwright'); process.stdout.write(chromium.executablePath())")
          sudo mkdir -p /opt/pw-browsers
          sudo ln -sf "$CHROME_PATH" /opt/pw-browsers/chromium
      - name: Fix temporary patch script quoting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/tmp-direct-enhance-input-patch.cjs')
          s = p.read_text()
          old = '''check('従来の1P/5P/10P/MAXと長押しを残す', source.includes("{[1,5,10,'MAX'].map") && source.includes('PressRepeatButton aria-label={`${label}を増やす`}') && source.includes('PressRepeatButton aria-label={`${label}の基礎値を上げる`}'));'''
          new = '''check('従来の1P/5P/10P/MAXと長押しを残す', source.includes("{[1,5,10,'MAX'].map") && source.includes('PressRepeatButton') && source.includes('bulkEnhanceUnit') && source.includes('transcendBulkUnit'));'''
          if old not in s:
              raise SystemExit('quote fix target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Apply requested change
        run: node tools/tmp-direct-enhance-input-patch.cjs
      - name: Stabilize focused browser setup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/masu/bulk-enhance-check.js')
          s = p.read_text()
          marker = "    localStorage.setItem('mh_masu_migrated', JSON.stringify(true));\n"
          extra = "    // この検査と無関係な一度きりのお詫びポップアップは確認済みにして、強化操作を覆わせない。\n    localStorage.setItem('mh_inherited_unique_level_compensation_v1', JSON.stringify(true));\n"
          if 'mh_inherited_unique_level_compensation_v1' not in s:
              if marker not in s:
                  raise SystemExit('bulk enhance test seed target not found')
              s = s.replace(marker, marker + extra, 1)
              p.write_text(s)
          PY
      - name: Build canonical output
        run: node tools/build.js
      - name: Run mandatory checks
        run: |
          node tools/check-syntax.js
          node tools/undefined-reference-check.js
          node tools/jsx-text-brace-check.js
          node tools/render-error-check.js
          node tools/build.js --check
      - name: Run static focused checks
        run: |
          node tools/masu/direct-enhance-input-check.js
          node tools/masu/transcendence-check.js
          node tools/help-coverage-check.js
          node tools/help-guide-check.js
          node tools/help-render-check.js
      - name: Run browser focused checks
        run: |
          python3 tools/serve.py >/tmp/monhero-serve.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node tools/masu/bulk-enhance-check.js
          node tools/masu/masu-enhance-layer-check.js
      - name: Check diff
        run: git diff --check
      - name: Commit implementation and remove temporary runners
        run: |
          rm -f tools/tmp-direct-enhance-input-patch.cjs .github/workflows/tmp-chatgpt-direct-input.yml .github/workflows/tmp-chatgpt-direct-input-v2.yml .github/workflows/tmp-chatgpt-direct-input-v3.yml
          git add -A
          git diff --cached --check
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          git commit -m "feat: 強化ポイントの数値直接入力を追加"
          git push origin HEAD:chatgpt/direct-enhance-point-input-20260830
