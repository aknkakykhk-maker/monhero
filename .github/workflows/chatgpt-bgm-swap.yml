name: ChatGPT BGM default swap

on:
  push:
    branches:
      - chatgpt/swap-quick-extreme-bgm-defaults

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install tools
        working-directory: tools
        run: npm ci --omit=optional
      - name: Apply BGM swap
        run: python tools/apply-quick-extreme-bgm-swap.py
      - name: Build and focused checks
        run: |
          node tools/build.js
          node tools/build.js --check
          node tools/audio/bgm-arrangement-check.js
          node tools/check-syntax.js
          node tools/undefined-reference-check.js
          node tools/update-notice-check.js
          node tools/help/help-coverage-check.js
          node tools/help/help-guide-check.js
          git diff --check
      - name: Commit result and remove one-off files
        run: |
          git rm .github/workflows/chatgpt-bgm-swap.yml tools/apply-quick-extreme-bgm-swap.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monster-hero/src/game-system.jsx monster-hero/game-system.compiled.js monster-hero/data/help.js monster-hero/data/changelog.js monster-hero/version.json tools/audio/bgm-arrangement-check.js
          git commit -m "feat: swap Quick and Extreme default BGM"
          git push
