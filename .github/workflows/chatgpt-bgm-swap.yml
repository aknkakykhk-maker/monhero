name: ChatGPT BGM default swap

on:
  push:
    branches: [chatgpt/swap-quick-extreme-bgm-defaults]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install tools
        working-directory: tools
        run: npm ci --omit=optional
      - name: Apply narrowly-scoped BGM default swap
        shell: python
        run: |
          from pathlib import Path
          stamp = '2026-08-29 13:28'

          src_path = Path('monster-hero/src/game-system.jsx')
          s = src_path.read_text()

          old_defaults = """  quickBattle: 'ichika_battle',
            quickDullahan: 'melo_dullahan_clockwork',
            quickMoo: 'ichika_boss',
            proBattle: 'original_pro_battle_01',
            proDullahan: 'melo_dullahan_steel_ghost',
            proMoo: 'original_pro_battle_02',
            extremeBattle: 'original_battle',
            extremeDullahan: 'original_dullahan',
            extremeMoo: 'original_boss',"""
          new_defaults = """  quickBattle: 'original_battle',
            quickDullahan: 'original_dullahan',
            quickMoo: 'original_boss',
            proBattle: 'original_pro_battle_01',
            proDullahan: 'melo_dullahan_steel_ghost',
            proMoo: 'original_pro_battle_02',
            extremeBattle: 'ichika_battle',
            extremeDullahan: 'melo_dullahan_clockwork',
            extremeMoo: 'ichika_boss',"""
          assert s.count(old_defaults) == 1, 'DEFAULT_BGM_ARRANGEMENT block mismatch'
          s = s.replace(old_defaults, new_defaults, 1)

          anchor = "const migrateDullahanBgmDefaults = arrangement => migrateBgmDefaults(arrangement, BGM_DULLAHAN_PREVIOUS_DEFAULTS);"
          addition = """const migrateDullahanBgmDefaults = arrangement => migrateBgmDefaults(arrangement, BGM_DULLAHAN_PREVIOUS_DEFAULTS);
          // クイックと極限の既定曲を入れ替えたときの、一度きりの移行。
          // 以前の既定のままの枠だけを新しい既定へ移し、自分で選んだ曲は残す。
          const BGM_QUICK_EXTREME_DEFAULT_MIGRATION_KEY = 'mh_bgm_quick_extreme_default_migrated_v1';
          const BGM_QUICK_EXTREME_PREVIOUS_DEFAULTS = Object.freeze({
            quickBattle: 'ichika_battle',
            quickDullahan: 'melo_dullahan_clockwork',
            quickMoo: 'ichika_boss',
            extremeBattle: 'original_battle',
            extremeDullahan: 'original_dullahan',
            extremeMoo: 'original_boss'
          });
          const migrateQuickExtremeBgmDefaults = arrangement => migrateBgmDefaults(arrangement, BGM_QUICK_EXTREME_PREVIOUS_DEFAULTS);"""
          assert s.count(anchor) == 1, 'migration declaration anchor mismatch'
          s = s.replace(anchor, addition, 1)

          load_anchor = """      if ((await storeGet(BGM_DULLAHAN_DEFAULT_MIGRATION_KEY, false, false)) !== true) {
                const dullahanMigration = migrateDullahanBgmDefaults(savedBgmArrangement);
                if (dullahanMigration.changed) savedBgmArrangement = dullahanMigration.arrangement;
                try {
                  await storeSet(BGM_DULLAHAN_DEFAULT_MIGRATION_KEY, true, false);
                } catch {}
              }
              setBgmArrangement(savedBgmArrangement);"""
          load_replacement = """      if ((await storeGet(BGM_DULLAHAN_DEFAULT_MIGRATION_KEY, false, false)) !== true) {
                const dullahanMigration = migrateDullahanBgmDefaults(savedBgmArrangement);
                if (dullahanMigration.changed) savedBgmArrangement = dullahanMigration.arrangement;
                try {
                  await storeSet(BGM_DULLAHAN_DEFAULT_MIGRATION_KEY, true, false);
                } catch {}
              }
              if ((await storeGet(BGM_QUICK_EXTREME_DEFAULT_MIGRATION_KEY, false, false)) !== true) {
                const quickExtremeMigration = migrateQuickExtremeBgmDefaults(savedBgmArrangement);
                if (quickExtremeMigration.changed) savedBgmArrangement = quickExtremeMigration.arrangement;
                try {
                  await storeSet(BGM_QUICK_EXTREME_DEFAULT_MIGRATION_KEY, true, false);
                } catch {}
              }
              setBgmArrangement(savedBgmArrangement);"""
          if load_anchor in s:
              s = s.replace(load_anchor, load_replacement, 1)
          else:
              compact_anchor = """      if (await storeGet(BGM_DULLAHAN_DEFAULT_MIGRATION_KEY, false, false) !== true) {
                const dullahanMigration = migrateDullahanBgmDefaults(savedBgmArrangement);
                if (dullahanMigration.changed) savedBgmArrangement = dullahanMigration.arrangement;
                try { await storeSet(BGM_DULLAHAN_DEFAULT_MIGRATION_KEY, true, false); } catch {}
              }
              setBgmArrangement(savedBgmArrangement);"""
              compact_replacement = """      if (await storeGet(BGM_DULLAHAN_DEFAULT_MIGRATION_KEY, false, false) !== true) {
                const dullahanMigration = migrateDullahanBgmDefaults(savedBgmArrangement);
                if (dullahanMigration.changed) savedBgmArrangement = dullahanMigration.arrangement;
                try { await storeSet(BGM_DULLAHAN_DEFAULT_MIGRATION_KEY, true, false); } catch {}
              }
              if (await storeGet(BGM_QUICK_EXTREME_DEFAULT_MIGRATION_KEY, false, false) !== true) {
                const quickExtremeMigration = migrateQuickExtremeBgmDefaults(savedBgmArrangement);
                if (quickExtremeMigration.changed) savedBgmArrangement = quickExtremeMigration.arrangement;
                try { await storeSet(BGM_QUICK_EXTREME_DEFAULT_MIGRATION_KEY, true, false); } catch {}
              }
              setBgmArrangement(savedBgmArrangement);"""
              assert s.count(compact_anchor) == 1, 'startup migration anchor mismatch'
              s = s.replace(compact_anchor, compact_replacement, 1)

          import re
          s, n = re.subn(r'const BUILD_DATE = "[^"]+";', f'const BUILD_DATE = "{stamp}";', s, count=1)
          assert n == 1, 'BUILD_DATE mismatch'
          src_path.write_text(s)

          help_path = Path('monster-hero/data/help.js')
          h = help_path.read_text()
          old_help = 'モードごとに最初から入っている曲は次のとおりです。チャレンジと極限チャレンジは通常戦・デュラハン戦・ムー戦ともオリジナルの3曲。クイックは通常戦が「バトルテーマ by いちか」、デュラハン戦が「呪われた騎士の時計仕掛け」、ムー戦が「ボステーマ by いちか」。プロは通常戦が「プロ戦闘BGM 1」、デュラハン戦が「鋼鉄の亡霊」、ムー戦が「プロ戦闘BGM 2」です。'
          new_help = 'モードごとに最初から入っている曲は次のとおりです。チャレンジとクイックは通常戦・デュラハン戦・ムー戦ともオリジナルの3曲。極限チャレンジは通常戦が「バトルテーマ by いちか」、デュラハン戦が「呪われた騎士の時計仕掛け」、ムー戦が「ボステーマ by いちか」。プロは通常戦が「プロ戦闘BGM 1」、デュラハン戦が「鋼鉄の亡霊」、ムー戦が「プロ戦闘BGM 2」です。'
          assert h.count(old_help) == 1, 'help text mismatch'
          help_path.write_text(h.replace(old_help, new_help, 1))

          changelog_path = Path('monster-hero/data/changelog.js')
          c = changelog_path.read_text()
          entry = f'''  {{\n    date: "{stamp}", type: 'update', title: 'クイックと極限チャレンジの初期BGMを入れ替えました', status: 'new',\n    items: [\n      'クイックモードは通常戦・デュラハン戦・ムー戦ともオリジナルの3曲、極限チャレンジは「バトルテーマ by いちか」「呪われた騎士の時計仕掛け」「ボステーマ by いちか」が最初の設定になりました。',\n      '以前の初期設定のまま使っていた枠だけ新しい初期設定へ切り替わります。BGMアレンジで自分で選んでいた曲は変更しません。',\n    ],\n  }},\n'''
          marker = 'const CHANGELOG = [\n'
          assert c.count(marker) == 1
          changelog_path.write_text(c.replace(marker, marker + entry, 1))

          Path('monster-hero/version.json').write_text('{"build": "' + stamp + '"}\n')

          check_path = Path('tools/audio/bgm-arrangement-check.js')
          t = check_path.read_text()
          t = t.replace('// チャレンジと極限はオリジナル3曲のまま(極限に専用曲は用意していないので、チャレンジと同じ)', '// チャレンジ・クイック・種族はオリジナル3曲。極限は旧クイックの3曲')
          old_assert = """  check(`${file}: チャレンジ・極限・種族の既定曲がオリジナル3曲のまま`,
            defaults.battle === 'original_battle' && defaults.dullahan === 'original_dullahan' && defaults.boss === 'original_boss' &&
            defaults.extremeBattle === 'original_battle' && defaults.extremeDullahan === 'original_dullahan' && defaults.extremeMoo === 'original_boss' &&
            defaults.speciesBattle === 'original_battle' && defaults.speciesDullahan === 'original_dullahan' && defaults.speciesMoo === 'original_boss');"""
          new_assert = """  check(`${file}: チャレンジ・クイック・種族の既定曲がオリジナル3曲`,
            defaults.battle === 'original_battle' && defaults.dullahan === 'original_dullahan' && defaults.boss === 'original_boss' &&
            defaults.quickBattle === 'original_battle' && defaults.quickDullahan === 'original_dullahan' && defaults.quickMoo === 'original_boss' &&
            defaults.speciesBattle === 'original_battle' && defaults.speciesDullahan === 'original_dullahan' && defaults.speciesMoo === 'original_boss');"""
          assert t.count(old_assert) == 1, 'first BGM assertion mismatch'
          t = t.replace(old_assert, new_assert, 1)
          old_quick = """  // クイックはいちか2曲＋デュラハン専用曲。ムー戦はオリジナルではなく「ボステーマ by いちか」
            check(`${file}: クイックの既定曲が いちか通常／時計仕掛け／いちかボス`,
              defaults.quickBattle === 'ichika_battle' &&
              defaults.quickDullahan === 'melo_dullahan_clockwork' &&
              defaults.quickMoo === 'ichika_boss');"""
          new_quick = """  check(`${file}: 極限の既定曲が いちか通常／時計仕掛け／いちかボス`,
              defaults.extremeBattle === 'ichika_battle' &&
              defaults.extremeDullahan === 'melo_dullahan_clockwork' &&
              defaults.extremeMoo === 'ichika_boss');"""
          assert t.count(old_quick) == 1, 'quick assertion mismatch'
          t = t.replace(old_quick, new_quick, 1)
          mig_anchor = "  // 追加した4曲。既定に使う2曲と、既定では使わないが選べる2曲\n"
          mig_check = """  check(`${file}: クイック・極限の既定入れ替えは一度きりで、自分で選んだ曲を上書きしない`,
            /mh_bgm_quick_extreme_default_migrated_v1/.test(source) &&
            /BGM_QUICK_EXTREME_PREVIOUS_DEFAULTS/.test(source) &&
            /migrateQuickExtremeBgmDefaults/.test(source));
          """
          assert t.count(mig_anchor) == 1, 'migration check anchor mismatch'
          t = t.replace(mig_anchor, mig_check + mig_anchor, 1)
          check_path.write_text(t)
      - name: Build and focused checks
        run: |
          node tools/build.js
          node tools/build.js --check
          node tools/audio/bgm-arrangement-check.js
          node tools/check-syntax.js
          node tools/undefined-reference-check.js
          node tools/update-notice-check.js
          node tools/help/help-coverage-check.js
          node tools/help/help-guide-check.js
          git diff --check
      - name: Remove one-off workflow and commit result
        run: |
          git rm .github/workflows/chatgpt-bgm-swap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monster-hero/src/game-system.jsx monster-hero/game-system.compiled.js monster-hero/data/help.js monster-hero/data/changelog.js monster-hero/version.json tools/audio/bgm-arrangement-check.js
          git commit -m "feat: swap Quick and Extreme default BGM"
          git push
