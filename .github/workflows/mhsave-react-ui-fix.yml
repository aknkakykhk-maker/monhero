name: Temporary mhsave React UI fix

on:
  push:
    branches:
      - chatgpt/mhsave-react-ui-fix-final
    paths:
      - .github/workflows/mhsave-react-ui-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/mhsave-react-ui-fix-final
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install locked tool dependencies
        working-directory: tools
        run: npm ci --omit=optional
      - name: Patch React backup UI and rebuild
        run: |
          node <<'NODE'
          const fs=require('fs');
          const sourcePath='monster-hero/src/game-system.jsx';
          const releasePath='monster-hero/data/rhythm-step3-release.js';
          const versionPath='monster-hero/version.json';
          const build='2026-09-01 07:10';

          let src=fs.readFileSync(sourcePath,'utf8');
          src=src.replace(/const BUILD_DATE = "[^"]+";/, `const BUILD_DATE = "${build}";`);

          if(!src.includes('const saveBackupFile = async () => {')){
            const marker='\n\n  // 編成の1枠(monsterRosterIdsの要素)を、実際に使えるモンスターオブジェクトに変換する。';
            if(!src.includes(marker)) throw new Error('backup helper insertion marker not found');
            const helpers=`

  const buildBackupCodeForFile = () => {
    if (!hasLocalStorage()) return '';
    const data = {};
    for (let i = 0; i < window.localStorage.length; i++) {
      const k = window.localStorage.key(i);
      if (k && k.startsWith('mh_')) data[k] = window.localStorage.getItem(k);
    }
    if (!Object.keys(data).length) return '';
    return btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  };
  const backupFileStamp = () => {
    const d = new Date();
    const pad = v => String(v).padStart(2, '0');
    return \\`${'${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}'}\\`;
  };
  const saveBackupFile = async () => {
    setRestoreMsg('');
    try {
      const code = buildBackupCodeForFile();
      if (!code) { setRestoreMsg('バックアップファイルを作成できませんでした'); return; }
      const filename = \\`monster-hero-backup-${'${backupFileStamp()}'}.mhsave\\`;
      const blob = new Blob([code], { type:'application/octet-stream' });
      if (typeof File !== 'undefined' && navigator.share && navigator.canShare) {
        try {
          const file = new File([blob], filename, { type:'application/octet-stream' });
          if (navigator.canShare({ files:[file] })) {
            setRestoreMsg('共有メニューから「ファイルに保存」を選んでください');
            await navigator.share({ files:[file], title:'Monster Hero バックアップ' });
            setRestoreMsg('バックアップファイルを保存・共有しました');
            return;
          }
        } catch (e) {
          if (e && e.name === 'AbortError') { setRestoreMsg('保存をキャンセルしました'); return; }
        }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      setRestoreMsg('バックアップファイルを保存しました');
    } catch { setRestoreMsg('バックアップファイルを保存できませんでした'); }
  };
  const restoreFromBackupFile = () => {
    setRestoreMsg('');
    try {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.mhsave,text/plain,application/octet-stream';
      input.onchange = async () => {
        const file = input.files && input.files[0];
        if (!file) return;
        if (file.size > 20 * 1024 * 1024) { setRestoreMsg('バックアップファイルが大きすぎます'); return; }
        try {
          const text = (await file.text()).trim();
          const json = decodeURIComponent(escape(atob(text)));
          const data = JSON.parse(json);
          if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('invalid');
          const keys = Object.keys(data).filter(k => k.startsWith('mh_'));
          if (!keys.length) throw new Error('no-save-keys');
          keys.forEach(k => window.localStorage.setItem(k, data[k]));
          setRestoreMsg('復元しました。再読み込みします...');
          setTimeout(() => window.location.reload(), 900);
        } catch { setRestoreMsg('バックアップファイルが正しくありません'); }
      };
      input.click();
    } catch { setRestoreMsg('バックアップファイルを開けませんでした'); }
  };`;
            src=src.replace(marker,helpers+marker);
          }

          const oldUi=`{backupTab==='export'?<>{backupCode&&<textarea readOnly value={backupCode}/>}<button className="mh-dialog-choice" onClick={generateBackupCode}>バックアップコードを作成</button></>:<><textarea value={restoreInput} onChange={e=>setRestoreInput(e.target.value)} placeholder="バックアップコードを貼り付け"/><button className="mh-dialog-choice" onClick={restoreFromBackupCode}>このコードで復元する</button></>}`;
          const newUi=`{backupTab==='export'?<><button data-mhsave-action="export" className="mh-dialog-choice" onClick={saveBackupFile}>バックアップファイルを保存（.mhsave）</button>{backupCode&&<textarea readOnly value={backupCode}/>}<button className="mh-dialog-choice" onClick={generateBackupCode}>バックアップコードを作成</button></>:<><button data-mhsave-action="import" className="mh-dialog-choice" onClick={restoreFromBackupFile}>バックアップファイルから復元（.mhsave）</button><textarea value={restoreInput} onChange={e=>setRestoreInput(e.target.value)} placeholder="バックアップコードを貼り付け"/><button className="mh-dialog-choice" onClick={restoreFromBackupCode}>このコードで復元する</button></>}`;
          if(!src.includes(oldUi) && !src.includes('onClick={saveBackupFile}>バックアップファイルを保存（.mhsave）')) throw new Error('backup UI target not found');
          src=src.replace(oldUi,newUi);
          if(!src.includes('onClick={saveBackupFile}>バックアップファイルを保存（.mhsave）')) throw new Error('native export button missing after patch');
          if(!src.includes('onClick={restoreFromBackupFile}>バックアップファイルから復元（.mhsave）')) throw new Error('native import button missing after patch');
          fs.writeFileSync(sourcePath,src);

          let release=fs.readFileSync(releasePath,'utf8');
          release=release.replace(/const RHYTHM_RELEASE_DATE='[^']+';/,`const RHYTHM_RELEASE_DATE='${build}';`);
          release=release.replace(/const RHYTHM_DATA_BUILD='[^']+';/,`const RHYTHM_DATA_BUILD='${build}';`);
          release=release.replace(/const RHYTHM_COMPILED_BUILD='[^']+';/,`const RHYTHM_COMPILED_BUILD='${build}';`);
          release=release.replace(/const RHYTHM_RELEASE_TITLE='[^']+';/,"const RHYTHM_RELEASE_TITLE='バックアップファイル保存を本体UIへ統合';");
          release=release.replace(/items:\[\s*'[^']*',\s*'[^']*'\s*\]/,`items:[\n        'データ引き継ぎ画面のReact本体へ「バックアップファイルを保存（.mhsave）」と「バックアップファイルから復元（.mhsave）」を直接追加しました。',\n        'iPhoneでは共有メニューから「ファイルに保存」を選べます。従来の引き継ぎコード方式と既存のmh_*セーブデータ形式もそのまま維持しています。'\n      ]`);
          fs.writeFileSync(releasePath,release);
          fs.writeFileSync(versionPath,JSON.stringify({build})+'\n');
          NODE
          node tools/build.js
          node tools/build.js --check
          node tools/compiled-runtime-check.js
          node tools/check-syntax.js
          node tools/undefined-reference-check.js
          node tools/boot-flow-check.js
          node tools/update-notice-check.js
          node tools/boot/data-cache-key-check.js
          node tools/mode/rhythm-mode-note-perspective-check.js
          node tools/mode/rhythm-mode-restart-remount-check.js
          node tools/mode/rhythm-mode-release-timing-check.js
          node tools/mode/rhythm-mode-note-se-check.js
          node tools/mode/rhythm-mode-slide-sublane-check.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monster-hero/src/game-system.jsx monster-hero/game-system.compiled.js monster-hero/index.html monster-hero/data/rhythm-step3-release.js monster-hero/version.json
          git commit -m "fix: integrate mhsave controls into backup React UI"
          git push origin HEAD:chatgpt/mhsave-react-ui-fix-final
