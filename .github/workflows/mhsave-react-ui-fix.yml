name: Temporary mhsave React UI fix

on:
  push:
    branches:
      - chatgpt/mhsave-react-ui-fix-final
    paths:
      - .github/workflows/mhsave-react-ui-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/mhsave-react-ui-fix-final
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install locked tool dependencies
        working-directory: tools
        run: npm ci --omit=optional
      - name: Patch, build and verify
        run: |
          node tools/mhsave-react-ui-fix-temp.js
          node tools/build.js
          node tools/build.js --check
          node tools/compiled-runtime-check.js
          node tools/check-syntax.js
          node tools/undefined-reference-check.js
          node tools/boot-flow-check.js
          node tools/update-notice-check.js
          node tools/boot/data-cache-key-check.js
          node tools/mode/rhythm-mode-note-perspective-check.js
          node tools/mode/rhythm-mode-restart-remount-check.js
          node tools/mode/rhythm-mode-release-timing-check.js
          node tools/mode/rhythm-mode-note-se-check.js
          node tools/mode/rhythm-mode-slide-sublane-check.js
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monster-hero/src/game-system.jsx monster-hero/game-system.compiled.js monster-hero/index.html monster-hero/data/rhythm-step3-release.js monster-hero/version.json
          git commit -m "fix: integrate mhsave controls into backup React UI"
          git push origin HEAD:chatgpt/mhsave-react-ui-fix-final
