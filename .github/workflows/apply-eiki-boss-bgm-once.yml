name: Apply Eiki boss BGM once
on:
  push:
    branches:
      - chatgpt/eiki-boss-bgm
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/eiki-boss-bgm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install locked tool dependencies
        working-directory: tools
        run: npm ci --omit=optional
      - name: Apply patch
        run: python tools/eiki-boss-bgm-patch.py
      - name: Build
        run: node tools/build.js
      - name: Checks
        run: |
          node tools/audio/eiki-boss-bgm-check.js
          node tools/audio/pandora-boss-bgm-check.js
          node tools/audio/bgm-arrangement-check.js
          node tools/check-syntax.js
          node tools/undefined-reference-check.js
          node tools/help-coverage-check.js
          node tools/help-guide-check.js
          node tools/help-render-check.js
          node tools/update-notice-check.js
          node tools/build.js --check
          git diff --check
      - name: Remove temporary files
        run: rm -f tools/eiki-boss-bgm-patch.py .github/workflows/apply-eiki-boss-bgm-once.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Eiki final boss BGM"
          git push origin HEAD:chatgpt/eiki-boss-bgm
