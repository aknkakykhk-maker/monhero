name: rename-battle5-audio (temporary)

on:
  push:
    branches: [claude/battle5-song-add-v2]

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/battle5-song-add-v2
      - name: Rename audio files to correct names
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f monster-hero/audio/monster-hero_audio_bgm-battle-5.mp3 ] && [ -f monster-hero/audio/monster-hero_audio_bgm-battle-5-short.mp3 ]; then
            if [ -f monster-hero/audio/bgm-battle-5.mp3 ]; then
              git rm -q monster-hero/audio/bgm-battle-5.mp3
            fi
            git mv monster-hero/audio/monster-hero_audio_bgm-battle-5.mp3 monster-hero/audio/bgm-battle-5.mp3
            git mv monster-hero/audio/monster-hero_audio_bgm-battle-5-short.mp3 monster-hero/audio/bgm-battle-5-short.mp3
            git status --short
            git commit -m "ファイル名を修正: bgm-battle-5.mp3 / bgm-battle-5-short.mp3"
            git push
          else
            echo "Already renamed; nothing to do."
          fi
