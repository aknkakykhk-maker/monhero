name: ChatGPT one-time rhythm touch expand review fix

on:
  push:
    branches:
      - chatgpt/rhythm-touch-expand

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/rhythm-touch-expand
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install locked tool dependencies
        working-directory: tools
        run: npm ci --omit=optional
      - name: Avoid empty input group on center-only movement
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('monster-hero/data/rhythm-mode.js')
          s=p.read_text()
          old="if(isStart||centerChanged||stabilized.centerMoved||entered.length)actions.push({id,touch,next,entered:isStart?next.subLanes:entered});"
          new="if(isStart||centerChanged||entered.length)actions.push({id,touch,next,entered:isStart?next.subLanes:entered});"
          if s.count(old)!=1: raise SystemExit('action condition target not unique')
          p.write_text(s.replace(old,new))
          t=Path('tools/mode/rhythm-mode-tap-width-input-check.js')
          x=t.read_text()
          anchor="assert.strictEqual(realMove.centerMoved,true,'明確な横移動は従来どおり追従');\n"
          insert=anchor+"assert(source.includes('if(isStart||centerChanged||entered.length)actions.push')&&!source.includes('centerChanged||stabilized.centerMoved||entered.length'),'中心だけ動いて新規ラインなしの時は空入力グループを作らない');\n"
          if x.count(anchor)!=1: raise SystemExit('test anchor not unique')
          t.write_text(x.replace(anchor,insert))
          PY
      - name: Run focused rhythm input check
        run: node tools/mode/rhythm-mode-tap-width-input-check.js
      - name: Run canonical build and stamp update banner
        run: node tools/build.js
      - name: Verify changelog stayed untouched
        run: git diff --exit-code -- monster-hero/data/changelog.js
      - name: Re-run focused rhythm input check
        run: node tools/mode/rhythm-mode-tap-width-input-check.js
      - name: Commit review fix
        env:
          HEAD_BRANCH: chatgpt/rhythm-touch-expand
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: avoid empty touch movement input"
          git push origin "HEAD:${HEAD_BRANCH}"
