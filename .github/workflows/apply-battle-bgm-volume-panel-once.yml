name: Apply battle BGM volume panel
on:
  push:
    branches: [chatgpt/battle-bgm-volume-panel]
    paths:
      - tools/audio/apply-battle-bgm-volume-panel.js
      - .github/workflows/apply-battle-bgm-volume-panel-once.yml
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[battle-bgm-volume-panel-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/battle-bgm-volume-panel
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install locked tool dependencies
        run: cd tools && npm ci --omit=optional
      - name: Apply UI change
        run: node tools/audio/apply-battle-bgm-volume-panel.js
      - name: Update changelog and help
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const cp='monster-hero/data/changelog.js';
          let c=fs.readFileSync(cp,'utf8');
          const marker='const CHANGELOG = [';
          const entry=`\n  {\n    date: \"2026-08-30 09:40\", type: 'update', title: 'AUTO BGM操作を使いやすくしました', status: 'new',\n    items: [\n      'バトル上部のミュートボタンをなくし、WAVE・モード・TURN・SCOREを表示する領域を広げました。',\n      'AUTO中のBGMボタンを開くと、曲選択と同じパネル内でBGM音量も調整できるようにしました。',\n      '「BGMなし」と超省エネ中のSE OFF仕様はそのまま維持します。',\n    ],\n  },`;
          if(!c.includes('AUTO BGM操作を使いやすくしました')) c=c.replace(marker,marker+entry);
          fs.writeFileSync(cp,c);
          const hp='monster-hero/data/help.js';
          let h=fs.readFileSync(hp,'utf8');
          h=h.replace('AUTO中はバトル画面の🎵ボタンから、そのAUTOセッションだけ別の登録曲へ変更でき、「BGMなし」も選べます。','AUTO中はバトル画面の🎵ボタン（下部）から、そのAUTOセッションだけ別の登録曲へ変更でき、「BGMなし」も選べます。🎵ボタン内ではBGM音量も調整できます。');
          fs.writeFileSync(hp,h);
          NODE
      - name: Build
        run: node tools/build.js
      - name: Checks
        run: |
          node tools/audio/auto-bgm-runtime-picker-check.js
          node tools/audio/auto-bgm-loop-continuity-check.js
          node tools/audio/auto-ultra-bgm-check.js
          node tools/check-syntax.js
          node tools/undefined-reference-check.js
          node tools/help-coverage-check.js
          node tools/help-guide-check.js
          node tools/help-render-check.js
          node tools/update-notice-check.js
          node tools/build.js --check
          git diff --check
      - name: Remove one-shot files
        run: rm -f tools/audio/apply-battle-bgm-volume-panel.js .github/workflows/apply-battle-bgm-volume-panel-once.yml
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add BGM volume control to AUTO picker [battle-bgm-volume-panel-applied]"
          git push origin HEAD:chatgpt/battle-bgm-volume-panel
