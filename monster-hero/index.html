  /* 音ゲー STEP B: 入力面や判定ロジックは触らず、data属性だけでステージに奥行きを付ける。 */
  [data-rhythm-tap-test] {
    background:
      radial-gradient(ellipse at 50% -8%,rgba(192,132,252,.20),transparent 35%),
      linear-gradient(180deg,#06091a 0%,#04050d 48%,#02030a 100%) !important;
  }
  /* HUDには背景パネルを一切持たせない。以前ここで
     background:linear-gradient(...) + backdrop-filter:blur() + box-shadow で
     画面上部に不透明な帯を敷いており、台形の頂点(消失点)と上部の背景を覆っていた。
     実機で「中央上部に黒い帯が残っていてレーンが上まで見えない」と指摘されたため撤去した
     (2026-09-03)。JSX側は元から背景を持っていないので、ここに足さないことが条件になる。
     文字の視認性はJSX側の text-shadow だけで確保する。 */
  [data-rhythm-score],[data-rhythm-combo] {
    text-shadow:0 0 14px rgba(103,232,249,.22),0 0 26px rgba(217,70,239,.14);
  }
  [data-rhythm-play-area] {
    isolation:isolate;
    margin-left:0 !important;
    margin-right:0 !important;
    margin-bottom:0 !important;
    border-left:0 !important;
    border-right:0 !important;
    background:
      radial-gradient(ellipse at 50% 4%,rgba(217,70,239,.18),transparent 28%),
      radial-gradient(ellipse at 50% 92%,rgba(34,211,238,.12),transparent 34%),
      linear-gradient(180deg,#050817 0%,#070718 42%,#03040b 100%);
    /* 上端側のinset影は消失点付近を暗く塗り潰してしまうため外した(2026-09-03)。
       下端側だけ残して判定ライン付近の落ち着きを保つ。 */
    box-shadow:inset 0 -42px 80px rgba(2,6,23,.68);
  }
  [data-rhythm-play-area]::before {
    content:"";
    position:absolute;
    inset:0;
    z-index:0;
    pointer-events:none;
    clip-path:polygon(27% 0,73% 0,100% 100%,0 100%);
    background:
      repeating-linear-gradient(180deg,transparent 0 59px,rgba(103,232,249,.075) 60px 61px),
      linear-gradient(90deg,rgba(2,6,23,.84) 0%,rgba(15,23,42,.14) 20%,rgba(88,28,135,.08) 50%,rgba(15,23,42,.14) 80%,rgba(2,6,23,.84) 100%);
    opacity:.96;
    filter:drop-shadow(0 0 24px rgba(103,232,249,.08));
  }
  [data-rhythm-play-area]::after {
    content:"";
    position:absolute;
    top:-2%;
    left:19%;
    right:19%;
    height:18%;
    z-index:0;
    pointer-events:none;
    background:radial-gradient(ellipse at center,rgba(232,121,249,.20),rgba(34,211,238,.08) 34%,transparent 72%);
    filter:blur(12px);
    opacity:.78;
  }
  [data-rhythm-play-area] > div:first-child {
    inset:0 !important;
    z-index:1;
  }
  [data-rhythm-lane] {
    position:absolute;
    inset:0;
    border-right-color:rgba(226,232,240,.15) !important;
    background:
      linear-gradient(180deg,rgba(15,23,42,.02),rgba(15,23,42,.12) 52%,rgba(8,47,73,.18) 100%) !important;
    box-shadow:inset 1px 0 rgba(103,232,249,.035),inset -1px 0 rgba(217,70,239,.025);
    filter:drop-shadow(1px 0 rgba(226,232,240,.20));
  }
  [data-rhythm-lane]:last-child { border-right-color:transparent !important; }
  [data-rhythm-lane]::before {
    content:"";
    position:absolute;
    inset:0 24%;
    pointer-events:none;
    background:linear-gradient(180deg,transparent 10%,rgba(255,255,255,.018) 62%,rgba(103,232,249,.09) 100%);
    opacity:.8;
  }
  [data-rhythm-lane]::after {
    content:"";
    position:absolute;
    left:12%;
    right:12%;
    bottom:8.5%;
    height:9%;
    border-radius:50%;
    pointer-events:none;
    background:radial-gradient(ellipse at center,rgba(207,250,254,.78) 0%,rgba(34,211,238,.36) 30%,rgba(217,70,239,.18) 53%,transparent 74%);
    opacity:.07;
    filter:blur(4px);

  }
  [data-rhythm-lane][data-pressed="true"]::after {
    opacity:.95;

  [data-rhythm-lane] > span {

  [data-rhythm-judgment-line] {
    z-index:6;

    box-shadow:0 0 11px rgba(236,254,255,.92),0 0 25px rgba(34,211,238,.68),0 0 42px rgba(217,70,239,.30) !important;
  }
  [data-rhythm-judgment-line]::before {
    content:"";
    position:absolute;
    left:0;

    pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(34,211,238,.05) 16%,rgba(255,255,255,.13) 50%,rgba(217,70,239,.05) 84%,transparent);
    filter:blur(5px);
  }
  /* スコアランクのゲージ(2026-09-04)。ただ1色で伸びるだけの帯だと「ゲージ」に見えないという
     指摘があったため、目盛りの筋を足して段を上っていく見た目にした。ランクは難易度によって
     届く段数が違う(EASYは6段、MASTERは10段)ため、目盛りの数は難易度に合わせず一定(4等分)に
     している。正確にどこまで来ているかは、右に添えた「→次のランク」の文字が伝える。
     見た目だけの背景画像なので、判定・スコア・ゲージの伸び自体には関与しない。 */
  [data-rhythm-rank-gauge]{
    background-image:linear-gradient(90deg,
      transparent 24.5%,rgba(2,6,23,.55) 24.5%,rgba(2,6,23,.55) 25.5%,transparent 25.5%,
      transparent 49.5%,rgba(2,6,23,.55) 49.5%,rgba(2,6,23,.55) 50.5%,transparent 50.5%,
      transparent 74.5%,rgba(2,6,23,.55) 74.5%,rgba(2,6,23,.55) 75.5%,transparent 75.5%);
  }
  /* コンボ数の強調(2026-09-03)。数字が小さくて手応えが伝わらないという指摘があったため、
     大きくしたうえで100・200・300コンボの段階で色と光り方を変える。
     色はノーツの色(ピンク/シアン/紫/オレンジ)とぶつからないよう、白→金→虹寄りに寄せる。 */
  [data-rhythm-combo]{
    text-shadow:0 1px 6px rgba(2,6,23,.96);
    transition:color .18s ease, text-shadow .18s ease;
  }
  [data-rhythm-combo][data-combo-tier="1"]{color:#fde68a;text-shadow:0 1px 6px rgba(2,6,23,.96),0 0 12px rgba(251,191,36,.85)}
  [data-rhythm-combo][data-combo-tier="2"]{color:#fcd34d;text-shadow:0 1px 6px rgba(2,6,23,.96),0 0 14px rgba(245,158,11,.95),0 0 24px rgba(249,115,22,.6)}
  [data-rhythm-combo][data-combo-tier="3"]{color:#fff;text-shadow:0 1px 6px rgba(2,6,23,.96),0 0 12px #fff,0 0 22px #f0abfc,0 0 34px #38bdf8}

  /* 100コンボごとのお祝い。1.1秒で消える一度きりの表示で、DOMもそのあいだだけ置く。
     判定・スコア・ノーツの動きには一切関与しない。
     data-milestone-stage(1〜5)は100/200/300/400/500以上に対応し、段が上がるほど
     色を熱く・リングを増やし・最後は虹色にして「どんどん派手になる」ようにする(2026-09-04)。 */
  [data-rhythm-combo-milestone]{
    position:relative;
    animation:mhRhythmComboBurst 1.1s cubic-bezier(.2,.9,.25,1) forwards;
    will-change:transform,opacity;
  }
  [data-rhythm-combo-milestone] b{
    position:relative;
    background:linear-gradient(180deg,#fff 0%,#fde68a 45%,#fb923c 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 6px rgba(2,6,23,.9)) drop-shadow(0 0 16px rgba(251,191,36,.75));
  }
  [data-rhythm-combo-milestone] small{position:relative;color:#fde68a;text-shadow:0 1px 5px rgba(2,6,23,.95),0 0 12px rgba(251,191,36,.7)}
  /* stage2(200): 一段熱い色にして光を強める。
     注意: ここを`background`のショートハンドで書くと、background-clipも初期値(border-box)へ
     暗黙にリセットされ、上のベース規則のbackground-clip:textが打ち消されて文字が透明のまま
     見えなくなる(200コンボ以降の演出が表示されないバグの原因だった)。
     グラデーションの絵だけを差し替えたいので、ロングハンドのbackground-imageを使う。 */
  [data-rhythm-combo-milestone][data-milestone-stage="2"] b{
    background-image:linear-gradient(180deg,#fff 0%,#fcd34d 40%,#f97316 100%);
    filter:drop-shadow(0 2px 6px rgba(2,6,23,.9)) drop-shadow(0 0 20px rgba(249,115,22,.88));
  }
  /* stage3(300)以上: 白熱色にして、外周へ広がるリングを1本追加 */
  [data-rhythm-combo-milestone][data-milestone-stage="3"] b,
  [data-rhythm-combo-milestone][data-milestone-stage="4"] b{
    background-image:linear-gradient(180deg,#fff 0%,#fef3c7 32%,#fb7185 68%,#38bdf8 100%);
    filter:drop-shadow(0 2px 6px rgba(2,6,23,.9)) drop-shadow(0 0 22px rgba(255,255,255,.88));
  }
  [data-rhythm-combo-milestone][data-milestone-stage="3"]::before,
  [data-rhythm-combo-milestone][data-milestone-stage="4"]::before,
  [data-rhythm-combo-milestone][data-milestone-stage="5"]::before{
    content:"";
    position:absolute;
    left:50%;top:38%;
    width:1px;height:1px;
    margin:0;
    border-radius:9999px;
    border:3px solid rgba(255,255,255,.85);
    transform:translate(-50%,-50%);
    animation:mhRhythmComboRing 1.1s cubic-bezier(.15,.7,.3,1) forwards;
    pointer-events:none;
  }
  /* stage4(400)以上: リングをもう1本重ねる */
  [data-rhythm-combo-milestone][data-milestone-stage="4"]::after,
  [data-rhythm-combo-milestone][data-milestone-stage="5"]::after{
    content:"";
    position:absolute;
    left:50%;top:38%;
    width:1px;height:1px;
    margin:0;
    border-radius:9999px;
    border:3px solid rgba(251,191,36,.85);
    transform:translate(-50%,-50%);
    animation:mhRhythmComboRing 1.1s .12s cubic-bezier(.15,.7,.3,1) forwards;
    pointer-events:none;
  }
  /* stage5(500以上): 最大の演出。文字を虹色に流す(同じ理由でbackground-imageを使う) */
  [data-rhythm-combo-milestone][data-milestone-stage="5"] b{
    background-image:linear-gradient(90deg,#f87171,#fbbf24,#a3e635,#22d3ee,#a78bfa,#f472b6,#f87171);
    background-size:300% 100%;
    animation:mhRhythmComboRainbow 1.1s linear forwards;
    filter:drop-shadow(0 2px 6px rgba(2,6,23,.9)) drop-shadow(0 0 26px rgba(255,255,255,.92));
  }
  @keyframes mhRhythmComboBurst{
    0%{opacity:0;transform:translateX(-50%) scale(.6)}
    18%{opacity:1;transform:translateX(-50%) scale(1.12)}
    32%{transform:translateX(-50%) scale(1)}
    72%{opacity:1;transform:translateX(-50%) scale(1) translateY(0)}
    100%{opacity:0;transform:translateX(-50%) scale(1.02) translateY(-18px)}
  }
  @keyframes mhRhythmComboRing{
    0%{width:1px;height:1px;opacity:.9}
    70%{opacity:.22}
    100%{width:320px;height:320px;opacity:0}
  }
  @keyframes mhRhythmComboRainbow{
    0%{background-position:0% 50%}
    100%{background-position:200% 50%}
  }
  /* 端末の設定で動きを減らしている人には動かさず、表示だけ出す */
  @media (prefers-reduced-motion:reduce){
    [data-rhythm-combo-milestone]{animation:none;opacity:1}
    [data-rhythm-combo-milestone]::before,[data-rhythm-combo-milestone]::after{animation:none;opacity:0}
  }

  /* リザルトの称号。フルコンボしたことが伝わらないという指摘があったため大きく祝う。 */
  [data-rhythm-result-celebrate] b{
    background:linear-gradient(180deg,#fff 0%,#fde68a 40%,#fb923c 78%,#f0abfc 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 6px rgba(2,6,23,.9)) drop-shadow(0 0 18px rgba(251,191,36,.7));
    animation:mhRhythmCelebrate 1.6s ease-in-out infinite alternate;
  }
  @keyframes mhRhythmCelebrate{from{transform:scale(1)}to{transform:scale(1.045)}}
  @media (prefers-reduced-motion:reduce){[data-rhythm-result-celebrate] b{animation:none}}

  /* フルコンボ等を達成して曲を終えたときの、リザルトへ行く前の掛け声代わりの演出画面
     (2026-09-04)。声の音声ファイルは用意していないため、大きな文字の"スラムイン"と
     合成音(rhythmPlayFullCombo)で代える。1.3秒で自動的にリザルトへ進む(タップでも進む)。 */
  [data-rhythm-celebrate] { animation:mhRhythmCelebrateFadeIn .25s ease-out both; }
  [data-rhythm-celebrate-slam]{
    position:relative;
    background:linear-gradient(180deg,#fff 0%,#fde68a 35%,#fb923c 70%,#f0abfc 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 10px rgba(2,6,23,.9)) drop-shadow(0 0 26px rgba(251,191,36,.85));
    animation:mhRhythmCelebrateSlam .6s cubic-bezier(.2,1.4,.4,1) both;
  }
  [data-rhythm-celebrate-slam]::before,[data-rhythm-celebrate-slam]::after{
    content:"";
    position:absolute;
    left:50%;top:50%;
    width:1px;height:1px;
    border-radius:9999px;
    border:3px solid rgba(255,255,255,.8);
    transform:translate(-50%,-50%);
    animation:mhRhythmComboRing 1s .15s cubic-bezier(.15,.7,.3,1) both;
    pointer-events:none;
  }
  [data-rhythm-celebrate-slam]::after{border-color:rgba(251,191,36,.8);animation-delay:.32s}
  @keyframes mhRhythmCelebrateFadeIn{from{opacity:0}to{opacity:1}}
  @keyframes mhRhythmCelebrateSlam{
    0%{opacity:0;transform:scale(2.1) rotate(-4deg)}
    55%{opacity:1;transform:scale(.94) rotate(1deg)}
    75%{transform:scale(1.04) rotate(0deg)}
    100%{opacity:1;transform:scale(1) rotate(0deg)}
  }
  @media (prefers-reduced-motion:reduce){
    [data-rhythm-celebrate]{animation:none}
    [data-rhythm-celebrate-slam]{animation:none;opacity:1}
    [data-rhythm-celebrate-slam]::before,[data-rhythm-celebrate-slam]::after{animation:none;opacity:0}
  }

  [data-rhythm-judgment-display] { z-index:8 !important; }
  [data-rhythm-note] {
    z-index:5;
    filter:drop-shadow(0 0 6px rgba(255,255,255,.20)) drop-shadow(0 0 10px rgba(217,70,239,.18));
  }
  [data-rhythm-note] > span:last-child {
    inset:4px 0 !important;
    border:1px solid rgba(255,255,255,.72);
    border-radius:5px !important;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.58),0 0 12px rgba(217,70,239,.32) !important;
  }
  [data-rhythm-note][data-note-type="HOLD"] > span:last-child {
    border-color:rgba(207,250,254,.86);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.72),0 0 13px rgba(34,211,238,.42) !important;
  }
  /* FLICKは他のどのノーツとも被らない緑にする(2026-09-03)。
     シアン→オレンジと変えてきたが、オレンジはモンスターノーツの金色の光(#fde047)と
     色相が25度しか離れておらず「似ていて紛らわしい」という指摘があった。
     ノーツの色は TAP=ピンク(330°) / モンスター=金(50°) / HOLD=シアン(188°) / SLIDE=紫(271°)。
     この4色がいちばん大きく空けているのが 50°〜188° の間で、その真ん中あたりの緑(142°)を選んだ。
     いちばん近い色との距離が 25° → 46° へ広がり、どの色とも見分けやすくなる。
     背景の暗い青にも埋もれない明るさにしてある。
     rhythm-mode.js が後から入れる旧ピンクCSSより高い詳細度にして、判定・入力は触らず見た目だけを上書きする。 */
  [data-rhythm-note][data-note-type="FLICK"][data-note-type="FLICK"] > span:last-child {
    background:linear-gradient(180deg,#f0fdf4 0%,#86efac 34%,#22c55e 62%,#15803d 100%) !important;
    border-color:rgba(220,252,231,.98) !important;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 0 10px rgba(34,197,94,.92),0 0 18px rgba(21,128,61,.62) !important;
  }
  [data-rhythm-note][data-note-type="FLICK"][data-note-type="FLICK"] > span:last-child::before {
    content:"";
    position:absolute;
    left:24%;
    right:24%;
    bottom:68%;
    height:30px;
    border-radius:999px;
    pointer-events:none;
    background:linear-gradient(180deg,transparent 0%,rgba(34,197,94,.10) 24%,rgba(134,239,172,.54) 100%);
    filter:blur(1.5px);
  }
  [data-rhythm-note][data-note-type="FLICK"][data-note-type="FLICK"] > span:last-child::after {
    content:"⇧" !important;
    position:absolute;
    left:50%;
    top:-27px;
    transform:translateX(-50%);
    color:#f0fdf4 !important;
    font-size:22px;
    font-weight:1000;
    line-height:1;
    text-shadow:0 0 5px #fff,0 0 10px #22c55e,0 0 16px #15803d !important;
    pointer-events:none;

<script>
(function(){
  // game-system.compiled.js は tools/build.js が game-system.jsx から生成した変換済みJS。
  // 以前はここで @babel/standalone を読み込み、game-system.jsx を毎回取得しなおして
  // ブラウザ上で変換していたが、それが読み込みの重さの主因だったため事前変換に切り替えた。
  // モバイル回線やブラウザキャッシュの一時的な不整合で本体JSだけ取得に失敗しても、
  // 直ちにエラー画面へ進めず、キャッシュを使わないURLで自動的に再取得する。
  // 2回とも失敗した場合だけエラーを表示する。
  var GAME_BUILD = '202609051542';
  var attempts = 0;
  function showLoadError(){
    window.__mhErr && window.__mhErr('game-system.compiled.js load failed after retry');
    var l = document.getElementById('loading');
    if (l) l.innerHTML = '<div style="color:#f88;padding:16px;text-align:center;font-weight:900">読み込みに失敗しました<br>通信環境を確認して再読み込みしてください</div>';
  }
  function loadGame(){
    attempts++;
    window.__mhBoot.say('ゲーム本体を読み込み中');
    var script = document.createElement('script');
    script.src = 'game-system.compiled.js?v=' + GAME_BUILD + (attempts > 1 ? '&retry=' + Date.now() : '');
    script.onload = function(){
      if (typeof MonsterHeroGame === 'undefined') {
        if (attempts < 2) loadGame(); else showLoadError();
        return;
      }
      window.__mhBoot.done('game-system.compiled.js', 'ゲーム本体を組み立て中');
    };
    script.onerror = function(){
      script.remove();
      if (attempts < 2) loadGame(); else { window.__mhBoot.fail('game-system.compiled.js'); showLoadError(); }
    };
    document.body.appendChild(script);
  }
  loadGame();
})();
</script>
