<script>
window.__mhErr = function(msg){ try{ console.error(msg); }catch(_){} };
window.addEventListener('error', function(ev){ window.__mhErr('[error] ' + (ev.message||'') + ' @ ' + (ev.filename||'') + ':' + (ev.lineno||'')); });
window.addEventListener('unhandledrejection', function(ev){ window.__mhErr('[promise] ' + (ev.reason && ev.reason.message ? ev.reason.message : ev.reason)); });
</script>
<!-- React本体はCDNから毎回取りに行かず、リポジトリに同梱したものを読む。
     外部への往復が2回減り、CDNが不調でもゲームが起動しなくなることがなくなる
     (差し替えは tools/ で npm install react@18 react-dom@18 して umd/ からコピーする) -->
<script src="vendor/react.production.min.js?v=18"></script>

<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { margin:0; padding:0; background:#000; overscroll-behavior:none; -webkit-tap-highlight-color:transparent; height:100%; }
  body { height:100dvh; box-sizing:border-box; padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }
  #root { width:100%; height:100%; overflow:hidden; }
  #root > div { width:100%; height:100%; max-width:600px; margin:0 auto; }
  #loading { position:fixed; inset:0; z-index:99999; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden; box-sizing:border-box; padding:calc(12px + env(safe-area-inset-top)) 24px calc(16px + env(safe-area-inset-bottom)); color:#fff; text-align:center; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif; background:radial-gradient(circle at 50% 35%,#34205c 0,#100c29 38%,#040511 76%); }
  #loading::before { content:""; position:absolute; inset:0; background-image:radial-gradient(circle,#e9d5ff 0 1px,transparent 1.5px); background-size:39px 41px; opacity:.28; }
  .static-mocchi { position:relative; z-index:1; width:min(42vw,180px); height:min(42vw,180px); margin-bottom:clamp(8px,3vh,24px); }
  .static-mocchi img { width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 8px 14px #000); transform-origin:50% 88%; animation:staticHop 1.2s ease-in-out infinite; }
  .static-mocchi span { position:absolute; left:20%; bottom:-5px; width:60%; height:13px; border-radius:50%; background:#0008; filter:blur(3px); animation:staticShadow 1.2s ease-in-out infinite; }
  .static-copy { position:relative; z-index:1; width:min(100%,340px); }
  .static-copy h1 { margin:0 0 8px; color:#fff; font-size:clamp(20px,6vw,30px); font-weight:1000; letter-spacing:.22em; text-shadow:0 0 18px #c084fc; }
  .static-copy h2 { margin:0 0 18px; color:#ddd6fe; font-size:12px; letter-spacing:.12em; }
  .static-progress { height:10px; overflow:hidden; border:1px solid #c4b5fd88; border-radius:99px; background:#080617; }
  .static-progress span { display:block; width:8%; height:100%; border-radius:inherit; background:linear-gradient(90deg,#7c3aed,#d8b4fe,#fbbf24); box-shadow:0 0 14px #c084fc; animation:staticProgress 1.5s ease-in-out infinite alternate; }
  .static-copy strong { display:block; margin-top:7px; font:800 11px monospace; }.static-copy p{font-size:10px;color:#c4b5fd}
  @keyframes staticHop { 0%,100%{transform:translateY(0) scale(1.05,.95)}45%{transform:translateY(-14px) rotate(-2deg) scale(.98,1.02)}70%{transform:translateY(0) scale(1.08,.9)} }
  @keyframes staticShadow { 0%,100%{transform:scaleX(1);opacity:.6}45%{transform:scaleX(.65);opacity:.3} }
  @keyframes staticProgress { to{width:28%} }
  @media(prefers-reduced-motion:reduce){.static-mocchi img,.static-mocchi span,.static-progress span{animation:none}}
</style>

<script>
(function(){
  // game-system.compiled.js は tools/build.js が game-system.jsx から生成した変換済みJS。
  // 以前はここで @babel/standalone を読み込み、game-system.jsx を毎回取得しなおして
  // ブラウザ上で変換していたが、それが読み込みの重さの主因だったため事前変換に切り替えた。
  // モバイル回線やブラウザキャッシュの一時的な不整合で本体JSだけ取得に失敗しても、
  // 直ちにエラー画面へ進めず、キャッシュを使わないURLで自動的に再取得する。
  // 2回とも失敗した場合だけエラーを表示する。
  var GAME_BUILD = '202608022303';
  var attempts = 0;
  function showLoadError(){
    window.__mhErr && window.__mhErr('game-system.compiled.js load failed after retry');
    var l = document.getElementById('loading');
    if (l) l.innerHTML = '<div style="color:#f88;padding:16px;text-align:center;font-weight:900">読み込みに失敗しました<br>通信環境を確認して再読み込みしてください</div>';
  }
  function loadGame(){
    attempts++;
    var script = document.createElement('script');
    script.src = 'game-system.compiled.js?v=' + GAME_BUILD + (attempts > 1 ? '&retry=' + Date.now() : '');
    script.onload = function(){
      if (typeof MonsterHeroGame === 'undefined') {
        if (attempts < 2) loadGame(); else showLoadError();
      }
    };
    script.onerror = function(){
      script.remove();
      if (attempts < 2) loadGame(); else showLoadError();
    };
    document.body.appendChild(script);
  }
  loadGame();
})();
</script>
</body>
