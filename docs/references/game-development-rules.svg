<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1700" viewBox="0 0 1200 1700" role="img" aria-labelledby="title desc">
  <title id="title">モンスターヒーロー ゲーム制作のルール</title>
  <desc id="desc">企画から公開までの制作フロー、常に守る原則、品質チェック、完了条件をまとめた日本語の図。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0b1f35"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#31e6a1"/>
      <stop offset="1" stop-color="#2fb6ff"/>
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#102d45"/>
      <stop offset="1" stop-color="#0d2439"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <style>
      .jp{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
      .white{fill:#f5fbff}.muted{fill:#a8bfd2}.mint{fill:#55efb2}.cyan{fill:#63cfff}.amber{fill:#ffd36b}
      .panel{fill:#0b2035;stroke:#26445d;stroke-width:2}.step{fill:url(#step);stroke:#2b526d;stroke-width:2}
      .label{font-size:20px;font-weight:800;letter-spacing:.08em}.body{font-size:21px;font-weight:600}.small{font-size:17px;font-weight:600}
      .line{stroke:#3d7695;stroke-width:4;stroke-linecap:round}.check{fill:none;stroke:#55efb2;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1200" height="1700" fill="url(#bg)"/>
  <circle cx="1050" cy="120" r="270" fill="#1cc8a5" opacity=".08"/>
  <circle cx="110" cy="1110" r="300" fill="#2597ff" opacity=".06"/>

  <!-- Header -->
  <g class="jp">
    <rect x="55" y="55" width="1090" height="210" rx="32" fill="#0d263e" stroke="#2a5874" stroke-width="2" filter="url(#shadow)"/>
    <rect x="82" y="84" width="12" height="150" rx="6" fill="url(#hero)"/>
    <text x="125" y="128" class="mint label">MONSTER HERO • DEVELOPMENT GUIDE</text>
    <text x="125" y="187" class="white" font-size="48" font-weight="900">ゲーム制作のルール</text>
    <text x="125" y="225" class="muted body">「遊べる」だけで終わらせず、安心して公開できる品質へ。</text>
    <g transform="translate(1015 158)">
      <path d="M0-51 44-26v52L0 51-44 26v-52Z" fill="none" stroke="#55efb2" stroke-width="6"/>
      <path d="m-20 3 13 13L22-16" class="check"/>
    </g>

    <!-- Left principles -->
    <g filter="url(#shadow)"><rect x="55" y="305" width="310" height="745" rx="28" class="panel"/></g>
    <text x="90" y="355" class="cyan label">常に守る 6 原則</text>
    <line x1="90" y1="375" x2="330" y2="375" stroke="#2e607d" stroke-width="2"/>
    <g class="body white">
      <g transform="translate(90 425)"><circle cx="13" cy="-7" r="13" fill="#55efb2"/><text x="13" y="0" text-anchor="middle" fill="#082035" font-size="16" font-weight="900">1</text><text x="42" y="0">目的を一文で決める</text><text x="42" y="31" class="muted small">誰に、どんな面白さを届けるか</text></g>
      <g transform="translate(90 520)"><circle cx="13" cy="-7" r="13" fill="#55efb2"/><text x="13" y="0" text-anchor="middle" fill="#082035" font-size="16" font-weight="900">2</text><text x="42" y="0">変更は小さく分ける</text><text x="42" y="31" class="muted small">一度に一つの体験だけを改善</text></g>
      <g transform="translate(90 615)"><circle cx="13" cy="-7" r="13" fill="#55efb2"/><text x="13" y="0" text-anchor="middle" fill="#082035" font-size="16" font-weight="900">3</text><text x="42" y="0">遊んでから決める</text><text x="42" y="31" class="muted small">感覚とデータの両方で判断</text></g>
      <g transform="translate(90 710)"><circle cx="13" cy="-7" r="13" fill="#55efb2"/><text x="13" y="0" text-anchor="middle" fill="#082035" font-size="16" font-weight="900">4</text><text x="42" y="0">既存データを守る</text><text x="42" y="31" class="muted small">セーブ互換性を必ず確認</text></g>
      <g transform="translate(90 805)"><circle cx="13" cy="-7" r="13" fill="#55efb2"/><text x="13" y="0" text-anchor="middle" fill="#082035" font-size="16" font-weight="900">5</text><text x="42" y="0">失敗を見える化する</text><text x="42" y="31" class="muted small">エラーを隠さず、再現手順を残す</text></g>
      <g transform="translate(90 900)"><circle cx="13" cy="-7" r="13" fill="#55efb2"/><text x="13" y="0" text-anchor="middle" fill="#082035" font-size="16" font-weight="900">6</text><text x="42" y="0">公開前に自分で遊ぶ</text><text x="42" y="31" class="muted small">最初から最後まで通して確認</text></g>
    </g>
    <rect x="82" y="963" width="256" height="58" rx="16" fill="#15364b"/>
    <text x="210" y="999" text-anchor="middle" class="amber small">迷ったら「面白さ」を優先</text>

    <!-- Main flow -->
    <text x="405" y="340" class="mint label">制作フロー</text>
    <g class="step" filter="url(#shadow)"><rect x="395" y="365" width="500" height="125" rx="24"/></g>
    <circle cx="445" cy="428" r="30" fill="#163d50" stroke="#55efb2" stroke-width="2"/>
    <text x="445" y="438" text-anchor="middle" class="mint" font-size="28" font-weight="900">01</text>
    <text x="495" y="413" class="white" font-size="25" font-weight="900">企画する</text>
    <text x="495" y="450" class="muted small">遊びの核・対象・完了条件を決める</text>
    <path d="M645 491v27m-10-10 10 10 10-10" class="line" fill="none"/>

    <g class="step" filter="url(#shadow)"><rect x="395" y="520" width="500" height="125" rx="24"/></g>
    <circle cx="445" cy="583" r="30" fill="#163d50" stroke="#55efb2" stroke-width="2"/>
    <text x="445" y="593" text-anchor="middle" class="mint" font-size="28" font-weight="900">02</text>
    <text x="495" y="568" class="white" font-size="25" font-weight="900">試作する</text>
    <text x="495" y="605" class="muted small">最小構成で触れる形にする</text>
    <path d="M645 646v27m-10-10 10 10 10-10" class="line" fill="none"/>

    <g class="step" filter="url(#shadow)"><rect x="395" y="675" width="500" height="125" rx="24"/></g>
    <circle cx="445" cy="738" r="30" fill="#163d50" stroke="#55efb2" stroke-width="2"/>
    <text x="445" y="748" text-anchor="middle" class="mint" font-size="28" font-weight="900">03</text>
    <text x="495" y="723" class="white" font-size="25" font-weight="900">実装する</text>
    <text x="495" y="760" class="muted small">既存機能を壊さず、小さく組み込む</text>
    <path d="M645 801v27m-10-10 10 10 10-10" class="line" fill="none"/>

    <g class="step" filter="url(#shadow)"><rect x="395" y="830" width="500" height="125" rx="24"/></g>
    <circle cx="445" cy="893" r="30" fill="#163d50" stroke="#55efb2" stroke-width="2"/>
    <text x="445" y="903" text-anchor="middle" class="mint" font-size="28" font-weight="900">04</text>
    <text x="495" y="878" class="white" font-size="25" font-weight="900">検証する</text>
    <text x="495" y="915" class="muted small">操作・表示・バランス・保存を確認</text>
    <path d="M645 956v27m-10-10 10 10 10-10" class="line" fill="none"/>

    <g filter="url(#shadow)"><path d="M645 985 735 1042 645 1099 555 1042Z" fill="#18364a" stroke="#f3bd55" stroke-width="3"/></g>
    <text x="645" y="1036" text-anchor="middle" class="amber" font-size="20" font-weight="900">問題なし？</text>
    <text x="645" y="1063" text-anchor="middle" class="muted" font-size="15">NO → 修正して再検証</text>
    <path d="M735 1042h44v-346h-74" fill="none" stroke="#f3bd55" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"/>
    <path d="m716 687-11 9 11 9" fill="none" stroke="#f3bd55" stroke-width="3"/>
    <path d="M645 1100v38m-10-10 10 10 10-10" class="line" fill="none"/>

    <g class="step" filter="url(#shadow)"><rect x="395" y="1140" width="500" height="125" rx="24"/></g>
    <circle cx="445" cy="1203" r="30" fill="#163d50" stroke="#55efb2" stroke-width="2"/>
    <text x="445" y="1213" text-anchor="middle" class="mint" font-size="28" font-weight="900">05</text>
    <text x="495" y="1188" class="white" font-size="25" font-weight="900">記録して公開する</text>
    <text x="495" y="1225" class="muted small">変更点を残し、版を上げて公開</text>

    <!-- Right checks -->
    <g filter="url(#shadow)"><rect x="925" y="305" width="220" height="745" rx="28" class="panel"/></g>
    <text x="955" y="355" class="cyan label">品質チェック</text>
    <line x1="955" y1="375" x2="1115" y2="375" stroke="#2e607d" stroke-width="2"/>
    <g transform="translate(955 425)" class="white body">
      <g transform="translate(0 0)"><path d="m0 0 8 8 15-18" class="check"/><text x="37" y="7">起動できる</text></g>
      <g transform="translate(0 72)"><path d="m0 0 8 8 15-18" class="check"/><text x="37" y="7">操作できる</text></g>
      <g transform="translate(0 144)"><path d="m0 0 8 8 15-18" class="check"/><text x="37" y="7">文字が読める</text></g>
      <g transform="translate(0 216)"><path d="m0 0 8 8 15-18" class="check"/><text x="37" y="7">音量が適切</text></g>
      <g transform="translate(0 288)"><path d="m0 0 8 8 15-18" class="check"/><text x="37" y="7">保存できる</text></g>
      <g transform="translate(0 360)"><path d="m0 0 8 8 15-18" class="check"/><text x="37" y="7">再開できる</text></g>
      <g transform="translate(0 432)"><path d="m0 0 8 8 15-18" class="check"/><text x="37" y="7">スマホ対応</text></g>
      <g transform="translate(0 504)"><path d="m0 0 8 8 15-18" class="check"/><text x="37" y="7">エラーなし</text></g>
    </g>
    <rect x="950" y="968" width="170" height="54" rx="14" fill="#15364b"/>
    <text x="1035" y="1002" text-anchor="middle" class="amber small">実機確認を忘れない</text>

    <!-- Bottom completion criteria -->
    <g filter="url(#shadow)"><rect x="55" y="1315" width="1090" height="290" rx="30" fill="#0d263e" stroke="#2a5874" stroke-width="2"/></g>
    <text x="90" y="1370" class="mint label">DONE — 完成の定義</text>
    <text x="90" y="1412" class="muted small">次の 4 つが揃ったら、ひとつの制作サイクルが完了。</text>
    <g transform="translate(90 1460)">
      <rect width="235" height="95" rx="20" fill="#102f45"/><circle cx="37" cy="47" r="20" fill="#55efb2"/><path d="m28 47 7 7 13-16" fill="none" stroke="#092137" stroke-width="4"/><text x="70" y="43" class="white body">遊べる</text><text x="70" y="69" class="muted" font-size="14">主要ループが成立</text>
      <g transform="translate(255 0)"><rect width="235" height="95" rx="20" fill="#102f45"/><circle cx="37" cy="47" r="20" fill="#55efb2"/><path d="m28 47 7 7 13-16" fill="none" stroke="#092137" stroke-width="4"/><text x="70" y="43" class="white body">壊れない</text><text x="70" y="69" class="muted" font-size="14">検証項目を通過</text></g>
      <g transform="translate(510 0)"><rect width="235" height="95" rx="20" fill="#102f45"/><circle cx="37" cy="47" r="20" fill="#55efb2"/><path d="m28 47 7 7 13-16" fill="none" stroke="#092137" stroke-width="4"/><text x="70" y="43" class="white body">伝わる</text><text x="70" y="69" class="muted" font-size="14">説明なしでも操作可能</text></g>
      <g transform="translate(765 0)"><rect width="235" height="95" rx="20" fill="#102f45"/><circle cx="37" cy="47" r="20" fill="#55efb2"/><path d="m28 47 7 7 13-16" fill="none" stroke="#092137" stroke-width="4"/><text x="70" y="43" class="white body">記録済み</text><text x="70" y="69" class="muted" font-size="14">変更点と版を更新</text></g>
    </g>
    <text x="600" y="1660" text-anchor="middle" class="muted" font-size="15" letter-spacing=".12em">PLAN → PROTOTYPE → BUILD → TEST → RELEASE → REPEAT</text>
  </g>
</svg>
