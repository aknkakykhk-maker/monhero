<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>助手紹介 一覧 止め絵</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#020617;color:#e2e8f0;font-family:"Hiragino Sans","Noto Sans JP","Noto Sans CJK JP",sans-serif;font-weight:700}
.scr{position:relative;overflow:hidden;background:linear-gradient(#1e1b4b,#0f172a 40%);display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.12)}
.back{border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:8px 10px;font-size:13px;background:#1e293b;color:#fff;white-space:nowrap}
.ttl{font-size:18px;font-weight:900;color:#fff}
.sub{font-size:11px;color:#a5b4fc}
.count{margin-left:auto;font-size:11px;background:#0f172a;border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:4px 9px;white-space:nowrap}
.grid{display:grid;gap:8px;padding:10px 12px}
.c{position:relative;border-radius:16px;padding:8px;background:#1e293bcc;border:2px solid var(--a);overflow:hidden;min-height:0}
.c::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,var(--a),transparent 65%);opacity:.28}
.c img{position:relative;display:block;border-radius:50%;object-fit:cover;background:#0f172a;border:2px solid var(--a)}
.c .n{position:relative;font-size:15px;color:#fff;font-weight:900}
.c .t{position:relative;font-size:10.5px;color:#cbd5e1;line-height:1.35;margin-top:2px;word-break:keep-all;overflow-wrap:anywhere}
.c .lv{position:relative;display:inline-block;margin-top:5px;font-size:10.5px;border-radius:999px;padding:2px 7px;background:#0f172acc}
.c .nw{position:absolute;right:6px;top:6px;font-size:10px;background:#fde047;color:#111;border-radius:999px;padding:2px 6px}
.c.unk{--a:#475569;background:#0f172a99}
.c.unk .q{position:relative;display:flex;align-items:center;justify-content:center;border-radius:50%;border:2px dashed #64748b;color:#64748b;background:#0f172a}
.c.unk .n{color:#94a3b8}
.foot{font-size:10.5px;color:#94a3b8;padding:0 12px 10px;line-height:1.5}
.tabs{margin-top:auto;display:flex;gap:4px;padding:6px 6px 8px;background:#0b1224;border-top:1px solid rgba(255,255,255,.12)}
.tabs span{flex:1;text-align:center;font-size:10px;border-radius:12px;padding:5px 0;background:#1e293b;color:#cbd5e1;border:1px solid rgba(255,255,255,.1)}
.tabs span b{display:block;font-size:17px}
.tabs span.on{background:#334155;border-color:#fde047;color:#fff}
.ann{position:absolute;background:#fde047;color:#111;font-size:12px;font-weight:900;border-radius:10px;padding:5px 8px;box-shadow:0 2px 8px #000a;z-index:5}
.ring{position:absolute;border:3px solid #fde047;border-radius:12px;box-shadow:0 0 0 3px #0008;z-index:5}
</style></head><body><div id="root"></div>
<script>
const IMG='../../../../monster-hero/images/assistant/face/';
const A=[['みゅあ','myua','#f472b6','明るく元気なムードメーカー',12],['きき','kiki','#f43f5e','おとなしいのに<br>火力で押し切るお姉さん',8],['ももすけ','momosuke','#f9a8d4','生意気かわいい小悪魔系アイドル',6],['ドラ','dra','#4ade80','下ネタまじりの冗談ばかり<br>なのに説明は上手いおじさん',5],['あつ','atsu','#ef4444','ぐいぐい上へ誘う、<br>人をよく見ている勇者',3],['きゅうこ','kyuko','#f472b6','無課金なのにランカー、<br>ゆるくて頭のいい育成上手',2],['ソラシド','sorashido','#2dd4bf','',0],['えるびん','erubin','#d6b47a','',0]];
const q=new URLSearchParams(location.search),m=q.get('m')||'tate';
function card(a,big,i,hideUnmet){const[n,p,ac,t,lv]=a;if(!lv){if(hideUnmet)return'';return `<div class="c unk"><div class="q" style="width:${big}px;height:${big}px;font-size:${big/2}px">？</div><div class="n">？？？</div><div class="t">まだ会っていません</div></div>`}
return `<div class="c" style="--a:${ac}">${i==1?'<span class="nw">NEW</span>':''}<img src="${IMG}${p}_happy.PNG" style="width:${big}px;height:${big}px"><div class="n">${n}</div><div class="t">${t}</div><span class="lv">💗 Lv${lv}</span></div>`}
function tabs(on){return `<div class="tabs"><span><b>🏡</b>家</span><span><b>📋</b>居場所</span><span><b>🤝</b>友情</span><span class="${on?'on':''}"><b>📖</b>紹介</span><span><b>🎒</b>道具</span><span><b>🏘️</b>フレンド</span></div>`}
function tate(hide){const list=A.map((a,i)=>card(a,64,i,hide)).join('');return `<div class="scr" style="width:390px;height:844px">
<div class="top"><div><div class="ttl">📖 助手紹介</div><div class="sub">選ぶと、その助手のことが分かります</div></div><span class="count">${hide?'6人':'会った助手 6/8'}</span></div>
<div class="grid" style="grid-template-columns:1fr 1fr">${list}</div>
<p class="foot">💗 好きなものは、贈ると分かって紹介に残ります。${hide?'':'まだ会っていない助手は、お話で出会うと紹介が開きます。'}</p>
${tabs(true)}</div>`}
function yoko(){const list=A.map((a,i)=>card(a,48,i,false)).join('');return `<div class="scr" style="width:844px;height:390px;flex-direction:row">
<div style="flex:1;display:flex;flex-direction:column;min-width:0">
<div class="top"><div><div class="ttl">📖 助手紹介</div><div class="sub">選ぶと、その助手のことが分かります</div></div><span class="count">会った助手 6/8</span></div>
<div class="grid" style="grid-template-columns:repeat(4,1fr)">${list}</div></div>
<div class="tabs" style="flex-direction:column;width:76px;margin:0;border-top:0;border-left:1px solid rgba(255,255,255,.12)"><span><b>🏡</b>家</span><span><b>📋</b>居場所</span><span><b>🤝</b>友情</span><span class="on"><b>📖</b>紹介</span><span><b>🎒</b>道具</span><span><b>🏘️</b>フレンド</span></div></div>`}
function entry(){return `<div class="scr" style="width:390px;height:844px"><img src="../walkthrough/daily-tate-first-view.png" style="width:390px;height:844px;position:absolute;inset:0">
<div style="position:absolute;left:0;right:0;bottom:0;height:62px;background:#0b1224">${tabs(false)}</div>
<div class="ring" style="left:196px;bottom:4px;width:64px;height:56px"></div>
<div class="ann" style="left:150px;bottom:70px">案A(推奨) 下のタブに「📖 紹介」</div>
<div style="position:absolute;right:96px;top:9px;background:#6366f1;color:#fff;border-radius:12px;padding:7px 8px;font-size:12px;z-index:4">📖 紹介</div>
<div class="ring" style="right:90px;top:4px;width:72px;height:40px"></div>
<div class="ann" style="right:60px;top:50px">案B 上の見出しの右</div></div>`}
document.getElementById('root').innerHTML=({tate:()=>tate(false),hide:()=>tate(true),yoko,entry})[m]();
</script></body></html>
