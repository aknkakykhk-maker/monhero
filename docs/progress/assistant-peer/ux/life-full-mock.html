<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>助手ライフ 作り込み</title>
<!-- 2026-11-07 ナカヨシ5。助手ライフの専用ページを作り込んだ止め絵(縦・横)。本物の絵: 町=HOME の村の絵(時間帯で塗り替え)/場面=お話の背景・助手の立ち絵/顔=助手の顔の絵 -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b1020;font-family:"Hiragino Sans","Noto Sans JP","WenQuanYi Zen Hei",sans-serif;color:#fff;padding:18px;width:max-content}
.row{display:flex;gap:18px;align-items:flex-start;margin-bottom:22px}
.cap{font-size:14px;font-weight:900;color:#fde68a;margin-bottom:6px;width:390px;line-height:1.4}
.cap.w{width:844px}.cap small{display:block;font-size:11px;color:#cbd5e1;font-weight:700}
.ph{width:390px;height:844px;border-radius:28px;border:2px solid #334155;overflow:hidden;position:relative;background:#070b1d}
.ld{width:844px;height:390px;border-radius:24px;border:2px solid #334155;overflow:hidden;position:relative;background:#070b1d}
.abs{position:absolute}
/* ===== 町の地図 ===== */
.map{position:absolute;overflow:hidden;background:#1b3b2c}
.map .art{position:absolute;left:0;top:0;transform-origin:0 0}
.map .art img.v{position:absolute;left:0;top:0;width:941px;height:1672px}
.map .sidefill{position:absolute;inset:-20px;background:url(../../../../monster-hero/data/images/home-background.jpg) center/cover;filter:blur(14px) brightness(.55)}
.tint{position:absolute;inset:0;pointer-events:none}
/* 時間帯 */
.t-morning img.v{filter:saturate(.8) brightness(1.06) sepia(.22) hue-rotate(-6deg)}
.t-morning .tint.a{background:linear-gradient(180deg,rgba(255,180,190,.42),rgba(255,226,170,.18) 45%,rgba(200,225,255,.22));mix-blend-mode:screen}
.t-morning .tint.b{background:linear-gradient(0deg,rgba(255,255,255,.5),rgba(255,255,255,0) 40%)}
.t-noon .tint.a{background:radial-gradient(ellipse 120px 60px at 30% 40%,rgba(0,20,40,.18),transparent),radial-gradient(ellipse 140px 70px at 80% 75%,rgba(0,20,40,.16),transparent)}
.t-evening img.v{filter:saturate(1.1) brightness(.92)}
.t-evening .tint.a{background:linear-gradient(180deg,rgba(255,110,70,.7),rgba(255,150,80,.5) 50%,rgba(110,50,90,.6));mix-blend-mode:multiply}
.t-evening .tint.b{background:linear-gradient(110deg,rgba(255,200,120,.35),transparent 55%);mix-blend-mode:screen}
.t-night img.v{filter:brightness(.42) saturate(.65) hue-rotate(-12deg)}
.t-night .tint.a{background:linear-gradient(180deg,rgba(30,40,110,.55),rgba(20,30,80,.35));mix-blend-mode:multiply}
.glow{position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:screen}
.win{background:radial-gradient(circle,rgba(255,214,120,.95),rgba(255,170,60,.35) 40%,transparent 70%)}
.lamp{background:radial-gradient(circle,rgba(255,236,170,.9),rgba(255,200,90,.25) 45%,transparent 70%)}
.blue{background:radial-gradient(circle,rgba(140,220,255,.9),rgba(60,160,255,.3) 45%,transparent 70%)}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:0 0 4px #fff}
.fly{position:absolute;width:4px;height:4px;border-radius:50%;background:#e9ff9a;box-shadow:0 0 8px 2px #d9f99d}
.mote{position:absolute;font-size:13px;opacity:.9;text-shadow:0 1px 3px #0009}
/* 場所の札と顔 */
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center}
.pin .who{display:flex;align-items:center;padding:2px 4px;border-radius:999px;background:rgba(2,6,23,.62);border:1px solid rgba(255,255,255,.4);box-shadow:0 3px 10px #000a;position:relative}
.pin .who img{width:30px;height:30px;border-radius:50%;border:2px solid #fff;background:#334155;object-fit:cover}
.pin .who img+img{margin-left:-9px}
.pin .who img.lonely{border-color:#fbbf24;box-shadow:0 0 8px #fbbf24}.pin .who img.after{border-color:#7dd3fc}
.pin .bond{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:900;white-space:nowrap;background:linear-gradient(90deg,#f472b6,#fb923c);border-radius:999px;padding:0 6px;border:1px solid #fff8}
.pin .eye{position:absolute;right:-12px;top:-10px;width:20px;height:20px;border-radius:50%;background:#fde047;color:#422006;font-size:11px;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 0 10px #fde047}
.pin .bub{position:absolute;left:100%;top:-6px;margin-left:8px;white-space:nowrap;font-size:9px;font-weight:800;background:#fff;color:#1e293b;border-radius:10px;padding:2px 7px;box-shadow:0 2px 6px #0007}
.pin .bub:before{content:"";position:absolute;left:-4px;top:7px;border:4px solid transparent;border-right-color:#fff;border-left:0}
.pin .zz{position:absolute;right:-10px;top:-12px;font-size:13px}
.plq{margin-top:3px;display:flex;align-items:center;gap:3px;font-size:10px;font-weight:900;padding:2px 8px 2px 5px;border-radius:8px;background:linear-gradient(#5b3a1e,#3b2412);border:1.5px solid #e8c37a;color:#fff3d6;box-shadow:0 2px 6px #000b;white-space:nowrap}
.plq i{font-style:normal;font-size:12px}
.pin.empty .plq{opacity:.78;filter:saturate(.6)}
.pin.lock .plq{background:#1f2937;border-color:#64748b;color:#94a3b8}
.edge{position:absolute;display:flex;align-items:center;gap:4px;font-size:10px;font-weight:900;padding:3px 8px 3px 5px;border-radius:999px;background:rgba(2,6,23,.78);border:1px solid #fde68a99}
.edge img{width:22px;height:22px;border-radius:50%;border:1.5px solid #fff;object-fit:cover}.edge img+img{margin-left:-7px}
/* ===== 画面の部品(モンヒロビートの入口とそろえる) ===== */
.hdr{position:absolute;left:0;right:0;top:0;padding:10px 12px 8px;background:linear-gradient(180deg,#140b2e,#140b2ef0 70%,#140b2e00);z-index:5}
.hdr .back{position:absolute;left:12px;top:14px;width:30px;height:30px;display:grid;place-items:center;font-size:18px;color:#e2e8f0}
.hdr .en{margin-left:38px;font-size:9px;letter-spacing:.18em;font-weight:900;color:#f9a8d4}
.hdr .ti{margin-left:38px;font-size:22px;font-weight:900;line-height:1.05;background:linear-gradient(90deg,#fff,#fbcfe8 60%,#fde68a);-webkit-background-clip:text;color:transparent}
.clock{position:absolute;right:10px;top:8px;text-align:right;border-radius:12px;padding:4px 8px;border:1px solid #ffffff33;background:rgba(15,23,42,.7)}
.clock b{display:block;font-size:12px}.clock small{font-size:9px;color:#cbd5e1}
.meter{display:flex;align-items:center;gap:6px;margin:10px 0 0 38px;font-size:10px;font-weight:900}
.meter .chip{display:flex;align-items:center;gap:3px;background:linear-gradient(90deg,#be185d,#f59e0b);padding:1px 7px;border-radius:999px;font-size:10px}
.meter .bar{flex:1;height:7px;border-radius:9px;background:#ffffff1f;overflow:hidden;position:relative}.meter .bar i{position:absolute;inset:0;width:58%;background:linear-gradient(90deg,#f472b6,#fbbf24)}
.meter .bar s{position:absolute;top:0;bottom:0;width:2px;background:#0b1020}
.meter small{color:#cbd5e1;font-size:9px;white-space:nowrap}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{position:relative;height:66px;border-radius:12px;padding:8px 10px 6px 50px;clip-path:polygon(0 0,92% 0,100% 22%,100% 100%,0 100%);overflow:hidden;box-shadow:inset 0 -4px 0 #0003}
.tile .ic{position:absolute;left:8px;top:12px;font-size:28px;filter:drop-shadow(0 2px 2px #0006)}
.tile b{display:block;font-size:17px;font-weight:900;line-height:1.15;text-shadow:0 1px 2px #0007}
.tile small{display:block;font-size:9.5px;font-weight:800;line-height:1.25;opacity:.95}
.tile .wm{position:absolute;right:6px;bottom:-4px;font-size:22px;font-weight:900;font-style:italic;color:#fff;opacity:.2;letter-spacing:.02em}
.tile .cnt{position:absolute;right:12px;top:8px;font-size:10px;font-weight:900;background:#0f172acc;border-radius:999px;padding:1px 6px}
.watch{background:linear-gradient(135deg,#fb7185,#f59e0b)}.call{background:linear-gradient(135deg,#38bdf8,#6366f1)}
.give{background:linear-gradient(135deg,#34d399,#16a34a)}.visit{background:linear-gradient(135deg,#475569,#1e293b);color:#cbd5e1}
.visit b{color:#e2e8f0}
.people{display:flex;justify-content:space-between;padding:6px 8px;border-radius:14px;background:rgba(15,23,42,.75);border:1px solid #ffffff1f}
.pp{display:flex;flex-direction:column;align-items:center;width:40px;position:relative}
.pp img{width:34px;height:34px;border-radius:50%;border:2px solid #fff;object-fit:cover;background:#334155}
.pp img.lonely{border-color:#fbbf24;box-shadow:0 0 8px #fbbf24}
.pp .at{position:absolute;right:0;top:20px;font-size:10px;background:#0f172a;border-radius:50%;width:16px;height:16px;display:grid;place-items:center;border:1px solid #fff6}
.pp span{font-size:8.5px;font-weight:900;color:#fbcfe8;margin-top:1px;white-space:nowrap}
.icons{display:flex;gap:6px}
.icons span{flex:1;height:52px;border-radius:12px;background:rgba(30,41,59,.85);border:1px solid #ffffff2a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9.5px;font-weight:900;color:#e2e8f0;position:relative}
.icons span i{font-style:normal;font-size:18px;line-height:1.1}
.icons span.on{background:linear-gradient(#f472b633,#f472b611);border-color:#f9a8d4;color:#fff}
.icons span.lock{opacity:.5}.icons span .bd{position:absolute;right:4px;top:3px;width:8px;height:8px;border-radius:50%;background:#ef4444}
.lbl{font-size:10px;font-weight:900;color:#cbd5e1;margin:0 0 4px 2px;display:flex;justify-content:space-between}
.lbl em{font-style:normal;color:#94a3b8;font-weight:700}
/* 場面 */
.scene{position:absolute;inset:0;overflow:hidden}
.scene .bgimg{position:absolute;inset:0;background-size:cover;background-position:center}
.stand{position:absolute;bottom:0;object-fit:contain;object-position:bottom;filter:drop-shadow(0 6px 12px #0008)}
.talk{position:absolute;border-radius:16px;border:2px solid #f472b6;background:rgba(2,6,23,.93);padding:10px 12px}
.talk .nm{font-size:11px;font-weight:900;color:#f9a8d4;display:flex;align-items:center;gap:5px}
.talk .nm img{width:22px;height:22px;border-radius:50%;border:1.5px solid #f9a8d4}
.talk p{font-size:13.5px;font-weight:700;line-height:1.55;margin-top:3px}
.talk .nx{position:absolute;right:10px;bottom:6px;font-size:9px;color:#f9a8d4;font-weight:900}
.emo{position:absolute;font-size:22px;filter:drop-shadow(0 2px 3px #0008)}
.gain{display:flex;gap:6px;justify-content:center}
.gain span{font-size:13px;font-weight:900;border-radius:999px;padding:5px 11px;background:rgba(15,23,42,.88);border:1.5px solid #fde68a;box-shadow:0 0 18px #fbbf2499}
.spark{position:absolute;color:#fde68a;font-size:14px;text-shadow:0 0 8px #fbbf24}
.acts{display:flex;gap:6px}.acts span{flex:1;text-align:center;font-size:12px;font-weight:900;border-radius:12px;padding:10px 0;color:#fff}
.note{position:absolute;font-size:10px;font-weight:800;color:#0b1020;background:#fde68a;border-radius:8px;padding:2px 7px;box-shadow:0 2px 6px #0008;z-index:20;white-space:nowrap}
.ab{position:absolute;font-size:11px;font-weight:900;color:#fff;background:#db2777;border-radius:8px;padding:2px 7px;z-index:21}
.panel{position:absolute;border-radius:16px;background:rgba(15,23,42,.92);border:1px solid #ffffff22}
</style></head><body>
<div id="root"></div>
<script>
const R='../../../../monster-hero/';
const F=(id,e='happy')=>`${R}images/assistant/face/${id}_${e}.PNG`;
const ST=(id,e='happy')=>`${R}images/assistant/${id}_${e}.PNG`;
// 場所(HOME の村の絵の上の位置。絵の元の大きさ 941×1672)
const P={studio:[230,360,'🎵','練習スタジオ'],ranch:[95,640,'🥚','育成場'],library:[760,410,'📚','図書室'],garden:[640,560,'🌷','中庭'],
 plaza:[478,790,'⛲','広場'],cafe:[150,880,'🍰','おやつ屋さん'],market:[810,930,'🛍','マーケット'],home:[70,1090,'🏡','みんなの家'],
 cardroom:[460,1370,'🃏','カード部屋'],hill:[800,170,'🌄','ひなたの丘']};
// いまの様子(HOME の止め絵と同じ)
const NOW={plaza:{who:[['kiki','happy'],['myua','happy']],bond:'🤝Lv5 名コンビ',eye:1,bub:'おやつ中…'},
 studio:{who:[['momosuke','excited'],['atsu','happy']],bond:'🤝Lv2',eye:1,bub:'♪ 練習中'},
 library:{who:[['kyuko','normal']],bub:'読書中'},home:{who:[['dra','troubled','lonely']],bub:'さみしそう…'},
 cardroom:{who:[['sorashido','excited'],['erubin','happy']],eye:1}};
const NIGHT={plaza:{who:[['kiki','normal'],['myua','happy'],['kyuko','happy']],bond:'🤝3人',eye:1,bub:'星を見に…'},
 studio:{who:[['momosuke','excited']],bub:'♪ 夜の練習'},home:{who:[['dra','normal'],['atsu','happy']],zz:1,bub:'おやすみ'},
 cardroom:{who:[['sorashido','excited'],['erubin','happy']],eye:1,bub:'計算中…'}};
const glows=(t,s)=>{ if(t!=='night') return '';
 const W=[[190,330,40],[260,380,30],[700,430,34],[770,470,30],[120,860,34],[170,900,28],[780,960,40],[860,980,30],[430,1330,46],[500,1330,46],[300,1500,60],[640,1500,60]];
 const L=[[470,760,60],[640,560,90,'blue'],[478,790,70,'blue'],[340,1060,40],[600,1060,40]];
 return W.map(([x,y,r])=>`<div class="glow win" style="left:${x-r}px;top:${y-r}px;width:${2*r}px;height:${2*r}px"></div>`).join('')+
   L.map(([x,y,r,c])=>`<div class="glow ${c||'lamp'}" style="left:${x-r}px;top:${y-r}px;width:${2*r}px;height:${2*r}px"></div>`).join('');};
const motes=(t)=>{ // 場所ごとの小さな動き(止め絵では1こま)
 const m={morning:[[280,300,'🐦'],[330,280,'🐦'],[160,830,'♨']],noon:[[250,300,'♪'],[290,270,'♫'],[160,830,'♨'],[470,1300,'✦'],[840,880,'🎏']],
  evening:[[250,300,'♪'],[160,830,'♨'],[470,1300,'✦'],[520,1320,'✦']],night:[[250,300,'♪'],[470,1300,'✦']]}[t]||[];
 return m.map(([x,y,c])=>`<div class="mote" style="left:${x}px;top:${y}px;font-size:${c==='♨'?22:26}px">${c}</div>`).join('');};
const stars=(t,w,h)=>{ if(t!=='night') return ''; let s='';let k=7;for(let i=0;i<40;i++){k=(k*9301+49297)%233280;const x=k%941;k=(k*9301+49297)%233280;const y=k%260;s+=`<div class="star" style="left:${x}px;top:${y}px;opacity:${.4+(i%5)/8}"></div>`;}
 for(let i=0;i<14;i++){k=(k*9301+49297)%233280;const x=k%941;k=(k*9301+49297)%233280;const y=500+k%900;s+=`<div class="fly" style="left:${x}px;top:${y}px"></div>`;} return s;};
// 地図: w,h=窓の大きさ / sc=絵の縮尺 / oy=絵の上を何px切るか(元の大きさで)/ ox=横のずらし(画面px)
function map({w,h,sc,oy,ox=0,t='noon',now=NOW,pins=true,edges=true,top=0,left=0,side=false}){
 const dx=ox, art=`<div class="art" style="transform:translate(${dx}px,${-oy*sc}px) scale(${sc})"><img class="v" src="${R}data/images/home-background.jpg">${glows(t)}${stars(t)}${motes(t)}</div>`;
 let pinH='';
 if(pins) for(const [k,[x,y,ic,nm]] of Object.entries(P)){
  const sx=dx+x*sc, sy=(y-oy)*sc; if(sy<40||sy>h-4||sx<0||sx>w) continue;
  const n=now[k];
  pinH+=`<div class="pin ${n?'':'empty'}" style="left:${sx}px;top:${sy}px">${n?`<div class="who">${n.bond?`<span class="bond">${n.bond}</span>`:''}${n.who.map(([i,e,c])=>`<img class="${c||''}" src="${F(i,e)}">`).join('')}${n.eye?'<span class="eye">👀</span>':''}${n.zz?'<span class="zz">💤</span>':''}${n.bub?`<span class="bub">${n.bub}</span>`:''}</div>`:''}<div class="plq"><i>${ic}</i>${nm}</div></div>`;}
 let edgeH='';
 if(edges) for(const [k,[x,y,ic,nm]] of Object.entries(P)){ const sy=(y-oy)*sc; const n=now[k]; if(!n) continue;
  if(sy<40) edgeH+=`<div class="edge" style="left:${Math.min(w-150,dx+x*sc-40)}px;top:8px">▲ ${ic}${nm}${n.who.map(([i,e])=>`<img src="${F(i,e)}">`).join('')}</div>`;
  if(sy>h-4) edgeH+=`<div class="edge" style="left:${Math.max(6,dx+x*sc-70)}px;bottom:8px">▼ ${ic}${nm}${n.who.map(([i,e])=>`<img src="${F(i,e)}">`).join('')}${n.eye?' 👀':''}</div>`;}
 return `<div class="map t-${t}" style="left:${left}px;top:${top}px;width:${w}px;height:${h}px">${side?'<div class="sidefill"></div>':''}${art}<div class="tint a"></div><div class="tint b"></div>${pinH}${edgeH}</div>`;}
const header=({t='noon',clock='☀ 昼 10〜14時',left='午後まで あと1時間12分',land=false}={})=>`<div class="hdr" style="${land?'right:auto;width:100%':''}"><div class="back">←</div><div class="en">ASSISTANT LIFE · TOWN</div><div class="ti">助手ライフ</div>
 <div class="clock"><b>${clock}</b><small>${left}</small></div>
 <div class="meter"><span class="chip">🎉 にぎやか ×1.5</span><span class="bar"><i></i><s style="left:17%"></s><s style="left:50%"></s></span><small>お祭りまで 50</small></div></div>`;
const tiles=(cmp)=>`<div class="tiles">
 <div class="tile watch"><span class="ic">👀</span><span class="cnt">あと14</span><b>見守る</b><small>3か所で話してる</small><span class="wm">WATCH</span></div>
 <div class="tile call"><span class="ic">💬</span><span class="cnt">無料</span><b>声をかける</b><small>ドラがさみしそう</small><span class="wm">INVITE</span></div>
 <div class="tile give"><span class="ic">🧺</span><span class="cnt">あと1回</span><b>渡す</b><small>差し入れ2・しるし1</small><span class="wm">GIFT</span></div>
 <div class="tile visit"><span class="ic">🔒</span><b>訪ねる</b><small>だれかと友情Lv5で開く</small><span class="wm">VISIT</span></div></div>`;
const PEOPLE=[['myua','happy','⛲','Lv5'],['kiki','happy','⛲','Lv4'],['momosuke','excited','🎵','Lv3'],['dra','troubled','🏡','Lv3','lonely'],['atsu','happy','🎵','Lv2'],['kyuko','normal','📚','Lv2'],['sorashido','excited','🃏','Lv1'],['erubin','happy','🃏','Lv1']];
const people=(sz)=>`<div class="people">${PEOPLE.map(([i,e,at,lv,c])=>`<div class="pp" ${sz?`style="width:${sz}px"`:''}><img class="${c||''}" src="${F(i,e)}" ${sz?`style="width:${sz-8}px;height:${sz-8}px"`:''}><span class="at" ${sz?`style="top:${sz-26}px"`:''}>${at}</span><span>💗${lv}</span></div>`).join('')}</div>`;
const icons=()=>`<div class="icons"><span class="on"><i>🗺</i>町</span><span><i>🤝</i>友情<b class="bd"></b></span><span><i>📖</i>アルバム</span><span><i>🎒</i>道具</span><span><i>❓</i>遊びかた</span></div>`;

let html='<section id="tate">';
html+=`<div class="row">
<div><p class="cap">① HOME(縦): 遊んでいる所の施設の横に顔だけ(本物の HOME に重ねた)<small>🎵ビート=練習中の2人 / 🃏カード=カード研究の2人 / 新しい施設「🏡 助手ライフ」=町と家にいる4人(さみしそうな子は黄色の縁)。帯は作らない</small></p><div class="ph"><img src="life-home-faces-p.png" style="width:100%;height:100%"></div></div>
<div><p class="cap">①' 8人が全部 町・家にいる日も、上限で切らずに全部出す<small>4人ずつ2段に並べる(札の高さに合わせる)。顔を押すと、その子のいる場面へ</small></p><div class="ph"><img src="life-home-all8-p.png" style="width:100%;height:100%"></div></div>
`;
// ===== 縦 1段目: 町(昼)・町(夜)・場面 =====
html+=`
<div><p class="cap">② 助手ライフ(縦・昼)<small>モンヒロビートの入口と同じ組み立て: 英字の小見出し+大きい題・にぎわいの帯・大きな絵(町)・色の大きな札4枚・下のアイコンの列</small></p><div class="ph">
