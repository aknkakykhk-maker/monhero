<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000"><canvas id="c"></canvas>
<script>
const q=new URLSearchParams(location.search);const LAND=q.get('o')==='l';const R=parseFloat(q.get('r')||'.39');
const W=LAND?844:390,H=LAND?390:640;const c=document.getElementById('c');const dpr=2;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';
const x=c.getContext('2d');x.scale(dpr,dpr);
const topY=LAND?14:30,botY=H-(LAND?6:30),gY=H-(LAND?46:84),sY=gY-R*H;
const cx=W/2;const halfW=y=>{const t=(y-topY)/(botY-topY);return (LAND?70:46)+((LAND?330:182)-(LAND?70:46))*t;};
const lane=(y,u)=>cx+halfW(y)*(u*2-1);
// 背景(曲の絵のかわりに暗い紫)
let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a1038');g.addColorStop(.5,'#120b2c');g.addColorStop(1,'#0a0618');x.fillStyle=g;x.fillRect(0,0,W,H);
// 道: 無地の紫。レーンの線はほぼ見せない(区切りは地上の判定ラインの目盛りだけ)
x.beginPath();x.moveTo(lane(topY,0),topY);x.lineTo(lane(topY,1),topY);x.lineTo(lane(botY,1),botY);x.lineTo(lane(botY,0),botY);x.closePath();
g=x.createLinearGradient(0,topY,0,botY);g.addColorStop(0,'#1c1442');g.addColorStop(1,'#2a1d5c');x.fillStyle=g;x.fill();x.strokeStyle='rgba(200,180,255,.22)';x.lineWidth=1;x.stroke();
// 地上の判定ライン: 太い紫
x.fillStyle='rgba(192,132,252,.9)';x.fillRect(lane(gY,0)-4,gY-2,lane(gY,1)-lane(gY,0)+8,4);
// 空中の判定ライン: 道の外まで横いっぱいの細い光の帯1本だけ(面・柱・字は無し)
g=x.createLinearGradient(0,sY-5,0,sY+5);g.addColorStop(0,'rgba(220,200,255,0)');g.addColorStop(.5,'rgba(235,225,255,.9)');g.addColorStop(1,'rgba(220,200,255,0)');x.fillStyle=g;x.fillRect(0,sY-5,W,10);
// ---- 地上のノーツ: 不透明な白い厚い板(上面+手前の厚み)・光らない ----
const groundPlate=(y,u0,u1)=>{const a=lane(y,u0),b=lane(y,u1),h=LAND?7:9,th=LAND?4:5;x.fillStyle='#f4f6ff';x.fillRect(a,y-h/2,b-a,h);x.fillStyle='#aeb6d8';x.fillRect(a,y+h/2,b-a,th);x.fillStyle='rgba(255,255,255,.9)';x.fillRect(a,y-h/2,b-a,1);};
// ---- 空中のタップ: 半透明のガラスの箱(厚みあり・色は地上と同じ白〜薄い水色)+真下に同じ形の塗った灰色の影 ----
const flo=y=>y+(gY-sY);
const shadow=(u0,u1,y)=>{const yy=flo(y);const a=lane(yy,u0),b=lane(yy,u1),h=LAND?12:16,th=LAND?7:10;x.fillStyle='rgba(120,110,150,.6)';x.fillRect(a,yy-h/2,b-a,h+th);};
const glassBox=(u0,u1,y)=>{const a=lane(y,u0),b=lane(y,u1),h=LAND?12:16,th=LAND?7:10;
 // 上面
 x.fillStyle='rgba(215,235,255,.48)';x.fillRect(a,y-h/2,b-a,h);
 // 手前の厚み(少し濃い)
 x.fillStyle='rgba(160,200,245,.30)';x.fillRect(a,y+h/2,b-a,th);
 x.strokeStyle='rgba(235,245,255,.95)';x.lineWidth=1;x.strokeRect(a+.5,y-h/2+.5,b-a-1,h+th-1);x.beginPath();x.moveTo(a,y+h/2);x.lineTo(b,y+h/2);x.stroke();};
const air=[[.12,.34,sY-190],[.58,.80,sY-120],[.30,.50,sY-300]];
air.forEach(([a,b,y])=>shadow(a,b,y));
// 地上のノーツ(影より手前)
groundPlate(gY-210,.1,.3);groundPlate(gY-150,.62,.84);groundPlate(gY-80,.34,.54);groundPlate(gY-30,.6,.82);
// ---- アーク: なめらかな半透明の帯。左手=青・右手=桃。手前の端(指のある点)は星形に光る ----
const smooth=(pts)=>{x.moveTo(...pts[0]);for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;x.quadraticCurveTo(pts[i][0],pts[i][1],mx,my);}x.lineTo(...pts[pts.length-1]);};
const arc=(pts,col,core)=>{
 // 影: 同じ形を床へ(塗った灰色・細く)
 x.beginPath();smooth(pts.map(p=>[p[0],flo(p[1])]));x.strokeStyle='rgba(120,110,150,.5)';x.lineWidth=6;x.lineCap='round';x.lineJoin='round';x.stroke();
 // 帯(先細り: 奥が細く手前が太い)を線分の連なりで
 for(let pass=0;pass<2;pass++){x.globalCompositeOperation='lighter';
  const N=90;for(let i=0;i<N;i++){const t0=i/N,t1=(i+1)/N;const P=t=>{const k=t*(pts.length-1),j=Math.min(pts.length-2,Math.floor(k)),f=k-j;const m=(a,b)=>a+(b-a)*(f*f*(3-2*f));return [m(pts[j][0],pts[j+1][0]),m(pts[j][1],pts[j+1][1])];};
   const p0=P(t0),p1=P(t1);const w=(2.5+t0*(LAND?9:12))*(pass?.35:1);x.beginPath();x.moveTo(...p0);x.lineTo(...p1);x.lineWidth=w*2;x.lineCap='butt';x.strokeStyle=pass?core:col;x.globalAlpha=pass?.5:.34;x.stroke();}
  x.globalAlpha=1;}
 x.globalCompositeOperation='source-over';};
const star=(px,py,r,col)=>{x.globalCompositeOperation='lighter';let gg=x.createRadialGradient(px,py,1,px,py,r);gg.addColorStop(0,'rgba(255,255,255,.95)');gg.addColorStop(.3,col);gg.addColorStop(1,'rgba(244,114,182,0)');x.fillStyle=gg;x.beginPath();x.arc(px,py,r,0,7);x.fill();
 x.fillStyle='rgba(255,255,255,.9)';[[1,0],[0,1],[.7,.7],[.7,-.7]].forEach(([dx,dy],i)=>{const L=r*(i<2?1.1:.7);x.beginPath();x.moveTo(px-dx*L,py-dy*L);x.lineTo(px+dy*1.8,py+dx*1.8);x.lineTo(px+dx*L,py+dy*L);x.lineTo(px-dy*1.8,py-dx*1.8);x.closePath();x.fill();});x.globalCompositeOperation='source-over';};
arc([[lane(topY+10,.30),topY+10],[lane(topY+60,.32),topY+60],[lane(sY-70,.34),sY-70],[lane(sY-14,.42),sY-14],[lane(sY,.45),sY]],'rgb(56,189,248)','rgb(224,247,255)');
arc([[lane(topY+30,.66),topY+30],[lane(topY+90,.62),topY+90],[lane(sY-60,.64),sY-60],[lane(sY-10,.70),sY-10],[lane(sY,.72),sY]],'rgb(244,114,182)','rgb(255,232,244)');
// 空中のガラスの箱は影・帯より手前
air.forEach(([a,b,y])=>glassBox(a,b,y));
// ---- 押した光: 地上も空中も同じ桃色の星を、当たった点に ----
star(lane(sY,.45),sY,26,'rgba(244,114,182,.75)');star(lane(sY,.72),sY,26,'rgba(244,114,182,.75)');
star(lane(gY,.20),gY,24,'rgba(244,114,182,.75)');
// 数字(コンボ): 道の真ん中に薄く
x.fillStyle='rgba(255,255,255,.18)';x.font='bold '+(LAND?46:56)+'px sans-serif';x.textAlign='center';x.fillText('612',cx,gY-(LAND?60:110));
// 高さの差の目盛り
x.fillStyle='#fbbf24';x.font='bold 11px sans-serif';x.textAlign='left';x.fillText('高さの差 '+Math.round(R*100)+'%',8,H-10);
</script>
